<!doctype html>
<!-- data-i18n-packs: which curated dictionaries /i18n.js must load on this shell, regardless of
     route. The Seeker app is a HASH-ROUTED bundle — its path is always "/" (or "/index.html") and
     the school lives at "#/school" — so i18n.js's `location.pathname.indexOf("/school") === 0`
     rule never matched and the curated school dictionary never loaded: 56 of the 58 lesson intros
     are professionally translated in <lang>.school.json and all six non-English languages were
     machine-translating them instead, per view, at a cost. (Codex, PR #390.)
     Declared rather than sniffed, because a hash check at load time is racy: the app boots at "#/"
     and only then redirects to "#/school". This shell IS the school, so it says so. -->
<html lang="en" data-i18n-packs="school">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Cluck Norris — the free Solana crypto school in your pocket, plus the tools it teaches with: rent reclaim, wallet checkup, the AI tutor and more." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/theme.css" />
    <title>Cluck Norris</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shared browser modules (CLAUDE.md: "don't re-type these into a page") — plain, blocking
         scripts so they run before the module below mounts the app. cluck-wallet.js is the
         MWA-aware registry: MWA inside the Capacitor app, the same legacy/standard detection
         everywhere else. i18n.js populates window.CLKN_I18N.dict, which the app's own t()
         (src/seeker/i18n.js) reads — same pattern as public/hub-glossary.html / solana-room.html. -->
    <script src="/cluck-util.js"></script>
    <!-- EDU:OUT — everything between these markers is the WALLET half of the shell, and the Google
         Play / iOS edition (docs/STORE_EDITION.md: no wallet, no payments, no address) is built
         WITHOUT it: vite.config.js strips this block when the edition is google or ios, the same
         way it strips the website's own edition blocks from index.html. The education edition's own module
         (src/seeker/edition/edu.jsx) never references any of these globals, and the store build
         refuses their filenames in the bundle, so a missing strip fails loudly rather than
         shipping a wallet into an app whose listing says it has none. -->
    <script src="/cluck-wallet.js"></script>
    <script src="/rent-math.js"></script>
    <!-- The unified tools pass (public/cluck-gate.js) — the ONE pass client the whole platform
         uses. Without this file window.CluckGate does not exist, src/seeker/pass.js resolves
         every pane to "off", and the pass-tier tools fail open in the shipped app. The desktop
         gate CARD it also carries is never rendered here: the app calls config/pass/proof/fetch/
         denied/grant and replaces guard()'s DOM with its own native sheet (pass.js header). -->
    <script src="/cluck-gate.js"></script>
    <!-- web3.js is a VENDORED IIFE, never a vite/npm import — importing @solana/web3.js through
         vite needs the Node Buffer global browsers don't have and we ship no polyfill, which has
         silently killed money paths before (AGENTS.md). Same file public/airdrop-engine.js relies
         on. Must load before rent-reclaim-plan.js's browser seam (src/seeker/reclaim-sign.js). -->
    <script src="/vendor/solana-web3-1.95.8.iife.min.js"></script>
    <!-- Rent Reclaim SIGNING decisions (increment 3) — pure, dependency-free, dual-exported the
         same way rent-math.js is (see that file's header): required by Node tests AND loaded here
         as window.CluckReclaimPlan for src/seeker/reclaim-sign.js to drive. -->
    <script src="/rent-reclaim-plan.js"></script>
    <!-- The airdropper. airdrop-engine.js is the platform's ONE audited batch-transfer path
         (shared by /airdrop, Buy Special, the CUNA payout desk and the Hub desk) — the Seeker
         pane drives it rather than carrying a private copy, which is CLAUDE.md's rule about
         shared browser modules applied where a drifted copy would cost the most. It needs the
         vendored web3 IIFE above it, and it also installs window.splToken, which cluck-gate.js's
         pay leg looks for. airdrop-plan.js is the pure parse/cost half, dual-exported so
         scripts/seeker-airdrop-test.cjs can require() the same decisions the app runs. -->
    <script src="/airdrop-engine.js"></script>
    <script src="/airdrop-plan.js"></script>
    <!-- /EDU:OUT -->
    <!-- Collision-avoidance for the bottom-pinned 🌐 pill. The website gets this via
         cluck-nav.js, which this bundled shell does not load — without it i18n.js's
         `if (window.__clknDockFloat)` guard no-ops and the pill sits on the course cards. -->
    <script src="/clkn-dock-float.js"></script>
    <script src="/i18n.js"></script>
    <script type="module" src="/src/seeker/main.jsx"></script>
  </body>
</html>
