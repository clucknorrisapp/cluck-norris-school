<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../brand.css">
<style>
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#000}
  /* Full-bleed hero art (a finished piece, not a cutout) brought to life:
     breathing camera, rain streaks, neon pulse, flickering vignette. */
  #art{position:absolute;left:50%;top:50%;width:100vw;height:100vh;object-fit:cover;will-change:transform}
  .drop{position:absolute;width:0.18vw;background:linear-gradient(180deg,transparent,rgba(255,255,255,.5));
        border-radius:1vw;will-change:transform,opacity}
  #neon{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;will-change:opacity;
        background:radial-gradient(circle at 18% 12%, rgba(255,47,160,.5) 0%, transparent 42%),
                   radial-gradient(circle at 85% 75%, rgba(255,47,160,.28) 0%, transparent 38%)}
  #sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;will-change:transform,opacity;
        background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%)}
  #vig{position:absolute;inset:0;pointer-events:none;will-change:opacity;
       background:radial-gradient(circle at 50% 45%, transparent 52%, rgba(10,0,10,.55) 100%)}
  #mark{position:absolute;right:3vw;bottom:2.5vh;font:400 6vw/1 var(--cuna-font);color:var(--cuna-cream);
        opacity:.9;-webkit-text-stroke:0.3vw var(--cuna-outline);paint-order:stroke fill;will-change:transform;
        filter:drop-shadow(0 0 1.5vw rgba(255,47,160,.6))}
</style>
<img id="art"><div id="rainbox"></div><div id="neon"></div><div id="sheen"></div><div id="vig"></div><div id="mark"></div>
<script>
const TAU=Math.PI*2;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let z=Math.imul(seed^seed>>>15,1|seed);z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296}}
const R=rng(4242),drops=[];
window.setup=(src,text)=>{
  document.getElementById('mark').textContent=text;
  const rb=document.getElementById('rainbox');
  for(let i=0;i<70;i++){
    const el=document.createElement('div');el.className='drop';
    const layer=i%3;                                 // 3 depth layers
    el.style.height=(3+layer*2.5+R()*2)+'vh';
    el.style.opacity=String(0.16+layer*0.11);
    drops.push({el,x:R()*100,y0:R()*130,fall:130*(2+layer*2),drift:1.5+layer});
    rb.appendChild(el);
  }
  const a=document.getElementById('art');
  a.onload=()=>{window.__ready=true};
  a.onerror=()=>{window.__ready=true};
  a.src=src;
};
window.setT=(t)=>{
  // breathing camera: gentle zoom + drift, sin-based so the loop closes perfectly
  const z=1.045+0.035*Math.sin(TAU*t);
  const dx=1.1*Math.sin(TAU*t+1.3), dy=0.8*Math.cos(TAU*t);
  document.getElementById('art').style.transform=`translate(calc(-50% + ${dx}vw), calc(-50% + ${dy}vh)) scale(${z})`;
  // rain: fast mod-wrapped fall with slight wind drift (integer cycles => seamless)
  drops.forEach(d=>{
    const y=((d.y0 + t*d.fall) % 130) - 15;
    d.el.style.transform=`translate(${(d.x + t*d.drift) % 100}vw, ${y}vh) rotate(6deg)`;
  });
  // neon breathing + occasional flicker dips
  const flick=Math.sin(TAU*t*7)>0.92?0.55:1;
  document.getElementById('neon').style.opacity=String((0.5+0.4*Math.sin(TAU*t+0.8))*flick);
  // slow sheen pass over the wet street, once per loop
  const sh=document.getElementById('sheen');
  sh.style.transform=`translateX(${-130+260*t}vw)`;
  sh.style.opacity="0.5";
  document.getElementById('vig').style.opacity=String(0.85+0.15*Math.sin(TAU*t*3));
  document.getElementById('mark').style.transform=`translateY(${0.4*Math.sin(TAU*t)}vh)`;
};
</script>
