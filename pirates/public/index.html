<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#2b1b12" />
<!-- Add to Home Screen opens it full screen like an app: no browser bars on iPhone, iPad or Android. -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AHOY" />
<link rel="apple-touch-icon" href="assets/icon/icon-180.png" />
<title>AHOY: PumpFunPirates</title>
<meta name="description" content="Sail the Solana seas with the Pump Fun Pirates: island platforming, sea mishaps and a treasure map to complete." />
<link rel="icon" type="image/png" href="assets/sprite/item-coin.png" />
<style>
  /* Self-hosted (SIL Open Font License): Pirata One for titles, Just Another Hand for UI — the latter is the font on pumpfunpirates.com. */
  @font-face { font-family: 'Pirata One'; src: url(assets/fonts/pirata-one.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Just Another Hand'; src: url(assets/fonts/just-another-hand.woff2) format('woff2'); font-display: swap; }
  html, body { margin: 0; height: 100%; background: #2b1b12 radial-gradient(ellipse at center, #4a2f1f 0%, #2b1b12 70%); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffcd77; font: 42px 'Pirata One', Georgia, serif; text-align: center; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #12303d; color: #ffcd77; font: 34px 'Pirata One', Georgia, serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (max-width: 820px), (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="loading">⚓ AHOY: PumpFunPirates</div>
<div id="rotate">🏴‍☠️ Turn your device sideways, matey — the seas are wide!</div>
<div id="game"></div>
<script>
  // iOS ignores user-scalable=no for pinch; stop the zoom gestures and the double-tap zoom.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  var lastTouch = 0; document.addEventListener("touchend", function (e) { var n = Date.now(); if (n - lastTouch < 320) e.preventDefault(); lastTouch = n; }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
</script>
<script src="vendor/phaser-3.60.0.min.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/input.js"></script>
<script src="js/gate.js"></script>
<script src="js/scenes-menu.js"></script>
<script src="js/scene-map.js"></script>
<script src="js/scene-mishap.js"></script>
<script src="js/scene-level.js"></script>
<script src="js/scene-dig.js"></script>
<script src="js/main.js"></script>
</body>
</html>
