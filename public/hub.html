<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/theme.css">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Hub — receipts you can verify</title>
<meta name="description" content="What a project promised its holders, who qualified, and the transaction that paid each one — re-checked against Solana in your browser. No wallet needed."/>
<meta property="og:title" content="Project Hub — Cluck Norris"/>
<meta property="og:description" content="What a project promised its holders, who was owed, and the transaction that paid each one. Verify it yourself."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* palette + type scale come from theme.css — never redefine a token here */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  .back-home { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:2px; color:var(--orange); text-decoration:none; margin-bottom:14px; }
  .header { text-align:center; margin-bottom:18px; }
  .header h1 { font-family:var(--disp); font-size:32px; letter-spacing:1px; color:var(--gold); font-weight:400; }
  .header p { font-size:11px; color:var(--sub); letter-spacing:3px; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
  .intro { font-size:var(--body-text, 15px); color:var(--subtext, #9CA3AF); line-height:1.7; }
  .intro b { color:var(--text); }
  .mono { font-family:var(--mono); font-size:12.5px; color:#D1D5DB; word-break:break-all; }
  a.mono, .mono a { color:var(--cyan, #67E8F9); text-decoration:none; }
  .row-flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .input-row { display:flex; gap:8px; margin-top:12px; }
  .addr-input { flex:1; min-width:0; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:11px 13px; color:var(--text); font-family:var(--mono); font-size:13px; outline:none; }
  .addr-input:focus { border-color:var(--accent); }
  .btn { flex-shrink:0; background:var(--orange); border:none; border-radius:8px; padding:11px 18px; font-size:12.5px; font-weight:700; letter-spacing:1.5px; color:#fff; cursor:pointer; }
  .btn.ghost { background:rgba(255,255,255,.06); color:var(--text); border:1px solid var(--border); }
  .btn:disabled { background:var(--grey, #4B5563); color:var(--muted); cursor:not-allowed; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-family:var(--disp); font-size:11px; letter-spacing:1.5px; padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--sub); text-transform:uppercase; }
  .chip.kind { color:var(--gold); border-color:rgba(252,211,77,.35); }
  .chip.ok { color:var(--green); border-color:rgba(16,185,129,.35); }
  .chip.warn { color:var(--amber, #F59E0B); border-color:rgba(245,158,11,.4); }
  .chip.bad { color:#FCA5A5; border-color:rgba(239,68,68,.4); }
  .prog-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px; }
  .prog-head h2 { font-family:var(--disp); font-weight:400; font-size:22px; letter-spacing:.5px; color:var(--text); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin:12px 0; }
  .stat { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:10px 12px; text-align:center; }
  .stat .v { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text); }
  .stat .l { font-size:9.5px; color:var(--sub); letter-spacing:2px; margin-top:4px; text-transform:uppercase; }
  .timeline { display:flex; gap:0; overflow-x:auto; margin:10px 0 4px; padding-bottom:4px; }
  .tl { flex:1; min-width:120px; position:relative; padding:8px 8px 8px 0; border-top:2px solid var(--border); }
  .tl.done { border-top-color:var(--green); }
  .tl .n { font-size:9.5px; letter-spacing:2px; color:var(--sub); text-transform:uppercase; }
  .tl .d { font-family:var(--mono); font-size:12px; color:#D1D5DB; margin-top:3px; }
  .terms { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:6px 14px; font-size:12.5px; color:var(--subtext, #9CA3AF); margin:10px 0; }
  .terms b { color:var(--text); font-weight:600; }
  .sec-title { font-family:var(--disp); font-size:13px; letter-spacing:2px; margin:16px 0 8px; color:var(--gold); text-transform:uppercase; }
  .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -6px; padding:0 6px; }
  table { width:100%; min-width:520px; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:9.5px; letter-spacing:2px; color:var(--sub); text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--border); }
  td { padding:8px 6px; border-bottom:1px solid var(--border-soft, rgba(255,255,255,.06)); vertical-align:top; }
  td.num { font-family:var(--mono); text-align:right; white-space:nowrap; }
  .pill { display:inline-block; font-size:10.5px; letter-spacing:1px; padding:2px 7px; border-radius:999px; border:1px solid var(--border); color:var(--sub); text-transform:uppercase; white-space:nowrap; }
  .pill.ok { color:var(--green); border-color:rgba(16,185,129,.4); }
  .pill.warn { color:var(--amber, #F59E0B); border-color:rgba(245,158,11,.4); }
  .pill.bad { color:#FCA5A5; border-color:rgba(239,68,68,.4); }
  .fact { font-size:12.5px; color:var(--subtext, #9CA3AF); line-height:1.55; }
  .fact b { color:var(--text); }
  .facts li { list-style:none; padding:8px 0; border-bottom:1px solid var(--border-soft, rgba(255,255,255,.06)); }
  details summary { cursor:pointer; font-size:12.5px; color:var(--sub); letter-spacing:1px; margin:8px 0; }
  .verify-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .verify-note { font-size:12px; color:var(--sub); }
  .status { text-align:center; color:var(--sub); font-size:12px; letter-spacing:2px; padding:18px 0; }
  .err { background:var(--redbg, rgba(239,68,68,0.08)); border:1px solid rgba(239,68,68,0.3); border-radius:8px; padding:10px 14px; font-size:12.5px; color:#FCA5A5; margin-top:12px; }
  .proj-link { display:block; text-decoration:none; color:inherit; }
  .lessons a { color:var(--cyan, #67E8F9); text-decoration:none; }
  .small { font-size:12px; color:var(--sub); }
  pre.proof { background:rgba(0,0,0,.35); border:1px solid var(--border); border-radius:8px; padding:12px; font-family:var(--mono); font-size:11.5px; color:#D1D5DB; overflow-x:auto; white-space:pre; }
  @media (max-width:520px) { .prog-head h2 { font-size:19px; } td, th { padding:6px 4px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="/">← CLUCK NORRIS</a>
  <div class="header">
    <h1 id="title">Project Hub</h1>
    <p id="subtitle">RECEIPTS YOU CAN VERIFY · NO WALLET NEEDED</p>
  </div>
  <div id="app"><div class="status">LOADING…</div></div>
</div>

<script src="/cluck-util.js"></script>
<script>
(function () {
  var esc = CluckUtil.esc, shortAddr = CluckUtil.shortAddr, rpc = CluckUtil.rpc;
  var app = document.getElementById('app');
  // /hub · /hub/:project (lock-to-earn only) · /hub/:project/programs (index) · /hub/:project/p/:program · /hub/:project/r/:sig
  var path = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  var projectId = path[1] ? String(path[1]).toLowerCase() : null;
  var receiptSig = path[2] === 'r' && path[3] ? path[3] : null;
  var programId = path[2] === 'p' && path[3] ? decodeURIComponent(path[3]) : null;
  var programsIndex = path[2] === 'programs';

  // ── formatting ───────────────────────────────────────────────────────────────────────────
  function ts(ms) { if (ms == null) return '—'; var d = new Date(Number(ms)); if (isNaN(d)) return '—'; return d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'; }
  function tsUnix(s) { return s == null ? '—' : ts(Number(s) * 1000); }
  function amt(v, sym) { if (v == null || v === '') return '—'; var n = Number(v); var s = isFinite(n) ? n.toLocaleString('en-US', { maximumFractionDigits: 6 }) : String(v); return s + (sym ? ' ' + esc(sym) : ''); }
  function acct(a) { return '<a class="mono" target="_blank" rel="noopener" href="https://solscan.io/account/' + encodeURIComponent(a) + '">' + esc(shortAddr(a, 5, 4)) + '</a>'; }
  function txLink(sig) { return sig ? '<a class="mono" target="_blank" rel="noopener" href="https://solscan.io/tx/' + encodeURIComponent(sig) + '">' + esc(shortAddr(sig, 6, 6)) + '</a>' : '<span class="small">—</span>'; }
  function pill(state) {
    var m = { settled: 'ok', paid: 'ok', qualified: 'ok', eligible: 'ok', confirmed: 'ok', submitted: 'warn', manual: 'warn', pending: 'warn', dq: 'bad', cancelled: 'bad' };
    var label = { 'no-receipt': 'no receipt on file', 'confirmed-manually': 'confirmed by hand', dq: 'disqualified', manual: 'reviewed by hand' }[state] || String(state || '').replace(/-/g, ' ');
    return '<span class="pill ' + (m[state] || '') + '">' + esc(label) + '</span>';
  }
  function verifyCell(sig) { return sig ? '<span class="verify" data-sig="' + esc(sig) + '"><span class="small">not checked</span></span>' : '<span class="small">—</span>'; }

  // ── the lessons behind the mechanics (Hub Addendum C: teach the button before you offer it) ──
  function lessons(kind) {
    var L = [
      ['What a hold period is, and why selling early forfeits the prize', '/school#lesson=tokenomics'],
      ['Custody: who can move what — why a transfer out counts the same as a sell', '/school#lesson=wallets'],
      ['Where rewards actually come from (never a promised rate)', '/school#lesson=staking'],
    ];
    if (kind === 'lock-to-earn') L.push(['Why projects lock in the first place', '/school#lesson=rugs']);
    return '<div class="card lessons"><div class="sec-title" style="margin-top:0">Learn the mechanics</div>' +
      L.map(function (x) { return '<div class="fact" style="padding:4px 0"><a href="' + x[1] + '">' + esc(x[0]) + ' →</a></div>'; }).join('') + '</div>';
  }

  // ── program cards ─────────────────────────────────────────────────────────────────────────
  function timeline(p) {
    var t = p.timeline || {}, now = Date.now(), items = [];
    if (t.startTs != null) items.push(['Window opens', t.startTs]);
    if (t.endTs != null) items.push(['Window closes', t.endTs]);
    if (t.holdEndsTs != null) items.push(['Hold ends', t.holdEndsTs]);
    if (t.drawnAt != null) items.push(['Drawn', t.drawnAt]);
    if (t.verifiedAt != null) items.push(['Verified on-chain', t.verifiedAt]);
    if (t.lastPaidAt != null) items.push(['Paid', t.lastPaidAt]);
    if (!items.length) return '';
    return '<div class="timeline">' + items.map(function (i) { return '<div class="tl ' + (i[1] <= now ? 'done' : '') + '"><div class="n">' + esc(i[0]) + '</div><div class="d">' + ts(i[1]) + '</div></div>'; }).join('') + '</div>';
  }
  function statTiles(list) {
    return '<div class="stats">' + list.filter(function (s) { return s[1] != null; }).map(function (s) { return '<div class="stat"><div class="v">' + s[1] + '</div><div class="l">' + esc(s[0]) + '</div></div>'; }).join('') + '</div>';
  }
  // Tables scroll inside their card on a phone; the page itself never scrolls sideways.
  function scrollable(tableHtml) { return '<div class="tscroll">' + tableHtml + '</div>'; }
  function payoutTable(rows, sym, withRank) {
    if (!rows || !rows.length) return '';
    return scrollable('<table><thead><tr>' + (withRank ? '<th>#</th>' : '') + '<th>Wallet</th><th style="text-align:right">Amount</th><th>State</th><th>Transaction</th><th>Chain check</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + (withRank ? '<td class="num">' + esc(r.rank == null ? '' : r.rank) + '</td>' : '') + '<td>' + acct(r.wallet) + '</td><td class="num">' + amt(r.amountUi, sym) + '</td><td>' + pill(r.state) + '</td><td>' + txLink(r.sig) + '</td><td>' + verifyCell(r.sig) + '</td></tr>'; }).join('') + '</tbody></table>');
  }
  function reviewList(review, results) {
    var rows = (review || []).filter(function (r) { return r.status !== 'qualified' && r.status !== 'eligible'; });
    if (!rows.length) return '';
    return '<details><summary>' + rows.length + ' wallet' + (rows.length > 1 ? 's' : '') + ' reviewed and not paid — the observed fact for each</summary><ul class="facts">' +
      rows.map(function (r) { return '<li><div class="row-flex">' + acct(r.wallet) + ' ' + pill(r.status) + (r.tokensBought ? '<span class="small">bought ' + amt(r.tokensBought) + '</span>' : '') + '</div><div class="fact">' + esc(r.fact) + '</div></li>'; }).join('') + '</ul></details>';
  }
  function compCard(p, sym) {
    var t = p.terms || {}, tot = p.totals || {};
    var prizes = t.pctPrize ? (t.places || []).map(function (x) { return x.amount + '%'; }).join(' / ') + ' of each winner\'s own buys' : (t.places || []).map(function (x) { return amt(x.amount); }).join(' / ') + ' ' + esc(sym);
    // A winner without a journal row is "no receipt on file" — never "owed" (a comp settled before
    // the Hub journaled signatures has winners and no rows).
    var winners = (p.results || []).map(function (r) { var pay = (p.payouts || []).filter(function (x) { return x.wallet === r.wallet; })[0]; return { rank: r.rank, wallet: r.wallet, amountUi: r.amount, state: pay ? pay.state : 'no-receipt', sig: pay ? pay.sig : null }; });
    return '<div class="card" id="p-' + esc(p.id) + '">' +
      '<div class="prog-head"><h2>' + esc(p.label || 'Buy competition') + '</h2><div class="chips"><span class="chip kind">buy competition</span><span class="chip ' + (p.status === 'verified' || p.status === 'closed' ? 'ok' : '') + '">' + esc(p.status) + '</span>' + (p.verifiedBy === 'operator' ? '<span class="chip warn">list set by operator</span>' : '') + '</div></div>' +
      timeline(p) +
      '<div class="terms"><div><b>Metric</b> ' + esc(t.metric === 'single' ? 'largest single buy' : 'cumulative buys') + '</div><div><b>Prizes</b> ' + prizes + '</div><div><b>Hold</b> ' + esc(t.holdHours) + ' h after close</div>' + (t.minVolSol ? '<div><b>Min volume</b> ' + esc(t.minVolSol) + ' SOL</div>' : '') + (t.exclude && t.exclude.length ? '<div><b>Excluded wallets</b> ' + t.exclude.length + '</div>' : '') +
      '<div><b>Terms hash</b> <span class="mono" title="sha256 of the terms this competition ran under — recompute it from the JSON at /api/hub/' + esc(projectId) + '">' + esc(String(p.termsHash || '').slice(0, 16)) + '…</span></div></div>' +
      statTiles([['Sealed total', amt(tot.sealedUi)], ['Receipted', amt(tot.paidUi)], ['Settled', tot.settled], ['Submitted', tot.submitted || null], ['Winners', tot.winners], ['Disqualified', tot.disqualified]]) +
      (p.payoutNote ? '<div class="fact" style="margin-bottom:8px">' + esc(p.payoutNote) + '</div>' : '') +
      (p.listHistory && p.listHistory.length ? '<div class="fact" style="margin-bottom:8px">The sealed list was replaced by the operator ' + p.listHistory.length + ' time' + (p.listHistory.length > 1 ? 's' : '') + ': <b>' + esc(p.listHistory[p.listHistory.length - 1].note || 'no note') + '</b> (' + ts(p.listHistory[p.listHistory.length - 1].at) + ').</div>' : '') +
      '<div class="sec-title">Winners and receipts</div>' + (winners.length ? payoutTable(winners, sym, true) : '<div class="fact">Not verified yet — the hold period runs ' + esc(t.holdHours) + ' hours past the close.</div>') +
      reviewList(p.review) +
      (p.voids && p.voids.length ? '<details><summary>' + p.voids.length + ' voided transfer record' + (p.voids.length > 1 ? 's' : '') + '</summary><ul class="facts">' + p.voids.map(function (v) { return '<li><div class="row-flex">' + acct(v.wallet) + ' ' + txLink(v.sig) + ' ' + pill(v.reason || 'void') + '</div></li>'; }).join('') + '</ul></details>' : '') +
      '</div>';
  }
  function drawCard(p, sym) {
    var tot = p.totals || {};
    return '<div class="card" id="p-' + esc(p.id) + '">' +
      '<div class="prog-head"><h2>' + esc(p.label || 'Random draw') + '</h2><div class="chips"><span class="chip kind">reproducible draw</span><span class="chip ' + (p.status === 'drawn' ? 'ok' : '') + '">' + esc(p.status) + '</span></div></div>' +
      timeline(p) +
      '<div class="terms"><div><b>Prize</b> ' + amt(p.terms && p.terms.prize, sym) + ' each</div><div><b>Winners</b> ' + esc(tot.winners) + '</div><div><b>Entries</b> ' + esc(p.totalEntries) + ' from ' + esc(p.eligible ? p.eligible.length : 0) + ' wallets</div><div><b>Hold</b> ' + esc(p.terms && p.terms.holdHours) + ' h</div><div><b>Terms hash</b> <span class="mono">' + esc(String(p.termsHash || '').slice(0, 16)) + '…</span></div></div>' +
      '<div class="sec-title">Winners</div>' + scrollable('<table><thead><tr><th>#</th><th>Wallet</th><th style="text-align:right">Prize</th><th style="text-align:right">Chances</th></tr></thead><tbody>' +
      (p.winners || []).map(function (w) { return '<tr><td class="num">' + esc(w.rank) + '</td><td>' + acct(w.wallet) + '</td><td class="num">' + amt(w.prize, sym) + '</td><td class="num">' + esc(w.chances) + '</td></tr>'; }).join('') + '</tbody></table>') +
      '<details><summary>How the draw was made — seed and method (anyone can re-run it)</summary><div class="fact"><b>Seed</b> <span class="mono">' + esc(p.seed) + '</span></div><div class="fact" style="margin-top:6px">' + esc(p.method) + '</div><div class="fact" style="margin-top:6px">The full entry list is in <a class="mono" href="/api/hub/' + esc(projectId) + '">the JSON</a>.</div></details>' +
      reviewList(p.review) +
      (p.payoutNote ? '<div class="fact" style="margin-top:10px">' + esc(p.payoutNote) + '</div>' : '') +
      '</div>';
  }
  function giveawayCard(p, sym) {
    var tot = p.totals || {};
    var rows = (p.winners || []).filter(function (w) { return !w.alternate; }).map(function (w) { var pay = (p.payouts || []).filter(function (x) { return x.wallet === w.wallet; })[0]; return { rank: w.rank, wallet: w.wallet, amountUi: w.prizeUi, state: pay ? pay.state : 'no-receipt', sig: pay ? pay.sig : null }; });
    return '<div class="card" id="p-' + esc(p.id) + '">' +
      '<div class="prog-head"><h2>' + esc(p.label || 'Holder giveaway') + '</h2><div class="chips"><span class="chip kind">giveaway</span><span class="chip ' + (p.status === 'paid' ? 'ok' : '') + '">' + esc(p.status) + '</span>' + (p.reproducible ? '<span class="chip ok">sealed draw</span>' : '') + '</div></div>' +
      timeline(p) +
      statTiles([['Sealed total', amt(tot.sealedUi)], ['Receipted', amt(tot.paidUi)], ['Settled', tot.settled], ['Submitted', tot.submitted || null]]) +
      (p.seedHash ? '<div class="fact"><b>Seed hash</b> <span class="mono">' + esc(p.seedHash) + '</span>' + (p.seedSlot ? ' · slot ' + esc(p.seedSlot) : '') + '</div>' : '') +
      '<div class="sec-title">Winners and receipts</div>' + payoutTable(rows, sym, true) + '</div>';
  }
  function stakeCard(p, sym) {
    var tot = p.totals || {}, a = p.accrual || {};
    return '<div class="card" id="p-' + esc(p.id) + '">' +
      '<div class="prog-head"><h2>' + esc(p.label || 'Lock to Earn') + '</h2><div class="chips"><span class="chip kind">lock to earn</span><span class="chip ' + (p.status === 'accruing' ? 'ok' : '') + '">' + esc(p.status) + '</span></div></div>' +
      '<div class="fact" style="margin-bottom:8px">Rewards for wallets holding a ' + esc(sym) + ' lock on Jupiter Lock. Rewards accrue hourly while the lock is active, computed from the on-chain ledger, and are paid in batches — each payment below is a transaction you can open.</div>' +
      '<div class="terms"><div><b>Accruing since</b> ' + esc(a.firstDay || '—') + '</div><div><b>Last accrual</b> ' + esc(a.lastDay || '—') + '</div><div><b>Days</b> ' + esc(a.days) + '</div><div><b>Hourly slices</b> ' + esc(a.slices) + '</div><div><b>Wallets</b> ' + esc(a.wallets) + '</div></div>' +
      statTiles([['Accrued to date', amt(tot.accruedUi)], ['Paid', amt(tot.paidUi)], ['Accrued since last payout', amt(tot.sincePayoutUi)], ['Payouts', tot.batches], ['Receipts', tot.settled]]) +
      // Only RECEIPTS are listed per wallet. A batch that is built but not sent is one line, no
      // wallets — nothing on a public page reads "owed" next to an address.
      (p.batches || []).map(function (b) {
        if (b.state === 'pending') return '<div class="fact" style="margin-top:8px">A payout of ' + amt(b.totalUi, sym) + ' to ' + esc(b.count) + ' wallets is being prepared (built ' + tsUnix(b.at) + ').</div>';
        var rows = (b.rows || []).filter(function (r) { return r.sig; });
        if (!rows.length) return '';
        return '<details><summary>Payout ' + tsUnix(b.at) + ' · ' + esc(rows.length) + ' wallet' + (rows.length === 1 ? '' : 's') + ' · ' + amt(b.totalUi, sym) + '</summary>' + payoutTable(rows, sym, false) + '</details>';
      }).join('') +
      '</div>';
  }
  function programCard(p, sym) {
    var s = p.ticker || sym;
    if (p.kind === 'buy-comp') return compCard(p, s);
    if (p.kind === 'buy-special-draw') return drawCard(p, s);
    if (p.kind === 'giveaway') return giveawayCard(p, s);
    if (p.kind === 'lock-to-earn') return stakeCard(p, s);
    return '';
  }

  // ── chain check: every signature on the page, re-read from Solana in this browser ────────
  async function verifyAll() {
    var cells = Array.prototype.slice.call(document.querySelectorAll('.verify[data-sig]'));
    var sigs = cells.map(function (c) { return c.getAttribute('data-sig'); });
    var uniq = sigs.filter(function (s, i) { return sigs.indexOf(s) === i; });
    var btn = document.getElementById('verifyBtn'), note = document.getElementById('verifyNote');
    if (!uniq.length) { note.textContent = 'No signatures on this page yet.'; return; }
    btn.disabled = true; note.textContent = 'Asking Solana about ' + uniq.length + ' signature' + (uniq.length > 1 ? 's' : '') + '…';
    var status = {};
    try {
      for (var i = 0; i < uniq.length; i += 100) {
        var chunk = uniq.slice(i, i + 100);
        var r = await rpc('getSignatureStatuses', [chunk, { searchTransactionHistory: true }]);
        var vals = (r && r.value) || [];
        chunk.forEach(function (s, k) { status[s] = vals[k] || null; });
      }
    } catch (e) { note.textContent = 'Could not reach the chain right now (' + e.message + ') — nothing was marked.'; btn.disabled = false; return; }
    var good = 0, bad = 0, unknown = 0;
    cells.forEach(function (c) {
      var st = status[c.getAttribute('data-sig')];
      if (st && !st.err && (st.confirmationStatus === 'finalized' || st.confirmationStatus === 'confirmed')) { good++; c.innerHTML = '<span class="pill ok">✓ ' + esc(st.confirmationStatus) + '</span>'; }
      else if (st && st.err) { bad++; c.innerHTML = '<span class="pill bad">failed on-chain</span>'; }
      else { unknown++; c.innerHTML = '<span class="pill warn">not found by this RPC</span>'; }
    });
    note.textContent = 'Checked ' + ts(Date.now()) + ' — ' + good + ' confirmed on Solana' + (bad ? ', ' + bad + ' failed' : '') + (unknown ? ', ' + unknown + ' not found (a lagging node answers this for real transfers too — open the transaction link)' : '') + '.';
    btn.disabled = false;
  }

  // ── check my wallet ───────────────────────────────────────────────────────────────────────
  async function lookup(wallet, onlyProgram) {
    var out = document.getElementById('walletOut');
    var w = String(wallet || '').trim();
    if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(w)) { out.innerHTML = '<div class="err">That is not a Solana address.</div>'; return; }
    out.innerHTML = '<div class="status">LOOKING…</div>';
    try {
      var r = await fetch('/api/hub/' + encodeURIComponent(projectId) + '/wallet/' + encodeURIComponent(w)).then(function (x) { return x.json(); });
      if (!r.ok) { out.innerHTML = '<div class="err">' + esc(r.error || 'lookup failed') + '</div>'; return; }
      if (onlyProgram) r.entries = r.entries.filter(function (e) { return e.program === onlyProgram; });   // this page's program only
      if (!r.entries.length) { out.innerHTML = '<div class="fact" style="margin-top:10px">' + acct(w) + ' does not appear in this program — not as a winner, a payout, or a reviewed wallet.</div>'; return; }
      out.innerHTML = '<ul class="facts" style="margin-top:8px">' + r.entries.map(function (e) {
        return '<li><div class="row-flex"><b class="small" style="color:var(--text)">' + esc(e.label || e.kind) + '</b> ' + pill(e.role) + (e.amountUi != null ? '<span class="mono">' + amt(e.amountUi, e.ticker) + '</span>' : '') + (e.sig ? ' ' + txLink(e.sig) : '') + (e.rank ? '<span class="small">#' + esc(e.rank) + '</span>' : '') + '</div>' + (e.fact ? '<div class="fact">' + esc(e.fact) + '</div>' : '') + (e.note ? '<div class="fact">' + esc(e.note) + '</div>' : '') + '</li>';
      }).join('') + '</ul>';
    } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  }

  // ── views ─────────────────────────────────────────────────────────────────────────────────
  async function renderIndex() {
    var r = await fetch('/api/hub').then(function (x) { return x.json(); });
    if (!r.ok) throw new Error(r.error || 'could not load');
    app.innerHTML = '<div class="card"><div class="intro">Every project here has a public record: <b>what it promised its holders, who qualified, and the transaction that paid each one</b>. Nothing on these pages needs a wallet, and every signature can be re-checked against Solana from the page itself.</div></div>' +
      r.projects.map(function (p) { return '<a class="card proj-link" href="/hub/' + esc(p.id) + '"><div class="prog-head"><h2>' + esc(p.label) + ' <span class="small">' + esc(p.symbol) + '</span></h2><div class="chips"><span class="chip">' + p.programs + ' program' + (p.programs === 1 ? '' : 's') + '</span><span class="chip ' + (p.receipts ? 'ok' : '') + '">' + p.receipts + ' receipt' + (p.receipts === 1 ? '' : 's') + '</span></div></div><div class="mono">' + esc(p.mint) + '</div></a>'; }).join('');
  }
  // One program per page (owner, 2026-09-16: a lock-to-earn link must show lock-to-earn and nothing
  // else). /hub/:project is the lock-to-earn page when the project runs one; every other program
  // lives at /hub/:project/p/:program, listed at /hub/:project/programs.
  async function renderProject() {
    var r = await fetch('/api/hub/' + encodeURIComponent(projectId)).then(function (x) { return x.json(); });
    if (!r.ok) throw new Error(r.error || 'could not load');
    var v = r.project, sym = v.symbol;
    var lte = v.programs.filter(function (p) { return p.kind === 'lock-to-earn'; })[0] || null;
    var one = programId ? (v.programs.filter(function (p) { return p.id === programId; })[0] || null) : (programsIndex ? null : lte);
    if (programId && !one) throw new Error('no such program');
    var receipts = one ? (one.payouts || []).filter(function (x) { return x.sig; }).length : 0;
    document.getElementById('title').textContent = one ? (one.kind === 'lock-to-earn' ? v.label + ' · Lock to Earn' : one.label) : v.label;
    document.getElementById('subtitle').textContent = one ? (one.kind === 'lock-to-earn' ? 'REWARDS FOR LOCKED WALLETS · RECEIPTS YOU CAN VERIFY' : 'RECEIPTS YOU CAN VERIFY · NO WALLET NEEDED') : 'PROGRAMS ON RECORD';
    document.title = (one ? (one.kind === 'lock-to-earn' ? v.label + ' Lock to Earn' : one.label) : v.label) + ' — receipts you can verify';
    var tokenLine = '<div class="row-flex" style="margin-top:10px"><span class="small">Token</span> <a class="mono" target="_blank" rel="noopener" href="https://solscan.io/token/' + encodeURIComponent(v.mint) + '">' + esc(v.mint) + '</a></div>';
    if (!one) {
      // Program index — names and counts only; the details live on each program's own page.
      app.innerHTML = '<div class="card"><div class="intro">Programs <b>' + esc(v.label) + '</b> has run with its holders. Each one has its own page with the terms, the outcome and the transactions.</div>' + tokenLine + '</div>' +
        (v.programs.length ? v.programs.map(function (p) { var n = (p.payouts || []).filter(function (x) { return x.sig; }).length; return '<a class="card proj-link" href="/hub/' + esc(v.id) + '/p/' + encodeURIComponent(p.id) + '"><div class="prog-head"><h2>' + esc(p.label || p.kind) + '</h2><div class="chips"><span class="chip kind">' + esc(String(p.kind).replace(/-/g, ' ')) + '</span><span class="chip ' + (n ? 'ok' : '') + '">' + n + ' receipt' + (n === 1 ? '' : 's') + '</span></div></div></a>'; }).join('') : '<div class="card"><div class="fact">No programs on record for this project yet.</div></div>');
      return;
    }
    var intro = one.kind === 'lock-to-earn'
      ? 'Lock to Earn for <b>' + esc(v.label) + '</b>: rewards for wallets holding a ' + esc(sym) + ' lock on Jupiter Lock — the tokens stay in the lock, nobody holds them. Nothing here needs a wallet; every payment is a transaction you can open.'
      : 'What <b>' + esc(v.label) + '</b> promised its holders in this program, who qualified, and the transaction that paid each one. Nothing here needs a wallet. Disqualifications show the <b>observed on-chain fact</b>, never a motive.';
    app.innerHTML =
      '<div class="card"><div class="intro">' + intro + '</div>' + tokenLine +
      '<div class="verify-bar"><button class="btn" id="verifyBtn">VERIFY ON-CHAIN</button><span class="verify-note" id="verifyNote">' + receipts + ' receipt' + (receipts === 1 ? '' : 's') + ' on this page. Press to re-check every signature against Solana, from your browser.</span></div></div>' +
      '<div class="card"><div class="sec-title" style="margin-top:0">Check a wallet</div><div class="fact">Paste any address to see what it received in this program, with the transaction' + (one.kind === 'lock-to-earn' ? '' : ' — and, if it was disqualified, the fact that decided it') + '.</div><div class="input-row"><input class="addr-input" id="walletIn" placeholder="Solana wallet address" autocomplete="off" spellcheck="false"/><button class="btn ghost" id="walletBtn">CHECK</button></div><div id="walletOut"></div></div>' +
      programCard(one, sym) +
      lessons(one.kind === 'lock-to-earn' ? 'lock-to-earn' : '') +
      '<div class="small" style="text-align:center">Raw data: <a class="mono" href="/api/hub/' + esc(v.id) + '">/api/hub/' + esc(v.id) + '</a> · generated ' + ts(v.generatedAt) + '</div>';
    document.getElementById('verifyBtn').addEventListener('click', verifyAll);
    document.getElementById('walletBtn').addEventListener('click', function () { lookup(document.getElementById('walletIn').value, one.id); });
    document.getElementById('walletIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(e.target.value, one.id); });
    var pre = new URLSearchParams(location.search).get('wallet'); if (pre) { document.getElementById('walletIn').value = pre; lookup(pre, one.id); }
  }
  async function renderReceipt() {
    var r = await fetch('/api/hub/' + encodeURIComponent(projectId) + '/r/' + encodeURIComponent(receiptSig)).then(function (x) { return x.json(); });
    if (!r.ok) throw new Error(r.error || 'no such receipt');
    var p = r.program, x = r.receipt, sym = p.ticker || r.symbol;
    document.getElementById('title').textContent = 'Receipt';
    document.getElementById('subtitle').textContent = (p.label || p.kind).toUpperCase() + ' · ' + String(r.projectId).toUpperCase();
    var proof = JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getSignatureStatuses', params: [[x.sig], { searchTransactionHistory: true }] }, null, 2);
    app.innerHTML =
      '<div class="card">' + statTiles([['Amount', amt(x.amountUi, sym)], ['State', esc(x.state)], ['Submitted', ts(x.at)]]) +
      '<div class="terms"><div><b>To</b> ' + acct(x.wallet) + '</div><div><b>Token</b> <a class="mono" target="_blank" rel="noopener" href="https://solscan.io/token/' + encodeURIComponent(p.prizeMint || p.mint) + '">' + esc(shortAddr(p.prizeMint || p.mint, 6, 4)) + '</a></div><div><b>Program</b> ' + esc(p.label || p.kind) + '</div>' + (p.termsHash ? '<div><b>Terms hash</b> <span class="mono">' + esc(p.termsHash.slice(0, 16)) + '…</span></div>' : '') + '</div>' +
      '<div class="sec-title">Transaction</div><div class="mono"><a target="_blank" rel="noopener" href="https://solscan.io/tx/' + encodeURIComponent(x.sig) + '">' + esc(x.sig) + '</a></div>' +
      '<div class="verify-bar"><button class="btn" id="verifyBtn">VERIFY ON-CHAIN</button><span class="verify-note" id="verifyNote"><span class="verify" data-sig="' + esc(x.sig) + '"><span class="small">not checked</span></span></span></div>' +
      '<div class="sec-title">Verify it yourself</div><div class="fact">Send this to any Solana RPC. A <span class="mono">confirmationStatus</span> of <span class="mono">confirmed</span> or <span class="mono">finalized</span> with no <span class="mono">err</span> means the transfer is on the chain.</div><pre class="proof">' + esc(proof) + '</pre>' +
      '<div class="small" style="margin-top:12px"><a href="/hub/' + esc(r.projectId) + '#p-' + esc(p.id) + '">← all receipts for ' + esc(p.label || p.kind) + '</a></div></div>';
    document.getElementById('verifyBtn').addEventListener('click', verifyAll);
  }

  (async function () {
    try {
      if (!projectId) await renderIndex();
      else if (receiptSig) await renderReceipt();
      else await renderProject();
    } catch (e) { app.innerHTML = '<div class="card"><div class="err">' + esc(e.message || String(e)) + '</div><div class="small" style="margin-top:10px"><a href="/hub">← all projects</a></div></div>'; }
  })();
})();
</script>
