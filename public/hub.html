<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/theme.css">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Hub — receipts you can verify</title>
<meta name="description" content="What a project promised its holders, who qualified, and the transaction that paid each one — re-checked against Solana in your browser. No wallet needed."/>
<!-- OG -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* palette + type scale come from theme.css — never redefine a token here */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  .back-home { display:inline-flex; align-items:center; min-height:44px; gap:6px; font-size:11px; font-weight:700; letter-spacing:2px; color:var(--orange); text-decoration:none; margin-bottom:14px; }
  .header { text-align:center; margin-bottom:18px; }
  .header h1 { font-family:var(--disp); font-size:32px; letter-spacing:1px; color:var(--gold); font-weight:400; }
  .header p { font-size:11px; color:var(--sub); letter-spacing:3px; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
  .intro { font-size:var(--body-text, 15px); color:var(--subtext, #9CA3AF); line-height:1.7; }
  .intro b { color:var(--text); }
  .mono { font-family:var(--mono); font-size:12.5px; color:#D1D5DB; word-break:break-all; }
  a.mono, .mono a { color:var(--cyan, #67E8F9); text-decoration:none; }
  .row-flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .input-row { display:flex; gap:8px; margin-top:12px; }
  .addr-input { flex:1; min-width:0; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:11px 13px; color:var(--text); font-family:var(--mono); font-size:13px; outline:none; }
  .addr-input:focus { border-color:var(--accent); }
  .btn { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; min-height:44px; background:var(--orange); border:none; border-radius:8px; padding:11px 18px; font-size:12.5px; font-weight:700; letter-spacing:1.5px; color:#fff; cursor:pointer; }
  .btn.ghost { background:rgba(255,255,255,.06); color:var(--text); border:1px solid var(--border); }
  /* --grey is aliased to --muted in theme.css, so background:var(--grey) + color:var(--muted)
     is background == text — invisible disabled-button copy. Dark text on the grey reads fine. */
  .btn:disabled { background:var(--grey, #4B5563); color:var(--bg); cursor:not-allowed; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-family:var(--disp); font-size:11px; letter-spacing:1.5px; padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--sub); text-transform:uppercase; }
  .chip.kind { color:var(--gold); border-color:rgba(252,211,77,.35); }
  .chip.ok { color:var(--green); border-color:rgba(16,185,129,.35); }
  .chip.warn { color:var(--amber, #F59E0B); border-color:rgba(245,158,11,.4); }
  .chip.bad { color:#FCA5A5; border-color:rgba(239,68,68,.4); }
  .prog-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px; }
  .prog-head h2 { font-family:var(--disp); font-weight:400; font-size:22px; letter-spacing:.5px; color:var(--text); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin:12px 0; }
  .stat { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:10px 12px; text-align:center; }
  .stat .v { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text); }
  .stat .l { font-size:9.5px; color:var(--sub); letter-spacing:2px; margin-top:4px; text-transform:uppercase; }
  .timeline { display:flex; gap:0; overflow-x:auto; margin:10px 0 4px; padding-bottom:4px; }
  .tl { flex:1; min-width:120px; position:relative; padding:8px 8px 8px 0; border-top:2px solid var(--border); }
  .tl.done { border-top-color:var(--green); }
  .tl .n { font-size:9.5px; letter-spacing:2px; color:var(--sub); text-transform:uppercase; }
  .tl .d { font-family:var(--mono); font-size:12px; color:#D1D5DB; margin-top:3px; }
  .terms { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:6px 14px; font-size:12.5px; color:var(--subtext, #9CA3AF); margin:10px 0; }
  .terms b { color:var(--text); font-weight:600; }
  .sec-title { font-family:var(--disp); font-size:13px; letter-spacing:2px; margin:16px 0 8px; color:var(--gold); text-transform:uppercase; }
  .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -6px; padding:0 6px; }
  table { width:100%; min-width:520px; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:9.5px; letter-spacing:2px; color:var(--sub); text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--border); }
  td { padding:8px 6px; border-bottom:1px solid var(--border-soft, rgba(255,255,255,.06)); vertical-align:top; }
  td.num { font-family:var(--mono); text-align:right; white-space:nowrap; }
  .pill { display:inline-block; font-size:10.5px; letter-spacing:1px; padding:2px 7px; border-radius:999px; border:1px solid var(--border); color:var(--sub); text-transform:uppercase; white-space:nowrap; }
  .pill.ok { color:var(--green); border-color:rgba(16,185,129,.4); }
  .pill.warn { color:var(--amber, #F59E0B); border-color:rgba(245,158,11,.4); }
  .pill.bad { color:#FCA5A5; border-color:rgba(239,68,68,.4); }
  .fact { font-size:12.5px; color:var(--subtext, #9CA3AF); line-height:1.55; }
  .fact b { color:var(--text); }
  .facts li { list-style:none; padding:8px 0; border-bottom:1px solid var(--border-soft, rgba(255,255,255,.06)); }
  details summary { cursor:pointer; font-size:12.5px; color:var(--sub); letter-spacing:1px; margin:8px 0; }
  details.explain { margin-top:14px; }
  details.explain summary { color:var(--gold); font-weight:600; }
  .verify-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .verify-note { font-size:12px; color:var(--sub); }
  .status { text-align:center; color:var(--sub); font-size:12px; letter-spacing:2px; padding:18px 0; }
  .err { background:var(--redbg, rgba(239,68,68,0.08)); border:1px solid rgba(239,68,68,0.3); border-radius:8px; padding:10px 14px; font-size:12.5px; color:#FCA5A5; margin-top:12px; }
  .proj-link { display:block; text-decoration:none; color:inherit; }
  /* Project branding (Colosseum E10) — accent applied through a CSS custom property set from a
     validated hex value only (never innerHTML); default falls back to the theme's own orange so
     an unbranded project renders exactly as before. */
  .wrap { --proj-accent: var(--orange); }
  .badge-dryrun { display:inline-flex; align-items:center; gap:6px; font-family:var(--disp); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#FCA5A5; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.35); border-radius:999px; padding:5px 12px; margin-bottom:12px; }
  .proj-hero { display:flex; gap:14px; align-items:center; padding:18px; margin-bottom:14px; border-radius:14px; border:1px solid var(--border); background:linear-gradient(135deg, color-mix(in srgb, var(--proj-accent) 22%, var(--card)), var(--card)); }
  .proj-hero img.logo { width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0; border:1px solid var(--border); background:#000; }
  .proj-hero .htext h2 { font-family:var(--disp); font-weight:400; font-size:20px; color:var(--text); }
  .proj-hero .htext .tagline { font-size:12.5px; color:var(--subtext, #9CA3AF); margin-top:3px; line-height:1.5; }
  .card-logo { width:22px; height:22px; border-radius:6px; object-fit:cover; vertical-align:middle; margin-right:6px; border:1px solid var(--border); background:#000; }
  .socials-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .social-pill { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; font-size:11px; letter-spacing:.5px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); color:var(--sub); text-decoration:none; }
  .social-pill:hover { color:var(--text); border-color:var(--proj-accent); }
  .funding-note { font-size:11px; color:var(--sub); text-align:center; margin-top:2px; }
  /* Standalone one-line CTA links (each is the sole content of its row, not a word inside a
     sentence) get invisible tap-area padding — the negative margin cancels the padding's visual
     footprint, so the link looks identical but its hit box grows toward 44px tall. */
  .lessons a, .small a { display:inline-block; padding:14px 3px; margin:-14px -3px; color:var(--cyan, #67E8F9); text-decoration:none; }
  .small { font-size:12px; color:var(--sub); }
  pre.proof { background:rgba(0,0,0,.35); border:1px solid var(--border); border-radius:8px; padding:12px; font-family:var(--mono); font-size:11.5px; color:#D1D5DB; overflow-x:auto; white-space:pre; }
  @media (max-width:520px) { .prog-head h2 { font-size:19px; } td, th { padding:6px 4px; } }
</style>
</head>
<body>
<main class="wrap">
  <a class="back-home" href="/">← CLUCK NORRIS</a>
  <div class="header">
    <h1 id="title" data-clkn-avoid="1">Project Hub</h1>
    <p id="subtitle" data-clkn-avoid="1">RECEIPTS YOU CAN VERIFY · NO WALLET NEEDED</p>
  </div>
  <div id="app"><div class="status">LOADING…</div></div>
</main>

<script src="/cluck-util.js"></script>
<script>
(function () {
  var esc = CluckUtil.esc, shortAddr = CluckUtil.shortAddr, rpc = CluckUtil.rpc;
  var app = document.getElementById('app');
  // /hub · /hub/:project (lock-to-earn only) · /hub/:project/programs (index) · /hub/:project/p/:program · /hub/:project/r/:sig
  var path = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  var projectId = path[1] ? String(path[1]).toLowerCase() : null;
  var receiptSig = path[2] === 'r' && path[3] ? path[3] : null;
  var programId = path[2] === 'p' && path[3] ? decodeURIComponent(path[3]) : null;
  var programsIndex = path[2] === 'programs';

  // ── formatting ───────────────────────────────────────────────────────────────────────────
  function ts(ms) { if (ms == null) return '—'; var d = new Date(Number(ms)); if (isNaN(d)) return '—'; return d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'; }
  function tsUnix(s) { return s == null ? '—' : ts(Number(s) * 1000); }
  function amt(v, sym) { if (v == null || v === '') return '—'; var n = Number(v); var s = isFinite(n) ? n.toLocaleString('en-US', { maximumFractionDigits: 6 }) : String(v); return s + (sym ? ' ' + esc(sym) : ''); }
  function acct(a) { return '<a class="mono" target="_blank" rel="noopener" href="https://solscan.io/account/' + encodeURIComponent(a) + '">' + esc(shortAddr(a, 5, 4)) + '</a>'; }
  function txLink(sig) { return sig ? '<a class="mono" target="_blank" rel="noopener" href="https://solscan.io/tx/' + encodeURIComponent(sig) + '">' + esc(shortAddr(sig, 6, 6)) + '</a>' : '<span class="small">—</span>'; }
  function pill(state) {
    // held/sold/moved-out/locked-not-a-sell/unverified: the hold-through classification (PR #298
    // — a lock is not a sell, so it is a warn, never a bad, alongside a genuine "still verifying").
    var m = { settled: 'ok', paid: 'ok', qualified: 'ok', eligible: 'ok', confirmed: 'ok', held: 'ok', submitted: 'warn', manual: 'warn', pending: 'warn', 'locked-not-a-sell': 'warn', unverified: 'warn', dq: 'bad', cancelled: 'bad', sold: 'bad', 'moved-out': 'bad' };
    var label = { 'no-receipt': 'no receipt on file', 'confirmed-manually': 'confirmed by hand', dq: 'disqualified', manual: 'reviewed by hand', 'moved-out': 'moved the bag out', 'locked-not-a-sell': 'locked — not a sell', unverified: 'not verified' }[state] || String(state || '').replace(/-/g, ' ');
    return '<span class="pill ' + (m[state] || '') + '">' + esc(label) + '</span>';
  }
  function verifyCell(sig) { return sig ? '<span class="verify" data-sig="' + esc(sig) + '"><span class="small">not checked</span></span>' : '<span class="small">—</span>'; }

  // ── the lessons behind the mechanics (Hub Addendum C: teach the button before you offer it) ──
  // ── E6 begin: school → Hub bridge — carry the project back to the school (`&from=hub:<id>`,
  // read by src/App.jsx hashParam("from")) so a finished locking lesson can bridge the learner
  // back to THIS project's page, and so the read counts toward it (POST /api/track
  // "hub_lesson_read:<id>", lib/traction.js). `lessonReads` is the project's own JSON field
  // (lib/hub/public.js projectView) — null unless it's > 0, so this never brags a zero.
  function lessons(kind, lessonReads) {
    var from = '&from=hub:' + encodeURIComponent(projectId);
    var L = [
      ['What a hold period is, and why selling early forfeits the prize', '/school#lesson=tokenomics' + from],
      ['Custody: who can move what — why a transfer out counts the same as a sell', '/school#lesson=wallets' + from],
      ['Where rewards actually come from (never a promised rate)', '/school#lesson=staking' + from],
    ];
    if (kind === 'lock-to-earn') L.push(['Why projects lock in the first place', '/school#lesson=rugs' + from]);
    var stat = (lessonReads && lessonReads.count > 0)
      ? '<div class="small" style="margin-top:10px">' + lessonReads.count + ' visitor' + (lessonReads.count === 1 ? '' : 's') +
        ' read the lock lessons before this page in the last 30 days.</div>'
      : '';
    return '<div class="card lessons"><div class="sec-title" data-clkn-avoid="1" style="margin-top:0">Learn the mechanics</div>' +
      L.map(function (x) { return '<div class="fact" style="padding:4px 0"><a href="' + x[1] + '">' + esc(x[0]) + ' →</a></div>'; }).join('') + stat + '</div>';
  }
  // ── E6 end ───────────────────────────────────────────────────────────────────────────────────

  // ── program cards ─────────────────────────────────────────────────────────────────────────
  function timeline(p) {
    var t = p.timeline || {}, now = Date.now(), items = [];
    if (t.startTs != null) items.push(['Window opens', t.startTs]);
    if (t.endTs != null) items.push(['Window closes', t.endTs]);
    if (t.holdEndsTs != null) items.push(['Hold ends', t.holdEndsTs]);
    if (t.drawnAt != null) items.push(['Drawn', t.drawnAt]);
    if (t.verifiedAt != null) items.push(['Verified on-chain', t.verifiedAt]);
    if (t.lastPaidAt != null) items.push(['Paid', t.lastPaidAt]);
    if (!items.length) return '';
    return '<div class="timeline">' + items.map(function (i) { return '<div class="tl ' + (i[1] <= now ? 'done' : '') + '"><div class="n">' + esc(i[0]) + '</div><div class="d">' + ts(i[1]) + '</div></div>'; }).join('') + '</div>';
  }
  function statTiles(list) {
    return '<div class="stats">' + list.filter(function (s) { return s[1] != null; }).map(function (s) { return '<div class="stat"><div class="v">' + s[1] + '</div><div class="l">' + esc(s[0]) + '</div></div>'; }).join('') + '</div>';
  }
  // Tables scroll inside their card on a phone; the page itself never scrolls sideways.
  function scrollable(tableHtml) { return '<div class="tscroll">' + tableHtml + '</div>'; }
  function payoutTable(rows, sym, withRank) {
    if (!rows || !rows.length) return '';
    return scrollable('<table><thead><tr>' + (withRank ? '<th>#</th>' : '') + '<th>Wallet</th><th style="text-align:right">Amount</th><th>State</th><th>Transaction</th><th>Chain check</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + (withRank ? '<td class="num">' + esc(r.rank == null ? '' : r.rank) + '</td>' : '') + '<td>' + acct(r.wallet) + '</td><td class="num">' + amt(r.amountUi, sym) + '</td><td>' + pill(r.state) + '</td><td>' + txLink(r.sig) + '</td><td>' + verifyCell(r.sig) + '</td></tr>'; }).join('') + '</tbody></table>');
  }
  // The hold-through evidence link (Colosseum roadmap §7): the FIRST transaction that actually
  // decided a "sold" / "moved out" / "locked" call, opened on Solscan — a reader checks the fact
  // themselves rather than taking the page's word for it.
  function evidenceLink(sig) { return sig ? '<span class="row-flex" style="margin-top:2px"><span class="small">on-chain evidence</span> ' + txLink(sig) + '</span>' : ''; }
  function reviewList(review, results) {
    var rows = (review || []).filter(function (r) { return r.status !== 'qualified' && r.status !== 'eligible'; });
    if (!rows.length) return '';
    return '<details><summary>' + rows.length + ' wallet' + (rows.length > 1 ? 's' : '') + ' reviewed and not paid — the observed fact for each</summary><ul class="facts">' +
      rows.map(function (r) { return '<li><div class="row-flex">' + acct(r.wallet) + ' ' + (r.holdThrough ? pill(r.holdThrough) : pill(r.status)) + (r.tokensBought ? '<span class="small">bought ' + amt(r.tokensBought) + '</span>' : '') + '</div><div class="fact">' + esc(r.fact) + '</div>' + evidenceLink(r.evidenceSig) + '</li>'; }).join('') + '</ul></details>';
  }
  // The E5 "how this number was computed" pattern (Colosseum roadmap), for a buy comp's own
  // winners: each result row carries its own `explanation` (lib/hub/public.js, built by
  // lib/hub/explain.js explainBuyCompRow — the exact split function buyCompVerify used, never a
  // re-typed copy). Rendered as one collapsible per winner, reusing explainBlock() below.
  function winnersExplainSection(results) {
    var rows = (results || []).filter(function (r) { return r.explanation; });
    if (!rows.length) return '';
    return rows.map(function (r) { return '<div style="margin-top:4px">' + acct(r.wallet) + ' <span class="small">#' + esc(r.rank) + '</span>' + explainBlock(r) + '</div>'; }).join('');
  }
  function compCard(p, sym) {
    var t = p.terms || {}, tot = p.totals || {};
    var prizes = t.pctPrize ? (t.places || []).map(function (x) { return x.amount + '%'; }).join(' / ') + ' of each winner\'s own buys' : (t.places || []).map(function (x) { return amt(x.amount); }).join(' / ') + ' ' + esc(sym);
    // A winner without a journal row is "no receipt on file" — never "owed" (a comp settled before
    // the Hub journaled signatures has winners and no rows).
    var winners = (p.results || []).map(function (r) { var pay = (p.payouts || []).filter(function (x) { return x.wallet === r.wallet; })[0]; return { rank: r.rank, wallet: r.wallet, amountUi: r.amount, state: pay ? pay.state : 'no-receipt', sig: pay ? pay.sig : null }; });
    return '<div class="card" id="p-' + esc(p.id) + '">' +
      '<div class="prog-head" data-clkn-avoid-kids="1"><h2>' + esc(p.label || 'Buy competition') + '</h2><div class="chips"><span class="chip kind">buy competition</span><span class="chip ' + (p.status === 'verified' || p.status === 'closed' ? 'ok' : '') + '">' + esc(p.status) + '</span>' + (p.verifiedBy === 'operator' ? '<span class="chip warn">list set by operator</span>' : '') + '</div></div>' +
      timeline(p) +
      '<div class="terms" data-clkn-avoid-kids="1"><div><b>Metric</b> ' + esc(t.metric === 'single' ? 'largest single buy' : 'cumulative buys') + '</div><div><b>Prizes</b> ' + prizes + '</div><div><b>Hold</b> ' + esc(t.holdHours) + ' h after close</div>' + (t.minVolSol ? '<div><b>Min volume</b> ' + esc(t.minVolSol) + ' SOL</div>' : '') + (t.exclude && t.exclude.length ? '<div><b>Excluded wallets</b> ' + t.exclude.length + '</div>' : '') +
      '<div><b>Terms hash</b> <span class="mono" title="sha256 of the terms this competition ran under — recompute it from the JSON at /api/hub/' + esc(projectId) + '">' + esc(String(p.termsHash || '').slice(0, 16)) + '…</span></div>' +
      (p.sealed ? '<div><b>Sealed</b> ' + ts(p.sealedAt) + ' · <span class="mono" title="sha256 of the sealed (rank, wallet, amount, status) list — recompute it yourself to check it never changed">' + esc(String(p.resultsHash || '').slice(0, 16)) + '…</span></div>' : '') +
      '</div>' +
      statTiles([['Sealed total', amt(tot.sealedUi)], ['Receipted', amt(tot.paidUi)], ['Settled', tot.settled], ['Submitted', tot.submitted || null], ['Winners', tot.winners], ['Disqualified', tot.disqualified]]) +
      (p.payoutNote ? '<div class="fact" style="margin-bottom:8px">' + esc(p.payoutNote) + '</div>' : '') +
      (p.listHistory && p.listHistory.length ? '<div class="fact" style="margin-bottom:8px">The sealed list was replaced by the operator ' + p.listHistory.length + ' time' + (p.listHistory.length > 1 ? 's' : '') + ': <b>' + esc(p.listHistory[p.listHistory.length - 1].note || 'no note') + '</b> (' + ts(p.listHistory[p.listHistory.length - 1].at) + ').</div>' : '') +
      '<div class="sec-title" data-clkn-avoid="1">Winners and receipts</div>' + (winners.length ? payoutTable(winners, sym, true) + winnersExplainSection(p.results) : '<div class="fact">Not verified yet — standings are sealed at the window\'s end, after the ' + esc(t.holdHours) + '-hour hold-through check runs.</div>') +
      reviewList(p.review) +
      (p.voids && p.voids.length ? '<details><summary>' + p.voids.length + ' voided transfer record' + (p.voids.length > 1 ? 's' : '') + '</summary><ul class="facts">' + p.voids.map(function (v) { return '<li><div class="row-flex">' + acct(v.wallet) + ' ' + txLink(v.sig) + ' ' + pill(v.reason || 'void') + '</div></li>'; }).join('') + '</ul></details>' : '') +
      '</div>';
  }
  function drawCard(p, sym) {
    var tot = p.totals || {};
    return '<div class="card" id="p-' + esc(p.id) + '">' +
      '<div class="prog-head" data-clkn-avoid-kids="1"><h2>' + esc(p.label || 'Random draw') + '</h2><div class="chips"><span class="chip kind">reproducible draw</span><span class="chip ' + (p.status === 'drawn' ? 'ok' : '') + '">' + esc(p.status) + '</span></div></div>' +
      timeline(p) +

  // ── chain check: every signature on the page, re-read from Solana in this browser ────────
  async function verifyAll() {
    var cells = Array.prototype.slice.call(document.querySelectorAll('.verify[data-sig]'));
    var sigs = cells.map(function (c) { return c.getAttribute('data-sig'); });
    var uniq = sigs.filter(function (s, i) { return sigs.indexOf(s) === i; });
    var btn = document.getElementById('verifyBtn'), note = document.getElementById('verifyNote');
    if (!uniq.length) { note.textContent = 'No signatures on this page yet.'; return; }
    btn.disabled = true; note.textContent = 'Asking Solana about ' + uniq.length + ' signature' + (uniq.length > 1 ? 's' : '') + '…';
    var status = {};
    try {
      for (var i = 0; i < uniq.length; i += 100) {
        var chunk = uniq.slice(i, i + 100);
        var r = await rpc('getSignatureStatuses', [chunk, { searchTransactionHistory: true }]);
        var vals = (r && r.value) || [];
        chunk.forEach(function (s, k) { status[s] = vals[k] || null; });
      }
    } catch (e) { note.textContent = 'Could not reach the chain right now (' + e.message + ') — nothing was marked.'; btn.disabled = false; return; }
    var good = 0, bad = 0, unknown = 0;
    cells.forEach(function (c) {
      var st = status[c.getAttribute('data-sig')];
      if (st && !st.err && (st.confirmationStatus === 'finalized' || st.confirmationStatus === 'confirmed')) { good++; c.innerHTML = '<span class="pill ok">✓ ' + esc(st.confirmationStatus) + '</span>'; }
      else if (st && st.err) { bad++; c.innerHTML = '<span class="pill bad">failed on-chain</span>'; }
      else { unknown++; c.innerHTML = '<span class="pill warn">not found by this RPC</span>'; }
    });
    note.textContent = 'Checked ' + ts(Date.now()) + ' — ' + good + ' confirmed on Solana' + (bad ? ', ' + bad + ' failed' : '') + (unknown ? ', ' + unknown + ' not found (a lagging node answers this for real transfers too — open the transaction link)' : '') + '.';
    btn.disabled = false;
  }

  // ── check my wallet ───────────────────────────────────────────────────────────────────────
  async function lookup(wallet, onlyProgram) {
    var out = document.getElementById('walletOut');
    var w = String(wallet || '').trim();
    if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(w)) { out.innerHTML = '<div class="err">That is not a Solana address.</div>'; return; }
    out.innerHTML = '<div class="status">LOOKING…</div>';
    try {
      var r = await fetch('/api/hub/' + encodeURIComponent(projectId) + '/wallet/' + encodeURIComponent(w)).then(function (x) { return x.json(); });
      if (!r.ok) { out.innerHTML = '<div class="err">' + esc(r.error || 'lookup failed') + '</div>'; return; }
      if (onlyProgram) r.entries = r.entries.filter(function (e) { return e.program === onlyProgram; });   // this page's program only
      if (!r.entries.length) { out.innerHTML = '<div class="fact" style="margin-top:10px">' + acct(w) + ' does not appear in this program — not as a winner, a payout, or a reviewed wallet.</div>'; return; }
      out.innerHTML = '<ul class="facts" style="margin-top:8px">' + r.entries.map(function (e) {
        return '<li><div class="row-flex"><b class="small" style="color:var(--text)">' + esc(e.label || e.kind) + '</b> ' + pill(e.role) + (e.amountUi != null ? '<span class="mono">' + amt(e.amountUi, e.ticker) + '</span>' : '') + (e.sig ? ' ' + txLink(e.sig) : '') + (e.rank ? '<span class="small">#' + esc(e.rank) + '</span>' : '') + '</div>' + (e.fact ? '<div class="fact">' + esc(e.fact) + '</div>' : '') + (e.note ? '<div class="fact">' + esc(e.note) + '</div>' : '') + '</li>';
      }).join('') + '</ul>';
    } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  }

  function explainBlock(x) {

    if (!e.steps || !e.steps.length) {
      var why = (e.missing || []).map(function (m) { return esc(m); }).join('; ');
      return '<details class="explain"><summary>How this number was computed</summary><div class="fact">The inputs for this receipt were not retained' + (why ? ' (' + why + ')' : '') + ', so no walkthrough can be shown here — the amount above is still the one that was actually sent, on the transaction below.</div></details>';
    }
    var rows = e.steps.map(function (s) {
      return '<li><div class="fact"><b>' + esc(s.label) + ':</b> ' + esc(s.value) + '</div><div class="fact" style="margin-top:2px">' + esc(s.rule) + (s.lesson && s.lesson.href ? ' <a href="' + esc(s.lesson.href) + '">Learn this →</a>' : '') + '</div></li>';
    }).join('');
    return '<details class="explain"><summary>How this number was computed' + (e.matchesReceipt ? '' : ' (could not be fully re-checked)') + '</summary><ul class="facts">' + rows + '</ul></details>';
  }
  async function renderReceipt() {
    var r = await fetch('/api/hub/' + encodeURIComponent(projectId) + '/r/' + encodeURIComponent(receiptSig)).then(function (x) { return x.json(); });
    if (!r.ok) throw new Error(r.error || 'no such receipt');
    var p = r.program, x = r.receipt, sym = p.ticker || r.symbol;
    if (r.brand && r.brand.accent) document.querySelector('.wrap').style.setProperty('--proj-accent', r.brand.accent);
    document.getElementById('title').textContent = 'Receipt';
    document.getElementById('subtitle').textContent = (p.label || p.kind).toUpperCase() + ' · ' + String(r.projectId).toUpperCase();
    var proof = JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getSignatureStatuses', params: [[x.sig], { searchTransactionHistory: true }] }, null, 2);
    app.innerHTML = (r.dryRun ? '<div class="card">' + dryRunBadge() + '</div>' : '') +
      '<div class="card">' + statTiles([['Amount', amt(x.amountUi, sym)], ['State', esc(x.state)], ['Submitted', ts(x.at)]]) +
      '<div class="terms" data-clkn-avoid-kids="1"><div><b>To</b> ' + acct(x.wallet) + '</div><div><b>Token</b> <a class="mono" target="_blank" rel="noopener" href="https://solscan.io/token/' + encodeURIComponent(p.prizeMint || p.mint) + '">' + esc(shortAddr(p.prizeMint || p.mint, 6, 4)) + '</a></div><div><b>Program</b> ' + esc(p.label || p.kind) + '</div>' + (p.termsHash ? '<div><b>Terms hash</b> <span class="mono">' + esc(p.termsHash.slice(0, 16)) + '…</span></div>' : '') + '</div>' +
      '<div class="sec-title" data-clkn-avoid="1">Transaction</div><div class="mono"><a target="_blank" rel="noopener" href="https://solscan.io/tx/' + encodeURIComponent(x.sig) + '">' + esc(x.sig) + '</a></div>' +
      '<div class="verify-bar" data-clkn-avoid="1"><button class="btn" id="verifyBtn">VERIFY ON-CHAIN</button><span class="verify-note" id="verifyNote"><span class="verify" data-sig="' + esc(x.sig) + '"><span class="small">not checked</span></span></span></div>' +
      '<div class="sec-title" data-clkn-avoid="1">Verify it yourself</div><div class="fact">Send this to any Solana RPC. A <span class="mono">confirmationStatus</span> of <span class="mono">confirmed</span> or <span class="mono">finalized</span> with no <span class="mono">err</span> means the transfer is on the chain.</div><pre class="proof">' + esc(proof) + '</pre>' +
      explainBlock(x) +
      '<div class="small" data-clkn-avoid="1" style="margin-top:12px"><a href="/hub/verify?receipt=' + encodeURIComponent(location.origin + '/hub/' + r.projectId + '/r/' + x.sig) + '">Reproduce this receipt in your browser →</a></div>' +
      // AA2: only where a batch id is known (lock-to-earn receipts carry one; a buy-comp receipt
      // reproduces from the sealed standings instead and has no batch to bundle).
      (x.batchId ? '<div class="small" data-clkn-avoid="1" style="margin-top:6px"><a href="/api/hub/' + esc(r.projectId) + '/batch/' + esc(x.batchId) + '/bundle">Download the evidence bundle →</a></div>' : '') +
      '<div class="small" data-clkn-avoid="1" style="margin-top:6px"><a href="/hub/' + esc(r.projectId) + '#p-' + esc(p.id) + '">← all receipts for ' + esc(p.label || p.kind) + '</a></div></div>';
    document.getElementById('verifyBtn').addEventListener('click', verifyAll);
  }

  (async function () {
    try {
      if (!projectId) await renderIndex();
      else if (receiptSig) await renderReceipt();
      else await renderProject();
    } catch (e) { app.innerHTML = '<div class="card"><div class="err">' + esc(e.message || String(e)) + '</div><div class="small" style="margin-top:10px"><a href="/hub">← all projects</a></div></div>'; }
  })();
})();
</script>
