<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/theme.css">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐔 Cluck Norris — Official Transcript</title>
<meta name="description" content="A permanent Cluck Norris transcript — proof of crypto-safety education from the School of Crypto Hard Knocks."/>
<meta property="og:title" content="🐔 Cluck Norris — Official Transcript"/>
<meta property="og:description" content="Proof of crypto-safety education from the School of Crypto Hard Knocks."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root{ color-scheme: dark; }  /* palette comes from theme.css — the private :root that shadowed it was removed 2026-07-30 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0C0C0C;
    
    color: #F9FAFB; font-family: 'Anton', sans-serif; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 540px; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 28px 24px;
  }
  .head { text-align: center; margin-bottom: 22px; }
  .head img { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #D97706; object-fit: cover; }
  .head h1 { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #D97706; margin-top: 12px; }
  .head .sub { font-size: 10px; letter-spacing: 3px; color: #6B7280; margin-top: 2px; }
  .wallet { text-align: center; font-family: 'Courier New', monospace; font-size: 12px;
            color: #9CA3AF; word-break: break-all; margin-bottom: 20px; }
  .badge { border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid; }
  .badge .label { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .badge .detail { font-size: 12px; color: #D1D5DB; margin-top: 6px; line-height: 1.6; }
  .verified { color: #10B981; }
  .self { color: #9CA3AF; }
  .diploma { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.35); }
  .diploma .label { color: #D4AF37; }
  .grad { background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.3); }
  .grad .label { color: #10B981; }
  .holder { background: rgba(217,119,6,0.07); border-color: rgba(217,119,6,0.3); }
  .holder .label { color: #D97706; }
  .cw { background: rgba(96,165,250,0.06); border-color: rgba(96,165,250,0.28); }
  .cw .label { color: #60A5FA; }
  .cw-row { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .cw-label { flex: 0 0 160px; font-size: 12px; color: #D1D5DB; }
  .cw-bar { flex:1; height:6px; background: rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; }
  .cw-fill { display:block; height:100%; background:#60A5FA; border-radius:4px; }
  .cw-count { flex: 0 0 auto; font-family:'Courier New',monospace; font-size:11px; color:#9CA3AF; }
  .ownline { text-align:center; font-size:11px; letter-spacing:1px; margin: -10px 0 18px; }
  .ownline a { color:#FCD34D; text-decoration:underline; cursor:pointer; }
  .own-panel { background: rgba(255,122,24,0.06); border:1px solid rgba(255,122,24,0.3); border-radius:14px; padding:16px; margin-bottom:14px; }
  .own-panel .lbl { font-family:var(--disp); font-size:11px; letter-spacing:2px; color:var(--gold); margin-bottom:6px; }
  .own-panel .why { font-size:13px; color:var(--body-text); line-height:1.6; margin-bottom:10px; }
  .own-panel .wallets { display:flex; flex-wrap:wrap; gap:6px; }
  .own-panel .wbtn { flex:1 1 30%; min-width:92px; background:rgba(255,122,24,0.12); border:1px solid var(--border); border-radius:8px; padding:10px; color:var(--text); font-family:var(--body); font-weight:600; font-size:13px; cursor:pointer; transition:background .15s; }
  .own-panel .wbtn:hover { background:rgba(255,122,24,0.24); }
  .own-panel .st { font-size:12.5px; color:var(--sub); margin-top:11px; text-align:center; line-height:1.55; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions a, .actions button {
    flex: 1; text-align: center; text-decoration: none; cursor: pointer;
    font-family: 'Anton', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    border-radius: 10px; padding: 12px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05); color: #D1D5DB;
  }
  .actions .primary { background: #D97706; color: #fff; border: none; }
  .meta { text-align: center; font-size: 10px; color: #4B5563; letter-spacing: 1px; margin-top: 16px; }
  .loading, .error { text-align: center; color: #6B7280; padding: 40px 0; font-size: 14px; letter-spacing: 1px; }

html{background:var(--bg-grad);background-attachment:fixed;}
body{background:transparent;font-family:var(--body);}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loading">Loading transcript…</div>
  </div>
<script src="/cluck-wallet.js?v=2"></script>
<script src="/cluck-util.js"></script>
<script>
  // esc/rpc/shortAddr/fmt/copyText live in /cluck-util.js — hand-typed copies of
  // esc() had drifted and four pages weren't escaping the single quote.
  const esc = CluckUtil.esc;
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    catch (e) { return ""; }
  }
  async function load() {
    const card = document.getElementById("card");
    const slug = decodeURIComponent((location.pathname.split("/transcript/")[1] || "").replace(/\/+$/, ""));
    if (!slug) { card.innerHTML = '<div class="error">No transcript specified.</div>'; return; }
    let t;
    try {
      const r = await fetch("/api/credential/" + encodeURIComponent(slug));
      const j = await r.json();
      if (!j.success) throw new Error(j.error || "not found");
      t = j.transcript;
    } catch (e) {
      card.innerHTML = '<div class="error">No transcript found for this link.</div>';
      return;
    }

    const parts = [];
    parts.push(
      '<div class="head">' +
        '<img src="/cluck-norris-logo.jpg" alt="Cluck Norris"/>' +
        '<h1>OFFICIAL TRANSCRIPT</h1>' +
        '<div class="sub">SCHOOL OF CRYPTO HARD KNOCKS</div>' +
      '</div>' +
      '<div class="wallet">' + esc(t.wallet) + '</div>' +
      '<div class="ownline" id="ownLine">' +
        (t.ownership && t.ownership.verified
          ? '<span class="verified">✅ ownership verified on-chain</span>'
          : '<span class="self">ownership unverified (pasted address)</span> · <a id="ownStart">verify you own this wallet</a>') +
      '</div>' +
      '<div id="ownPanel"></div>'
    );

    if (t.diploma && t.diploma.passed) {
      const v = t.diploma.verified === "server-scored";
      parts.push(
        '<div class="badge diploma">' +
          '<div class="label">🎓 DIPLOMA — ULTIMATE CHALLENGE</div>' +
          '<div class="detail">Passed at <b>' + esc(t.diploma.pct) + '%</b> (' +
            esc(t.diploma.score) + '/' + esc(t.diploma.total) + ') · ' +
            '<span class="' + (v ? 'verified' : 'self') + '">' +
              (v ? '✅ verified on-chain' : 'self-reported') + '</span>' +
            (t.diploma.at ? ' · ' + esc(fmtDate(t.diploma.at)) : '') +
          '</div>' +
        '</div>'
      );
    }

    if (t.graduation && t.graduation.completed) {
      parts.push(
        '<div class="badge grad">' +
          '<div class="label">🥋 GRADUATE — FULL CURRICULUM</div>' +
          '<div class="detail">Completed all 12 belt lessons · <span class="self">coursework (self-reported)</span>' +
            (t.graduation.at ? ' · ' + esc(fmtDate(t.graduation.at)) : '') +
          '</div>' +
        '</div>'
      );
    }

    if (t.holder && t.holder.isHolder) {
      parts.push(
        '<div class="badge holder">' +
          '<div class="label">🐔 CLKN HOLDER</div>' +
          '<div class="detail">Verified CLKN holder at claim time</div>' +
        '</div>'
      );
    }

    const cw = t.coursework || {};
    const cwTracks = [];
    if (cw.belts && cw.belts.count > 0) cwTracks.push(["School of Hard Knocks", cw.belts]);
    if (cw.incubator && cw.incubator.count > 0) cwTracks.push(["The Incubator", cw.incubator]);
    if (cw.lpLab && cw.lpLab.count > 0) cwTracks.push(["LP Lab", cw.lpLab]);
    if (cwTracks.length) {
      const rows = cwTracks.map(function (tr) {
        const c = tr[1], pct = c.total ? Math.round((c.count / c.total) * 100) : 0;
        return '<div class="cw-row">' +
          '<span class="cw-label">' + esc(tr[0]) + '</span>' +
          '<span class="cw-bar"><span class="cw-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="cw-count">' + esc(c.count) + '/' + esc(c.total) + '</span>' +
        '</div>';
      }).join("");
      parts.push('<div class="badge cw"><div class="label">COURSEWORK (self-reported)</div>' + rows + '</div>');
    }

    if (!(t.diploma && t.diploma.passed) && !(t.graduation && t.graduation.completed) && !cwTracks.length) {
      parts.push('<div class="error">This transcript has no recorded achievements yet.</div>');
    }

    const shareUrl = location.origin + "/transcript/" + esc(t.slug);
    parts.push(
      '<div class="actions">' +
        '<button class="primary" id="share">📋 COPY SHARE LINK</button>' +
        '<a href="/">🏫 THE SCHOOL</a>' +
      '</div>' +
      '<div class="meta">clucknorris.app · permanent transcript</div>'
    );

    card.innerHTML = parts.join("");
    const btn = document.getElementById("share");
    if (btn) btn.onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText(shareUrl);
      btn.textContent = "✓ COPIED!";
      setTimeout(() => { btn.textContent = "📋 COPY SHARE LINK"; }, 1800);
    };

    // Tier-2: prove you own the wallet on this transcript.
    //
    // This used to be a tiny CLKN send with a unique decimal as the key. Retired
    // 2026-07-30 (owner's call — the manual-send flow complicated every gated tool
    // for no real uptake). Connect & sign proves exactly the same thing, that you
    // hold the key, and costs nothing: it is a MESSAGE signature, not a transaction
    // — no tokens move, no spending approval is granted, nothing lingers.
    //
    // minHold:0 asks /api/premium-verify-sig for an ownership-only proof with no
    // holder gate; a graduate may hold no CLKN at all. That can't weaken premium,
    // which re-checks the live 2M balance when a trace actually runs.
    // The 11-wallet registry lives in /cluck-wallet.js — five pages used to carry
    // their own copy of this list and they drifted apart (Buy Special ended up
    // detecting two, the Locker Room three). Aliased rather than rewritten so every
    // WALLETS[id].name / .detect() / .download call site below is unchanged.
    const WALLETS = CluckWallet.WALLETS;
    const ownStartLink = document.getElementById("ownStart");
    if (ownStartLink) ownStartLink.onclick = (e) => {
      e.preventDefault();
      document.getElementById("ownPanel").innerHTML =
        '<div class="own-panel">' +
          '<div class="lbl">PROVE THIS WALLET IS YOURS</div>' +
          '<div class="why">Connect the wallet on this transcript and approve a <strong>signature</strong> on a one-line message. This is <strong>not</strong> a transaction — it moves no tokens, grants no spending approval, and leaves nothing behind. It only proves you hold the key.</div>' +
          '<div class="wallets" id="ownWallets">' +
            Object.keys(WALLETS).map(id => '<button class="wbtn" data-w="' + id + '">' + WALLETS[id].name + '</button>').join('') +
          '</div>' +
          '<div class="wchip" id="ownChip" style="display:none"><span class="dot"></span><span class="addr" id="ownAddr">—</span><button class="dc" type="button" id="ownDisconnect">Disconnect</button></div>' +
          '<div class="st" id="ownStatus">Pick the wallet you used to claim this transcript.</div>' +
        '</div>';
      document.querySelectorAll('#ownPanel .wbtn').forEach(b => {
        b.onclick = () => connectAndSign(b.getAttribute('data-w'));
      });
      document.getElementById('ownDisconnect').onclick = ownDisconnect;
    };

    function ownMsg(html, bad) {
      const st = document.getElementById("ownStatus");
      if (st) st.innerHTML = bad ? '<span class="self">' + html + '</span>' : html;
    }

    let ownProvider = null;
    function ownShowChip(addr) {
      const c = document.getElementById('ownChip');
      if (!c) return;
      document.getElementById('ownAddr').textContent = addr.slice(0,4) + '…' + addr.slice(-4);
      c.style.display = 'flex';
      document.getElementById('ownWallets').style.display = 'none';
    }
    function ownDisconnect() {
      // Best-effort on the wallet's side; unconditional on ours.
      try { ownProvider && ownProvider.disconnect && ownProvider.disconnect(); } catch (_) {}
      ownProvider = null;
      const c = document.getElementById('ownChip');
      if (c) c.style.display = 'none';
      const ws = document.getElementById('ownWallets');
      if (ws) ws.style.display = 'flex';
      ownMsg('Disconnected. Pick a wallet to verify.');
    }

    async function connectAndSign(id) {
      const w = WALLETS[id], provider = w && w.detect();
      if (!provider) return ownMsg(w.name + " isn't detected in this browser. Open this page in " + w.name + "'s own browser, or use its desktop extension.", true);
      try {
        ownMsg("Connecting " + w.name + "…");
        const resp = await provider.connect();
        ownProvider = provider;
        const wallet = (resp && resp.publicKey && resp.publicKey.toString()) || (provider.publicKey && provider.publicKey.toString());
        if (!wallet) throw new Error("no public key returned");
        ownShowChip(wallet);
        const nonce = Date.now();
        const message = "Cluck Norris — verify wallet for transcript ownership\nwallet: " + wallet + "\nnonce: " + nonce + "\nThis only proves you own this wallet. It is NOT a transaction, moves no tokens, and grants no permissions.";
        ownMsg("Approve the <strong>signature</strong> in " + w.name + " — this is not a transaction.");
        const sigRes = await provider.signMessage(new TextEncoder().encode(message), "utf8");
        const sigBytes = (sigRes && sigRes.signature) ? sigRes.signature : sigRes;
        const sigB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(sigBytes)));
        ownMsg("Verifying signature…");
        const r = await fetch("/api/premium-verify-sig", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ wallet, signature: sigB64, message, minHold: 0 })
        });
        const d = await r.json();
        if (!d.success || !d.proof) return ownMsg(esc(d.error || "Signature did not verify."), true);
        return bindOwn(d.proof);
      } catch (err) {
        ownMsg(esc((err && err.message) || "Could not connect — try again."), true);
      }
    }

    async function bindOwn(proof) {
      const st = document.getElementById("ownStatus");
      if (st) st.textContent = "Signature verified — recording ownership…";
      try {
        const r = await fetch("/api/credential/verify-ownership", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: slug, proof }) });
        const d = await r.json();
        if (d.success) return load(); // re-render with the verified badge
        if (st) st.innerHTML = '<span class="self">' + esc(d.error || "Could not verify ownership.") + '</span>';
      } catch (e) { if (st) st.innerHTML = '<span class="self">Network error — try again.</span>'; }
    }
  }
  load();
</script>
<script defer src="/cluck-nav.js"></script>
</body>
</html>
