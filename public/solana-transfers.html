<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sending Tokens, And Why The First One Costs Extra</title>

<meta property="og:title" content="Sending Tokens, And Why The First One Costs Extra — Cluck Norris"/>
<meta property="og:description" content="An SPL transfer moves between token accounts, not wallets — and sending someone a token for the first time can mean creating an account for them, with a deposit somebody has to pay. In plain words."/>

<meta property="og:url" content="https://clucknorris.app/solana/transfers"/>
<meta property="og:image" content="https://clucknorris.app/og/hub-card.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Sending Tokens, And Why The First One Costs Extra — Cluck Norris"/>
<meta name="twitter:description" content="An SPL transfer moves between token accounts, not wallets — and sending someone a token for the first time can mean creating an account for them, with a deposit somebody has to pay. In plain words."/>
<meta name="twitter:image" content="https://clucknorris.app/og/hub-card.png"/>
<style>
  /* palette + type scale come from theme.css — never redefine a token here */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  .back-home { display:inline-flex; align-items:center; min-height:44px; gap:6px; font-size:11px; font-weight:700; letter-spacing:2px; color:var(--orange); text-decoration:none; margin-bottom:14px; }
  .header { text-align:center; margin-bottom:18px; }
  .header h1 { font-family:var(--disp); font-size:26px; letter-spacing:.3px; color:var(--gold); font-weight:400; line-height:1.25; }
  .header p { font-size:11px; color:var(--sub); letter-spacing:2px; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:14px; }
  .intro { font-size:var(--body-text, 15px); color:var(--subtext, #9CA3AF); line-height:1.7; }
  .sec-title { font-family:var(--disp); font-size:13px; letter-spacing:2px; margin:0 0 8px; color:var(--gold); text-transform:uppercase; }
  .fact { font-size:var(--body-text, 15px); color:var(--subtext, #9CA3AF); line-height:1.7; }
  .fact + .fact { margin-top:10px; }
  .fact b, .fact code { color:var(--text); }
  .fact code { font-family:var(--mono); font-size:.92em; background:rgba(255,255,255,.06); padding:1px 5px; border-radius:4px; word-break:break-word; }
  /* the missing-memo warning and the no-undo card get the same real visual weight the rent
     page gives its scam card — a distinct red card, not a tucked-away footnote. */
  .card.scam { background:var(--redbg, rgba(232,30,14,.14)); border:1px solid rgba(232,30,14,.4); }
  .scam .sec-title { color:#FCA5A5; }
  .scam .fact { color:#FBD5D0; }
  .scam .fact b { color:#FEE2E0; }
  .footnote { font-size:12.5px; color:var(--sub); line-height:1.6; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-soft, rgba(255,255,255,.06)); }
  /* a footnote link is often the sole content of its div — not inline in a sentence, so it
     needs a real 44px tap target. Same expand-with-negative-margin trick as .small a. */
  .footnote a { display:inline-block; padding:14px 3px; margin:-14px -3px; color:var(--cyan, #67E8F9); text-decoration:none; }
  .links-card { display:flex; flex-direction:column; }
  .links-card a { display:flex; align-items:center; min-height:44px; color:var(--cyan, #67E8F9); text-decoration:none; font-size:14px; }
  .small { font-size:12px; color:var(--sub); }
  /* a standalone link inside a .small line still needs a real 44px tap target — same
     expand-with-negative-margin trick public/hub-glossary.html / solana-rent.html use. */
  .small a { display:inline-block; padding:14px 3px; margin:-14px -3px; color:var(--cyan, #67E8F9); text-decoration:none; }
  .status { text-align:center; color:var(--sub); font-size:12px; letter-spacing:2px; padding:18px 0; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back-home" href="/solana" data-clkn-avoid="1">← THE SOLANA ROOM</a>
  <div class="header">
    <h1 data-clkn-avoid="1">Sending tokens, and why the first one costs extra</h1>
    <p data-clkn-avoid="1">WHO PAYS TO OPEN THE DOOR ON THE OTHER END</p>
  </div>

  <div id="content" data-i18n-skip="1"><div class="status">LOADING…</div></div>
</main>

<script src="/cluck-util.js"></script>
<script>
(function () {
  var esc = CluckUtil.esc;
  var contentEl = document.getElementById('content');

  // ── i18n for the strings THIS SCRIPT builds — same small page-local lookup as
  // public/hub-glossary.html / public/solana-room.html / public/solana-rent.html: a curated dict
  // lookup over window.CLKN_I18N.dict, English literal on a miss, no machine-translation fallback.
  // scripts/i18n-audit.cjs's Hub-pages gate and scripts/solana-room-test.cjs both scan this file's
  // <script> block for every literal passed to t() and require it in all six dictionaries.
  function t(s) {
    try {
      var d = window.CLKN_I18N && window.CLKN_I18N.dict;
      if (d && d[s]) return d[s];
    } catch (_) {}
    return s;
  }
  function waitForI18n(timeoutMs) {
    return new Promise(function (resolve) {
      if (window.CLKN_I18N) return resolve();
      var start = Date.now();
      (function poll() {
        if (window.CLKN_I18N || Date.now() - start > (timeoutMs || 1500)) return resolve();
        setTimeout(poll, 30);
      })();
    });
  }

  function render() {
    var html = '';

    html += '<div class="card"><div class="intro">' + esc(t("Sending a token feels like handing something from your wallet to theirs. What actually moves is a balance between two token accounts, and if the recipient has never held that token before, their account might not exist yet — which is why the very first send to someone new can cost noticeably more than every send after it.")) + '</div></div>';

    html += '<div class="card" data-section="account-to-account">';
    html += '<div class="sec-title">' + esc(t('A transfer moves between token accounts, not wallets')) + '</div>';
    html += '<div class="fact">' + esc(t("Transferring an SPL token moves a balance from one token account to another token account for that same mint. It never touches the mint's total supply — a transfer only updates the two balances involved.")) + '</div>';
    html += '<div class="fact">' + esc(t("As covered on the wallet page, every token you hold lives in its own token account, not inside your main wallet account. Sending a token is really telling the network: move this many units out of my token account for this mint, into the matching token account on the other side.")) + '</div>';
    html += '<div class="footnote"><a href="/solana/wallet">' + esc(t('What your wallet actually holds, covered on the previous page →')) + '</a></div>';
    html += '</div>';

    html += '<div class="card" data-section="sol-vs-spl">';
    html += '<div class="sec-title">' + esc(t('Sending SOL is simpler than sending a token')) + '</div>';
    html += '<div class="fact">' + esc(t("SOL lives directly in a wallet's own account, and that account already exists the moment a wallet does. Sending SOL to anyone never needs to create anything new — it just adjusts two numbers that already exist.")) + '</div>';
    html += '<div class="fact">' + esc(t("Every other token is different. It needs its own token account for that specific mint, and if the person you're sending to has never held that token before, that account doesn't exist yet — someone has to create it before the transfer can land.")) + '</div>';
    html += '</div>';

    html += '<div class="card" data-section="first-transfer-cost">';
    html += '<div class="sec-title">' + esc(t("The first transfer of a token can cost more — and it surprises people")) + '</div>';
    html += '<div class="fact">' + esc(t('Creating that missing token account needs the same small, refundable rent-exempt SOL deposit covered on the rent page. Whoever signs as the "payer" when the account is created funds that deposit up front — and in most wallets and apps, when you send a token to someone for the first time, that payer is you, the sender.')) + '</div>';
    html += '<div class="fact">' + esc(t("That's why a first-ever send of a token can cost visibly more than a normal transfer, with nothing wrong having happened — you paid a small, refundable deposit to open a door on the other end, not a fee that disappears.")) + '</div>';
    html += '<div class="footnote"><a href="/solana/rent">' + esc(t('The full breakdown of that deposit, and the scam it invites →')) + '</a></div>';
    html += '</div>';

    html += '<div class="card scam" data-section="memo-warning">';
    html += '<div class="sec-title">' + esc(t('Sending to an exchange without a required note can lose your deposit')) + '</div>';
    html += '<div class="fact">' + esc(t("Solana's token program has an option some accounts turn on called a required memo, which forces every incoming transfer to carry a short attached note. Exchanges and platforms that pool many users behind one shared deposit address commonly use this to tell deposits apart — the memo, tag, or reference number is how they know which account to credit.")) + '</div>';
    html += '<div class="fact"><b>' + esc(t("If a platform tells you to include a memo, tag, or reference number with a deposit, that instruction is doing real work — it is not optional decoration. Sending without it, when one is required, can mean nobody can tell it was meant for you, and there is no address book on the other end that already knows.")) + '</b></div>';
    html += '</div>';

    html += '<div class="card scam" data-section="no-undo">';
    html += '<div class="sec-title">' + esc(t('A transfer that lands cannot be taken back')) + '</div>';
    html += '<div class="fact"><b>' + esc(t("Once a transaction confirms on Solana, it is final. There is no support line that reverses it, no chargeback, and no undo — for a wrong address, a wrong amount, or a missing memo. Double-check the address and any required note every single time, especially the first time you send to somewhere new.")) + '</b></div>';
    html += '</div>';

    html += '<div class="card links-card">';
    html += '<a href="/solana/rent">' + esc(t('Read the full breakdown of the rent-exempt deposit →')) + '</a>';
    html += '<a href="/wallet-checkup">' + esc(t('Check what your own wallet has approved — free, read-only, no signup →')) + '</a>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="sec-title">' + esc(t('Sources')) + '</div>';
    html += '<div class="small"><a href="https://solana.com/docs/tokens/basics/transfer-tokens" target="_blank" rel="noopener">' + esc(t('Transfer Tokens — moving balances between token accounts, on solana.com →')) + '</a></div>';
    html += '<div class="small" style="margin-top:8px"><a href="https://solana.com/docs/tokens/basics/create-token-account" target="_blank" rel="noopener">' + esc(t('Create a Token Account — the rent-exempt deposit and who can pay it, on solana.com →')) + '</a></div>';
    html += '<div class="small" style="margin-top:8px"><a href="https://solana.com/docs/tokens/extensions" target="_blank" rel="noopener">' + esc(t('Token Extensions — the required-memo extension, on solana.com →')) + '</a></div>';
    html += '</div>';

    html += '<div class="small" style="text-align:center"><a href="/solana">' + esc(t('Back to the Solana Room →')) + '</a></div>';

    contentEl.innerHTML = html;
  }

  render();
  waitForI18n(1500).then(render);
})();
</script>
<!-- STORE:OUT --><script defer src="/cluck-nav.js"></script><!-- /STORE:OUT -->
</body>
</html>
