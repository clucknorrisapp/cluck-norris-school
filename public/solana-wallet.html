<meta property="og:description" content="A wallet doesn't hold your tokens the way a folder holds files. What's really sitting on-chain under your address, what a seed phrase actually is, and what connecting a wallet does and doesn't grant — in plain words."/>

<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="What Your Wallet Actually Holds — Cluck Norris"/>
<meta name="twitter:description" content="A wallet doesn't hold your tokens the way a folder holds files. What's really sitting on-chain under your address, what a seed phrase actually is, and what connecting a wallet does and doesn't grant — in plain words."/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* palette + type scale come from theme.css — never redefine a token here */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  .back-home { display:inline-flex; align-items:center; min-height:44px; gap:6px; font-size:11px; font-weight:700; letter-spacing:2px; color:var(--orange); text-decoration:none; margin-bottom:14px; }
  .header { text-align:center; margin-bottom:18px; }
  .header h1 { font-family:var(--disp); font-size:26px; letter-spacing:.3px; color:var(--gold); font-weight:400; line-height:1.25; }
  .header p { font-size:11px; color:var(--sub); letter-spacing:2px; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:14px; }
  .intro { font-size:var(--body-text, 15px); color:var(--subtext, #9CA3AF); line-height:1.7; }
  .sec-title { font-family:var(--disp); font-size:13px; letter-spacing:2px; margin:0 0 8px; color:var(--gold); text-transform:uppercase; }
  .fact { font-size:var(--body-text, 15px); color:var(--subtext, #9CA3AF); line-height:1.7; }
  .fact + .fact { margin-top:10px; }
  .fact b, .fact code { color:var(--text); }
  .fact code { font-family:var(--mono); font-size:.92em; background:rgba(255,255,255,.06); padding:1px 5px; border-radius:4px; word-break:break-word; }
  /* the "seed phrase" guardrail gets the same real visual weight the rent page gives its scam
     card — a distinct red card, not a tucked-away footnote. */
  .card.scam { background:var(--redbg, rgba(232,30,14,.14)); border:1px solid rgba(232,30,14,.4); }
  .scam .sec-title { color:#FCA5A5; }
  .scam .fact { color:#FBD5D0; }
  .scam .fact b { color:#FEE2E0; }
  .footnote { font-size:12.5px; color:var(--sub); line-height:1.6; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-soft, rgba(255,255,255,.06)); }
  /* a footnote link is often the sole content of its div — not inline in a sentence, so it
     needs a real 44px tap target. Same expand-with-negative-margin trick as .small a. */
  .footnote a { display:inline-block; padding:14px 3px; margin:-14px -3px; color:var(--cyan, #67E8F9); text-decoration:none; }
  .links-card { display:flex; flex-direction:column; }
  .links-card a { display:flex; align-items:center; min-height:44px; color:var(--cyan, #67E8F9); text-decoration:none; font-size:14px; }
  .small { font-size:12px; color:var(--sub); }
  /* a standalone link inside a .small line still needs a real 44px tap target — same
     expand-with-negative-margin trick public/hub-glossary.html / solana-rent.html use. */
  .small a { display:inline-block; padding:14px 3px; margin:-14px -3px; color:var(--cyan, #67E8F9); text-decoration:none; }
  .status { text-align:center; color:var(--sub); font-size:12px; letter-spacing:2px; padding:18px 0; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back-home" href="/solana" data-clkn-avoid="1">← THE SOLANA ROOM</a>
  <div class="header">
    <h1 data-clkn-avoid="1">What your wallet actually holds</h1>
    <p data-clkn-avoid="1">WHAT'S REALLY ON-CHAIN UNDER YOUR ADDRESS</p>
  </div>

  <div id="content" data-i18n-skip="1"><div class="status">LOADING…</div></div>
</main>

<script src="/cluck-util.js"></script>
<script>
(function () {
  var esc = CluckUtil.esc;
  var contentEl = document.getElementById('content');

  // ── i18n for the strings THIS SCRIPT builds — same small page-local lookup as
  // public/hub-glossary.html / public/solana-room.html / public/solana-rent.html: a curated dict
  // lookup over window.CLKN_I18N.dict, English literal on a miss, no machine-translation fallback.
  // scripts/i18n-audit.cjs's Hub-pages gate and scripts/solana-room-test.cjs both scan this file's
  // <script> block for every literal passed to t() and require it in all six dictionaries.
  function t(s) {
    try {
      var d = window.CLKN_I18N && window.CLKN_I18N.dict;
      if (d && d[s]) return d[s];
    } catch (_) {}
    return s;
  }
  function waitForI18n(timeoutMs) {
    return new Promise(function (resolve) {
      if (window.CLKN_I18N) return resolve();
      var start = Date.now();
      (function poll() {
        if (window.CLKN_I18N || Date.now() - start > (timeoutMs || 1500)) return resolve();
        setTimeout(poll, 30);
      })();
    });
  }

  function render() {
    var html = '';

    html += '<div class="card"><div class="intro">' + esc(t("You already know your wallet address holds your tokens. It doesn't — not the way a folder holds files, or a bank account holds a number. A wallet app is really a keypair plus a window onto several separate accounts on-chain. Here's what's actually there, and what \"connecting\" a wallet does and doesn't let a site do.")) + '</div></div>';

    html += '<div class="card">';
    html += '<div class="sec-title">' + esc(t('A wallet is a keypair, not a container')) + '</div>';
    html += '<div class="fact">' + esc(t('A Solana wallet is, underneath the app, two mathematically linked numbers: a private key and a public key. Your address — the string you copy and share — is just your public key, written out as text.')) + '</div>';
    html += '<div class="fact">' + esc(t("The address itself holds nothing. It's a lookup key. What it points to is a set of separate accounts on Solana's ledger, and that's where every balance actually lives.")) + '</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="sec-title">' + esc(t('SOL lives in one account: yours')) + '</div>';
    html += '<div class="fact">' + esc(t("Your SOL balance is stored directly inside your own wallet account — a single number sitting right where your address lives. There's no separate \"SOL account\" to think about.")) + '</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="sec-title">' + esc(t('Every other token lives in its own separate account')) + '</div>';
    html += '<div class="fact">' + esc(t("Any SPL token you hold is not stored inside your wallet account. Each one lives in its own token account — a completely different address on-chain that your wallet just knows how to find.")) + '</div>';
    html += '<div class="fact">' + esc(t("Wallets and apps find it the same way every time: it's calculated from your address plus that token's mint address, so it always lands at the same predictable spot, called an Associated Token Account. Nobody has to remember or share that address — any app can recompute it instantly.")) + '</div>';
    html += '<div class="fact">' + esc(t("Hold five different tokens and you don't have one wallet with five balances inside it. You have six accounts on-chain: your main wallet account, plus one token account per token.")) + '</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="sec-title">' + esc(t('Why a new token costs a small deposit')) + '</div>';
    html += '<div class="fact">' + esc(t("Opening any account on Solana — including a new token account — needs a small SOL deposit just so the network agrees to keep storing it. That's not a fee an app charges you; it's a refundable deposit that comes back if the account is ever closed.")) + '</div>';
    html += '<div class="footnote"><a href="/solana/rent">' + esc(t('The full breakdown of that deposit, what changed recently, and the scam it invites →')) + '</a></div>';
    html += '</div>';

    html += '<div class="card scam" data-section="seed-phrase">';
    html += '<div class="sec-title">' + esc(t('The seed phrase IS the wallet')) + '</div>';
    html += '<div class="fact"><b>' + esc(t("Your 12- or 24-word seed phrase isn't a password, a PIN, or a backup code for something else. It IS the keypair, written in words instead of numbers — anyone who has it can rebuild your exact keys and sign anything as you, from any device, forever.")) + '</b></div>';
    html += '<div class="fact">' + esc(t('No legitimate app, exchange, "support" agent, or claim page ever needs it — not to connect, not to check a balance, not to send you anything. The only place it belongs is in your own wallet\'s recovery flow, typed by you, never into a website.')) + '</div>';
    html += '</div>';

    html += '<div class="card" data-section="connecting">';
    html += '<div class="sec-title">' + esc(t('What connecting a wallet actually grants')) + '</div>';
    html += '<div class="fact">' + esc(t("Clicking \"Connect Wallet\" asks your wallet extension for one thing: your public address. That's the same information you'd give someone by reading it off your screen. It grants a site nothing more than knowing your address and, usually, your balances — reading, not moving.")) + '</div>';
    html += '<div class="fact">' + esc(t("Nothing can leave a wallet without a signature — a separate, explicit approval for one specific transaction, shown by your wallet app itself, not the website. A site can ask; only your signature authorizes.")) + '</div>';
    html += '<div class="fact">' + esc(t("That's also the trap: a signature can authorize more than it looks like. Approving a token \"delegate\" or signing a transaction you didn't read can hand over spending rights without a single SOL visibly moving. Read what your wallet's own pop-up says it's signing — if it doesn't match what the site told you, stop.")) + '</div>';
    html += '</div>';

    html += '<div class="card links-card">';
    html += '<a href="/wallet-checkup">' + esc(t('Check what your own wallet has approved — free, read-only, no signup →')) + '</a>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="sec-title">' + esc(t('Sources')) + '</div>';
    html += '<div class="small"><a href="https://solana.com/docs/core/accounts" target="_blank" rel="noopener">' + esc(t('Accounts — the account model a wallet and a token account are both built from, on solana.com →')) + '</a></div>';
    html += '<div class="small" style="margin-top:8px"><a href="https://solana.com/docs/tokens/basics/create-token-account" target="_blank" rel="noopener">' + esc(t('Create a Token Account — how an Associated Token Account is derived, on solana.com →')) + '</a></div>';
    html += '<div class="small" style="margin-top:8px"><a href="https://solana.com/docs/core/transactions" target="_blank" rel="noopener">' + esc(t('Transactions — what a signature actually authorizes, on solana.com →')) + '</a></div>';
    html += '</div>';

    html += '<div class="small" style="text-align:center"><a href="/solana">' + esc(t('Back to the Solana Room →')) + '</a></div>';

    contentEl.innerHTML = html;
  }

  render();
  waitForI18n(1500).then(render);
})();
</script>
<!-- STORE:OUT --><script defer src="/cluck-nav.js"></script><!-- /STORE:OUT -->
</body>
</html>
