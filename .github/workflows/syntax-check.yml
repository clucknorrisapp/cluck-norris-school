# Cheap insurance for a single-branch auto-deploy: Railway ships main directly,
# so a syntax error in server.js takes the whole live app down (payments, vault,
# Telegram, every tool). This gate catches that class of failure on every push.
# It is NOT a test suite — just "does Node parse every backend file".
name: syntax-check
on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # normie-quest/*.js is in this list because server.js require()s two of them at the top
      # level -- routes.js (app.use, server.js:10946) and nq-digest.js (:11862) -- with no try.
      # A parse error in either does not break Normie Quest, it stops the whole site booting,
      # and Railway auto-deploys main with no staging. They were outside the loop until
      # 2026-08-02, so that failure had nothing standing in front of it.
      # NOT normie-quest/src/*.js: game_logic.js contains <script> blocks and is not plain JS,
      # so node --check fails on it by design. normie-quest/test/nq-verify.cjs checks that one
      # by splitting on the script tags and compiling each block.
      - name: node --check every backend entrypoint and lib
        run: |
          set -e
          for f in server.js hatchery.js securitycoop.js whirlpool-mm.js lib/*.js normie-quest/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      # The backend check above cannot see the React app. An undefined component compiles
      # fine and only throws at runtime, so it auto-deploys and blanks the page — which is
      # exactly how <CalcErrorBoundary> shipped broken to the live LP Lab.
      - name: undefined-JSX-component guard
        run: node scripts/check-jsx-components.js
      # The landing advertised "12 CLASSES • 72 EXAMS" and "6 BEGINNER LESSONS" while the real
      # curriculum held 70 and 7. Hand-typed public counts rot silently; this catches the mirror.
      - name: curriculum count-drift guard
        run: node scripts/check-counts.js
      - name: Normie Quest level-geometry guard (jumpability + no floating fixtures)
        run: node normie-quest/test/nq-geometry-check.cjs
      # The leaderboard's anti-forgery floor (points-budget + checkpoint tokens) is load-bearing —
      # a regression silently re-opens score forgery. Pure-node, no server needed.
      - name: Normie Quest leaderboard anti-forgery test
        run: node normie-quest/test/nq-leaderboard-test.cjs
      # The per-level point budgets are DERIVED from the level data; if game_logic.js changes a
      # level's coins/enemies/bonuses but nq-budgets.json isn't regenerated, the ceiling drifts.
      # Regenerate and fail if the committed table is stale.
      - name: Normie Quest budget-table freshness guard
        run: |
          node normie-quest/tools/gen-budgets.cjs
          git diff --exit-code normie-quest/nq-budgets.json \
            || (echo "::error::nq-budgets.json is stale — run node normie-quest/tools/gen-budgets.cjs and commit" && exit 1)
      # The served game HTML is BUILT from src/game_logic.js by build.js. A fix made to the built
      # HTML but not the source (or vice-versa) silently reverts on the next build — the exact
      # drift that shipped the mobile joystick fix only to the served file. Rebuild and fail if the
      # committed HTML isn't a fresh build of source.
      - name: Normie Quest build-freshness guard (served HTML == build(source))
        run: |
          node normie-quest/src/build.js
          git diff --exit-code normie-quest/public/normie-quest-platformer.html normie-quest/public/normie-quest-play.html \
            || (echo "::error::served HTML is stale — run node normie-quest/src/build.js and commit" && exit 1)

  # Renders the actual app. The checks above are all static — they cannot see a component that
  # compiles fine and throws on mount, which is how the LP Lab shipped blank to production.
  # Split into its own job so a browser download never slows the fast static gate.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Playwright is installed here rather than in package.json on purpose: Railway installs
      # devDependencies to run the Vite build, and playwright's postinstall drags browser
      # binaries into the production image.
      - name: install playwright + chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: render every screen and lesson
        run: node scripts/smoke-test.js
