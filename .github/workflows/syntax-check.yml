# Cheap insurance for a single-branch auto-deploy: Railway ships main directly,
# so a syntax error in server.js takes the whole live app down (payments, vault,
# Telegram, every tool). This gate catches that class of failure on every push.
# It is NOT a test suite — just "does Node parse every backend file".
name: syntax-check
# claude/** removed from push triggers (2026-08-25): every PR branch commit was
# running the ENTIRE suite twice — once for the push, once for the pull_request —
# doubling wait on every change for zero extra coverage. PRs cover feature
# branches; push keeps main/develop covered for direct pushes.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate Normie Quest visual baselines in CI and upload them as an artifact (download + commit to adopt them)"
        type: boolean
        default: false

# A follow-up commit to the same PR supersedes the previous run — cancel it
# instead of finishing checks on code that no longer exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The build-freshness guard below rebuilds the game shell, and since batch 2 (2026-09-07)
      # build.js encodes the sprites to lossless WebP through `sharp` (a devDependency). Without the
      # install the build silently fell back to PNG data URIs and the guard diffed every sprite.
      - run: npm ci --no-audit --no-fund
      # normie-quest/*.js is in this list because server.js require()s two of them at the top
      # level -- routes.js (app.use, server.js:10946) and nq-digest.js (:11862) -- with no try.
      # A parse error in either does not break Normie Quest, it stops the whole site booting,
      # and Railway auto-deploys main with no staging. They were outside the loop until
      # 2026-08-02, so that failure had nothing standing in front of it.
      # NOT normie-quest/src/*.js: game_logic.js contains <script> blocks and is not plain JS,
      # so node --check fails on it by design. normie-quest/test/nq-verify.cjs checks that one
      # by splitting on the script tags and compiling each block.
      # swap.js and lib/lp-rescue/*.js are required unguarded at server.js top level too
      # (`require("./swap")`, `require("./lib/lp-rescue")`); `lib/*.js` does not recurse, so
      # they sat outside the loop until 2026-09-02.
      - name: node --check every backend entrypoint and lib
        run: |
          set -e
          for f in server.js hatchery.js securitycoop.js whirlpool-mm.js swap.js lib/*.js lib/hub/*.js lib/lp-rescue/*.js normie-quest/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      # The backend check above cannot see the React app. An undefined component compiles
      # fine and only throws at runtime, so it auto-deploys and blanks the page — which is
      # exactly how <CalcErrorBoundary> shipped broken to the live LP Lab.
      - name: undefined-JSX-component guard
        run: node scripts/check-jsx-components.js
      # The landing advertised "12 CLASSES • 72 EXAMS" and "6 BEGINNER LESSONS" while the real
      # curriculum held 70 and 7. Hand-typed public counts rot silently; this catches the mirror.
      - name: curriculum count-drift guard
        run: node scripts/check-counts.js
      # check-counts.js above only pins per-course LESSON COUNTS. This catches content drift the
      # counts alone would miss: extractor rewritten 2026-09-18 (docs/COLOSSEUM_ROADMAP.md §12
      # BB1) after the old one only read src/App.jsx and silently dropped the LP Lab and Deep
      # Dive courses on a re-run. --check re-extracts from the real sources (esbuild-compiled,
      # not regex-scanned) and fails if data/curriculum.json was not committed with them.
      - name: curriculum extraction freshness (data/curriculum.json)
        run: node scripts/extract-curriculum.js --check
      # Seven languages are promised (CLAUDE.md); six are curated dicts keyed on the English
      # source string itself (no en.json — see the script header). Cross-language key diffs and
      # placeholder drift are real bugs and gate; the base/school source-scan stays informational
      # (most of that surface is meant to fall through to machine translation, by design), but the
      # locker-room source-scan gates too — docs/HANDOFF_2026-08-02.md caught 10 of 14 FAQ headers
      # on that one page silently missing their curated key, and docs/I18N_AUDIT_2026-09-08.md
      # mechanised the check and found 109 more. BLOCKING as of 2026-09-08 (no --warn-only): that
      # 109-gap was the only thing the default mode failed on, and it's now filled in all six
      # public/i18n/<lang>.locker.json files — a future PR that adds locker copy without a
      # dictionary key, or drops a key from one language, now fails CI instead of shipping silent.
      - name: i18n audit (gating — see docs/I18N_AUDIT_2026-09-08.md)
        run: node scripts/i18n-audit.cjs
      # CUNA lock-to-earn: who qualifies and how a day's pool is split. Zero deps, so it belongs
      # in this job. Mutation-tested — reverting the cancelable check to the field name that does
      # not exist, measuring terms backward from vesting_start_time, tolerating a missing
      # firstSeenAt, flattening the weight or dropping the largest-remainder split each fails the
      # test named for it.
      # Listing Checkup: the normaliser, comparator, verdicts, the source adapters on recorded
      # fixtures and the capped cache — pure node, no network.
      - name: Listing Checkup core + adapters (fixtures)
        run: node scripts/listing-checkup-test.cjs
      # Batch A checks: image-header parsing, per-site logo rules, impersonator merge, link health
      # verdicts, chain facts from the DAS row, the how-to table covering every source, the runner.
      - name: Listing Checkup checks (fixtures)
        run: node scripts/listing-checkup-checks-test.cjs
      - name: CUNA staking split + qualification
        run: node scripts/cuna-staking-test.cjs
      # The firstSeenAt ledger the qualification horizon is measured against. Every case is a way
      # to move that timestamp earlier, which is the one number in this system worth attacking:
      # re-scan drift, PDA reuse after a close, a lock dropping out of an RPC index, and escaping
      # the treasury exclusion by reassigning a lock's recipient.
      - name: CUNA lock scanner ledger
        run: node scripts/cuna-lock-scan-test.cjs
      # The arm gate. The owner's instruction is that nobody earns until he announces, so disarmed
      # has to be a wall rather than a default: only boolean true arms it, the start date never
      # moves across a pause, the treasury cannot be dropped from the exclude list, and a day
      # already accrued is refused so a redeploy mid-run cannot pay it twice.
      - name: CUNA programme arm gate + config
        run: node scripts/cuna-programme-test.cjs
      # Project Hub W1 pure gate (docs/DESIGN_PROJECT_HUB_2026-09-10.md §7 + Addendum B): isolation
      # by explicit projectId, decimals from the mint read, immutable program versions with a
      # verifiable hash, eligibility reason codes, the balance partition
      # accrued = available + reserved + paidApplied with overpayment and partial rows, funding as
      # three fields, append-only receipts, and the one-write settlement journal under fault
      # injection. Every case is a way to pay someone twice, or not at all.
      - name: Project Hub — W1 pure gate
        run: node scripts/hub-core-test.cjs
      # The §4 payout attempt state machine (rev 4): every send identified by its own signature
      # before broadcast; reconcile by that signature only; a live row cannot be cancelled; a
      # reservation is released only after blockhash expiry plus two agreeing reconciles; an RPC
      # outage changes nothing. The six fault cases and the earlier concurrency set.
      - name: Project Hub — payout attempts and reconcile fault cases
        run: node scripts/hub-attempts-test.cjs
      # W3 integration gate (docs/COLOSSEUM_ROADMAP.md §W3, closing lib/hub/README.md's "receipt
      # gap"): the settlement journal dual-write in POST /api/hub/:project/payout, both the
      # self-signed &sent= and managed-payer &send= branches (plus &sweep=). The chain's own
      # identity of a transfer (never a guessed instruction index), a fault at the journal write
      # for each branch (the row stays reserved and is never re-offered; a resume settles it), the
      # same signature submitted twice producing one event, a dryRun project refused before any
      # write, a registry project's payout never touching the dedicated CUNA keys, an overpaid
      # transfer recording excess without touching accrued, and a journal-backed receipt that
      # validates against receipt.schema.json.
      - name: Project Hub — W3 settlement journal dual-write (integration gate)
        run: node scripts/hub-settle-route-test.cjs
      # The public receipt page must render BOTH receipt shapes (legacy and Addendum-B3): a
      # journal-backed receipt threw a TypeError in the page's own script until the wrapper fix
      # (adv P1-4 in docs/HUB_JOURNAL_VERIFY_2026-09-18.md). Runs hub.html's real inline script in a vm.
      - name: Project Hub — receipt page renders both shapes
        run: node scripts/hub-receipt-page-test.cjs
      # Addendum C: the six answers a holder gets before locking are DERIVED from the program's
      # entities (15), the differing-reward-asset warning is mandatory and not operator-controlled
      # (16), no string anywhere in the block carries APR / APY / per-year language (17), and every
      # lesson the block links to still exists in src/App.jsx LESSONS (C4).
      - name: Project Hub — teach the button (Addendum C, tests 15–17)
        run: node scripts/hub-teach-test.cjs
      # The Colosseum judges' demo (roadmap W7 acceptance target, E2): every number under /hub/demo
      # is derived by the real Hub libs from fixture inputs (not hand-typed), the batch/receipts are
      # labelled dry runs, and the fixture is invisible to the real registry, the public index and
      # the accrual scheduler — "demo"/"demo-b" can never be approved as real project ids.
      - name: Project Hub — Colosseum demo fixture (derivation + exclusion)
        run: node scripts/hub-demo-fixture-test.cjs
      # Roadmap extension E5 ("the receipt teaches"): a settled receipt's walkthrough sums to its
      # own amount via accruedByWallet (the SAME function the ledger uses), a partial payment is
      # explained as partial, missing inputs never produce a fabricated walkthrough, and no
      # APR/APY/per-year language or the word "owed" reaches the module's output or the rendered
      # hub.html page.
      - name: Project Hub — the receipt teaches (E5)
        run: node scripts/hub-explain-test.cjs
      # EE2 (docs/COLOSSEUM_ROADMAP.md §15): lib/hub/glossary.js is the one source of truth for
      # every term and reason code a public Hub surface renders. Drift (every eligibility.js
      # REASON_CODES code, plus the access/void/hold-through literals, has a glossary entry; every
      # entry's optional lessonId resolves — same C4 discipline as hub-teach-test above) and route
      # (GET /api/hub/glossary + GET /hub/glossary, both ahead of their catch-alls) always run
      # here; this job installs no Chromium, so the same script's rendered-page checks skip
      # gracefully (playwright-core not resolvable) exactly like
      # scripts/reproducibility-history-test.cjs's own render section — the smoke-test job below
      # re-runs this same script, gated on the render diff, where Chromium IS installed, for real
      # rendered-page coverage.
      - name: Project Hub — the glossary (EE2) — drift + route
        run: node scripts/hub-glossary-test.cjs
      # The Solana Room (CLAUDE.md) — a public, no-wallet reference room. This increment ships
      # the room shell (/solana) plus one full page, the rent page (/solana/rent). No-build boot
      # (both routes need their own explicit app.get route — see server.js), room links to rent,
      # the rent page carries the scam-warning block and the "not an airdrop" statement, every
      # t() key on both pages exists in all six curated dictionaries, and no forbidden word
      # (yield/APR/APY, Normie Quest, Wallet Watch, Nomadz, Solana Foundation, ETF) appears.
      - name: The Solana Room — rent page (route, scam warning, i18n coverage, forbidden words)
        run: node scripts/solana-room-test.cjs
      # The Seeker app, increment 1 (docs/SEEKER_APP_PLAN.md) — a third, additive store-edition
      # variant for the Solana dApp Store. Builds it; asserts the bundle is self-contained and
      # hash-routed (a bundled Capacitor app has no server to rewrite a deep path); asserts the
      # existing google/ios variants still build byte-identical to a pristine origin/develop
      # checkout (the `git fetch` below just makes that ref resolvable — a shallow checkout
      # otherwise has no origin/develop to compare against; the script itself degrades gracefully
      # if the fetch is unavailable); drives the shared, MWA-aware wallet registry
      # (public/cluck-wallet.js) with an injected FAKE Capacitor bridge, since no real device
      # exists to test against (same posture as scripts/wallet-standard-test.cjs); and checks the
      # shell's tap targets meet the 44px floor. The rendered-Chromium half of this test (real
      # bounding boxes, a real tap-through) skips gracefully here, same posture as
      # hub-glossary-test.cjs above — this job installs no browser — without failing the step;
      # everything else above still runs and gates on every push/PR.
      - name: Seeker app — build variant, self-contained + hash-routed bundle, MWA wallet layer, tap targets
        run: |
          git fetch origin develop --depth=1 --quiet || true
          node scripts/seeker-build-test.cjs
      # Rent Reclaim, READ SIDE (increment 2, docs/SEEKER_APP_PLAN.md) — GET /api/seeker/
      # reclaimable (lib/rent-reclaim.js) and its pane (src/seeker/RentReclaim.jsx). Both token
      # programs are enumerated; an account holding a balance is never classed reclaimable;
      # wrapped SOL is refused outright; the reported total matches an independent re-derivation
      # of the fixture; an RPC failure (network error, non-OK status, or a JSON-RPC-level error)
      # surfaces as a failure, never an empty/zero result; more accounts than the cap are flagged
      # `truncated`, never silently cut; the 16 new i18n keys land in all six dictionaries and are
      # excluded from the google/ios bundle; the new controls meet the 44px tap-target floor.
      # Dependency-free — stubs global.fetch, no live RPC call in CI.
      - name: Seeker app — Rent Reclaim read side (both token programs, honest classification, unavailable-not-zero, i18n)
        run: node scripts/seeker-reclaim-test.cjs
      # Addendum B5 / roadmap E3: the on-chain memo format is byte-diffed against a hand-built
      # Uint8Array before it ships; verifyCommitTx never trusts the client (wrong payer, wrong or
      # missing memo, more than one memo, a failed or unconfirmed tx are all refused); a version's
      # own hash is unaffected by attaching a commitment (bookkeeping, like effectiveTo); a
      # commitment is written ONCE and a later, different-looking observation never overwrites it;
      # the public projection carries only sig/slot/observedAt, never the memo text; the demo
      # fixture never carries one, so it shows "not yet committed" honestly rather than by default.
      - name: Project Hub — independent on-chain commitment (Addendum B5 / E3)
        run: node scripts/hub-commit-test.cjs
      # Analytics: a visitor counts as ENGAGED only after a second page or a funnel event, and
      # views are keyed by the real Host header. Since 2026-08-16 the site records ~4,500
      # one-page, no-referrer "visitors" a day that BOT_RE cannot see; this is what stops that
      # number being quoted as people.
      - name: Analytics — engaged visitors and host split
        run: node scripts/analytics-engaged-test.cjs
      # Colosseum W9 part 1: traction is measured, not asserted. Every counter in lib/traction.js
      # is DERIVED from a durable store (or a minimal, salted, PII-free event this change adds at
      # a choke point that recorded nothing before) — journal receipts vs. the live `batch.sent`
      # mechanism vs. CUNA's pre-Hub payout stay separate, revenue is lamports/count only (never a
      # USD figure that was not stored), and an unreproducible source (Hatchery fees) says so
      # instead of guessing.
      - name: Traction — outcome counters are derived and reproducible
        run: node scripts/traction-test.cjs
      # Colosseum roadmap §10 Z1: the Sunday W10 update is a `git log` run, not a rewrite.
      # Exercises grouping (Hub/School/Security/Operations by keyword), production-vs-staging
      # labelling (a real, non-squash "Promote develop -> main" merge the way this repo's own
      # promotions work) and PR-number extraction against a disposable fixture repo — never this
      # repo's own history, so the test can't drift when new PRs land.
      - name: Weekly update draft — shipped-PR grouping, production/staging, PR extraction
        run: node scripts/weekly-update-draft-test.cjs
      # The staking domain's origin-lockdown exemption, read out of server.js itself. That
      # exemption is the one place a request can skip the WAF, so the allowlist must stay
      # exhaustive and anchored at both ends — a single "^/api/" entry would be a hole through to
      # every money endpoint for anyone who points a DNS record at our origin. Also pins that
      # /api/cuna-stake/admin (which ARMS the emission) is unreachable that way, and that the
      # handler's own req.cluckDirect guard runs before the key comparison.
      - name: CUNA staking domain lockdown allowlist
        run: node scripts/cuna-stake-routing-test.cjs
      # The CUNA drawing's entry registry on the lock host: address must decode to exactly 32 bytes,
      # window enforced server-side, idempotent by address, CORS preflight answers 204 for
      # cunatoken.com, export is token-only and NOT on the lock host's lockdown allowlist.
      - name: CUNA draw — entry registry (validation, window, CORS, export, lockdown)
        run: node scripts/cuna-draw-test.cjs
      - name: Store edition — bundle compiled clean (no wallet, no pass, absolute API) + CORS, UA defense, certificate, report
        run: node scripts/store-edition-test.cjs google
      - name: Buy-comp entries (every $N buy = horses)
        run: node scripts/buycomp-entries-test.cjs
      # The paid tools pass: consuming the payment signature is the ONLY durable write, and the
      # pass is derived from the chain (payer + block time), so a lost response, a closed tab, a
      # crash between writes or a kv persist failure can never strand a payer who paid 0.05 SOL.
      # Pins: same payer recovers with the SAME expiry; a different wallet consumes nothing; a
      # store that cannot record durably answers 503 and consumes nothing; the audit write
      # throwing changes nothing.
      - name: Tools pass — paid redemption + recovery (fault injection)
        run: node scripts/tool-pass-redeem-test.cjs
      - name: Buy comp — pool sale vs transfer vs LOCK (hold check; a lock is not a sell)
        run: node scripts/buycomp-sell-detect-test.cjs
      # The project buy bots' detection, on two real mainnet transactions: a Jupiter buy split
      # across the Orca and Meteora CUNA/SOL pools must post the WHOLE amount paid (one leg
      # under-reported by 15% on 2026-09-11), and an arb between those pools must post nothing.
      # Meteora DAMM v2 vaults belong to a program-wide authority, not the pool address.
      - name: Buy bot — split routes summed, pool authorities, arbs silent
        run: node scripts/buybot-detect-test.cjs
      # The decisions in front of an irreversible action. Burning cannot be undone and cannot be
      # partially retried, so every case here is a way the burner could fire when it should not or
      # for the wrong amount: a truthy (not true) armed flag, a missing signing key, a short
      # balance (which must burn NOTHING, never a partial), a day already burned, the configured
      # hour, and the hard cap that config alone cannot reach — 690000 and 690000000 are three
      # keystrokes apart and one of them is a tenth of the supply.
      - name: CUNA daily burn guards
        run: node scripts/cuna-burn-test.cjs
      # The bookkeeping between "what is owed" and "what was sent" — where a payout system pays
      # somebody twice. A batch exported for sending is HELD ASIDE from the moment it exists, so
      # exporting again cannot offer the same money; confirming credits only what the batch
      # contained, so accrual during a batch's flight is still owed afterwards; and raw amounts
      # become whole tokens by string surgery, never division, because that number is what
      # somebody actually receives.
      - name: CUNA payout double-pay guards
        run: node scripts/cuna-payout-test.cjs
      # The server-signed buy-comp payout pays ONLY the sealed list, journals each transfer at
      # submit time, sweeps dropped sigs only past expiry, and locks the run across processes.
      - name: Buy-comp server payout guards
        run: node scripts/buycomp-payout-test.cjs
      # kv.set swallows a failed persist and kv.get answers from memory, so a save-then-read-back
      # "proves" a payout row that lives only in RAM. Money paths use setVerified (re-reads the file).
      - name: kv store disk-verified writes
        run: node scripts/kvstore-verified-test.cjs
      - name: payout row verification (a sent row needs a real transfer, after the batch, unused elsewhere)
        run: node scripts/payout-verify-test.cjs
      # Colosseum roadmap §W4/Extension: the airdropper's per-drop public receipt. Reuses
      # lib/payout-verify's on-chain-delta check (same as CUNA/Hub payouts) so a row is recorded
      # paid only when the chain actually shows the transfer — never on a bare confirmed signature.
      - name: airdrop per-drop receipt (verify-before-record, idempotent on sig, daily/row caps)
        run: node scripts/airdrop-receipt-test.cjs
      # Shared "fresh sigs since the durable cursor" walk used by the ROSE/generic buy bots and
      # the burn watcher (lib/sig-cursor.js) — pure, so this runs standalone with no server boot.
      - name: signature cursor walk (buy/burn watchers' shared fresh-since-cursor logic)
        run: node scripts/sig-cursor-test.cjs
      # Room policy (owner, 2026-09-17): the Cluck bot never posts in the OnlyRose room. Pure checks
      # on lib/telegram-rooms plus source assertions that every Telegram sender consults it and that
      # no direct send exists outside the audited functions.
      - name: Telegram room policy (nothing lands in the OnlyRose room)
        run: node scripts/telegram-rooms-test.cjs
      # BB4 (Colosseum roadmap §12): the /receipt <signature> command — found across every
      # registered project via the same public findReceipt(), reproduced the same way the
      # reproducibility/bundle routes are, replied through the audited tgSend choke point (the
      # OnlyRose refusal fires there, unmodified). Exercises lib/hub/receipt-command.js directly
      # against a real seeded batch — no server boot.
      - name: Telegram /receipt command (BB4 — verdict reply, OnlyRose refusal, rate limit)
        run: node scripts/telegram-receipt-command-test.cjs
      # The public Hub views whitelist their fields — a comp's payout token or chat id must never
      # reach /api/hub — and hash the terms a program ran under.
      - name: Hub public views (no private fields, stable terms hash, honest totals)
        run: node scripts/hub-public-test.cjs
      # Colosseum roadmap §8 X7: holder snapshot history is append-only (a second run adds, never
      # edits), the 90-per-mint cap drops the oldest first, the hash recomputes from a holder list
      # and changes on a one-unit change, the dated series carries no wallets, and the Hub
      # project view's holders fact line appears only when a snapshot exists.
      - name: Holder snapshot history (append-only, hashed, read-only)
        run: node scripts/holders-snapshot-test.cjs
      # Colosseum roadmap §13 CC4: the daily reproducibility history behind the badge/ratio — same
      # append-only, hashed pattern as the holder snapshots above (one record per project per UTC
      # day, refused on a second write, a hash chain that recomputes end to end, a tampered record
      # breaks it, the 90-day cap drops the oldest first, a skipped day is a gap, never
      # interpolated). Also boots a real server (the tick's own env-only fast-interval overrides)
      # to prove the tick writes today's record exactly once and /hub/status renders the
      # sparkline with its aria-label.
      - name: Reproducibility history (append-only daily record, hash chain, sparkline)
        run: REPRO_HISTORY_TEST_PORT=3317 node scripts/reproducibility-history-test.cjs
      # Colosseum roadmap §11 AA3: the snapshot diff — entered/exited/held over the RECORDED
      # top-25 only (never a full holder-base diff, per lib/holders-snapshot.js's own header). A
      # self-diff is empty, the BigInt sums reconcile, and the route (400/404/200) matches its
      # snapshot-route siblings.
      - name: Holder snapshot diff (entered/exited/held over the recorded top-25 + route)
        run: SNAPDIFF_TEST_PORT=3247 node scripts/holders-snapshot-diff-test.cjs
      # E1 (docs/COLOSSEUM_ROADMAP.md §1 "the number"): a receipt's amount re-derived from the
      # batch's own published inputs (periods, prior paid, prior reserved), reconstructed purely
      # from durable timestamps — MATCH, a tampered MISMATCH, and an honest MISSING_INPUTS naming
      # what is missing; the reproducibility ratio; the CLI script's --offline mode with no server.
      - name: Hub receipt reproduction (the number — MATCH/MISMATCH/MISSING_INPUTS, --offline)
        run: node scripts/reproduce-receipt-test.cjs
      # DD1 (docs/COLOSSEUM_ROADMAP.md §14): packages/hub-verify (the `npx @clkn/hub-verify`
      # standalone CLI) is a BUILD OUTPUT of scripts/build-hub-verify-package.cjs, never a second
      # hand-typed copy of the repo's verifier. This asserts a fresh rebuild is byte-identical to
      # the committed package, that the repo lib / packaged lib / browser bundle agree on every
      # fixture scripts/hub-verify-page-test.cjs uses, that the packaged CLI's output matches
      # scripts/reproduce-receipt.cjs's against a real ephemeral fixture server, that `npm pack
      # --dry-run` stays under 200 KB with only allowlisted files, and that the package's lib/
      # requires resolve from a directory outside this repo entirely. Needs the small hub-verify
      # bundle (not the full React build), which this step builds itself when missing — same
      # pattern the Y1/AA2 smoke-test steps below use.
      - name: Hub verify standalone package — build determinism, fixture parity, npm pack, no repo-relative requires (DD1)
        env:
          HUB_VERIFY_PKG_TEST_PORT: "3339"
        run: |
          test -f public/hub-verify.bundle.js || npm run build:hubverify
          node scripts/hub-verify-package-test.cjs
      # BB3 (Colosseum roadmap §12): the shields.io-shaped reproducibility badge
      # (/api/hub/badge.json + /hub/badge.svg) sums the SAME projectReproducibility every
      # non-demo project — a fresh install says "no receipts yet"/lightgrey rather than "0 of 0",
      # a seeded batch reports the exact singular/plural ratio text, a dry-run/zero-receipt
      # project never inflates the "K projects" count, demo 404s, and the SVG is well-formed XML
      # with no <script. Boots a real server but drives no browser, so it runs here.
      - name: Hub reproducibility badge (computed endpoint-badge JSON + SVG)
        run: HUB_BADGE_TEST_PORT=3276 node scripts/hub-badge-test.cjs
      # Colosseum roadmap §14 (DD2) — "Follow a project without a wallet": GET
      # /api/hub/:project/feed.json (JSON Feed 1.1) and GET /hub/:project/feed.xml (RSS 2.0),
      # composed only from the same public views/computations the routes above already share.
      # Validates both formats, checks the two list the same stable ids, that two fetches of
      # each are byte-identical, that a demo/unknown project 404s, and that neither body ever
      # carries a private field or a forbidden word.
      - name: Hub project feed — JSON Feed + RSS (Colosseum §14 DD2)
        run: HUB_FEED_TEST_PORT=3367 node scripts/hub-feed-test.cjs
      # AA1 follow-up (Colosseum roadmap §14 DD2 + §11 AA1) — "follow a wallet without a project":
      # the per-wallet twin of the feed test above. GET /api/hub/wallet/:wallet/feed.json (JSON
      # Feed 1.1) and GET /hub/wallet/:wallet/feed.xml (RSS 2.0), scoped to every project a wallet
      # actually appears in (never the full registry). Checks program-version/commitment items are
      # project-wide while batch items are scoped to the batches that actually paid that wallet,
      # that two projects sharing a batch id or version number never collide (project-prefixed
      # item ids), that a hostile project label round-trips exactly through a real (non-regex)
      # hand-rolled XML tree parser's entity decoding, that an unseen wallet gets a valid empty
      # feed rather than a 404, and that a malformed/oversized address is refused 400 before any
      # project is ever walked.
      - name: Hub wallet feed — JSON Feed + RSS across every project a wallet appears in (AA1 follow-up)
        run: HUB_WALLET_FEED_TEST_PORT=3368 node scripts/hub-wallet-feed-test.cjs
      # Colosseum roadmap §7 (the W4 deferred item): the public Buy Special standings page.
      # Unsealed publishes rules only (no results/review/payouts key at all); sealed publishes the
      # full view plus a stable resultsHash; hold-through is held/sold/moved-out/locked-not-a-sell
      # (PR #298 — a lock is not a sell) with its on-chain evidence signature; the split is the one
      # function buyCompVerify, the walkthrough and reproduce-a-receipt all share.
      - name: Hub public Buy Special standings + hold-through proof (Colosseum §7)
        run: node scripts/hub-buycomp-public-test.cjs
      # The per-project Lock to Earn engine: config from the version in force, the two new rules,
      # one hour of accrual, the tick over the project's own keys, the holder view.
      - name: Hub engine (Lock to Earn for any project)
        run: node scripts/hub-engine-test.cjs
      # Project branding (logo/accent/tagline/socials — validated, never a remote URL) and the
      # dryRun placeholder (Colosseum E10, POKEAHOE): cannot be armed, excluded from traction.
      - name: Hub branding + dry-run projects (POKEAHOE)
        run: node scripts/hub-brand-test.cjs
      # GG3 fix 1 (docs/COLOSSEUM_ROADMAP.md §17, docs/POKEAHOE_REHEARSAL_2026-09.md §4):
      # POST /api/hub-registry accepts accessTier as an alias for tier (its own field name), and
      # refuses any other unrecognized field with 400 instead of silently doing nothing.
      - name: Hub registry — accessTier alias + unknown-field refusal
        run: node scripts/hub-registry-test.cjs
      # Platform access tiers: standard / small / comped, price resolved at the payment instant,
      # the CLKN alternative priced at that block, comped needs a reason, unpaid cannot arm.
      - name: Hub access tiers (0.5 / 0.25 SOL a month, comped)
        run: node scripts/hub-access-test.cjs
      # Self-serve onboarding: an application grants nothing, is validated like approval, and
      # becomes a registry project with v1 only on the owner's approve.
      - name: Hub applications (self-serve onboarding)
        run: node scripts/hub-apply-test.cjs
      # Project desk operator sessions: single-use challenge, HMAC token bound to project + wallet,
      # revoked the moment the wallet leaves the operator list.
      - name: Hub operator sessions (project desk)
        run: node scripts/hub-operator-test.cjs
      # Launch Readiness (design Addendum A): the checklist (ok/warn/block, every item derived —
      # tests 11, 13), the reward-budget planner (same accrual function as the live engine, by
      # construction — test 12), the arm-time refusal on a known shortfall or a dry run, the
      # public body carrying no readiness data, and the desk section's rate/badge-language guard.
      - name: Hub launch readiness (checklist + reward-budget planner)
        run: node scripts/hub-readiness-test.cjs
      # Colosseum roadmap EE1: "who would this pay today?" for DRAFT terms — a read (nothing
      # written, armed or sent). Proves the preview reproduces planBudget's own next-day
      # obligation byte for byte, a wider draft flips exclusions and the hash, an invalid draft
      # throws the same error a real publish would, app-state.json is untouched by ten previews,
      # and the lapsed-project / auth / GET-405 gates match the terms write exactly.
      - name: Hub preview before publish (draft terms, no writes)
        run: node scripts/hub-preview-test.cjs
      - name: CUNA lock announcements (public post — sanitised, qualifying only, capped)
        run: node scripts/cuna-announce-test.cjs
      # esc() escapes HTML but not the URL SCHEME, and jupverify-admin.html rendered a PUBLIC
      # submitter's Website/Icon/Telegram fields as live anchors while holding the admin key in
      # sessionStorage. autopsy.html had a private safeUrl and nothing else got it.
      - name: href scheme guard (safeUrl) + admin-panel escaping
        run: node scripts/safe-url-test.cjs
      # tgSend swallows its own errors and returns null, so three schedulers advanced durable
      # state after sends that never landed — including one that permanently dropped new
      # graduates. And /api/hatchery/minted announced "NEW TOKEN HATCHED" on proof that SOME
      # unrelated transaction had succeeded.
      - name: brand-channel broadcast integrity
        run: node scripts/broadcast-integrity-test.cjs
      # Replays thousands of ticks against the REAL engine gate logic (lib/engine-decisions.js,
      # zero deps). Every scenario is a live incident from 2026-08-27/28 — the decay loop, the
      # buyback stall, sleeve starvation — plus a fuzz pinning the caps/floors/pacing invariants.
      - name: liquidity-engine decision simulator
        run: node scripts/engine-sim-test.cjs
      # Deep dive 2026-09-17 P0-001 / P2-071: boots the real server three times with no secrets —
      # an empty store plus every *_ENGINE_ON=1 arms nothing (env is inert), *_ENGINE_OFF=1 beats a
      # kv arm key, POKE never registers without its flag, and each ratchet merges its durable
      # ratchetOverrides:<project> table over the code defaults (the merge that silently dropped
      # writes for two projects until a manual audit found it).
      - name: Engine arm gates + ratchet durable overrides
        run: node scripts/engine-arm-gate-test.cjs
      # The pure merge/diff (want+overrides → diff → optional floor) shared by the four
      # liquidity-engine boot ratchets above — lib/engine-ratchet.js, unit-tested in isolation.
      - name: Config-ratchet pure merge/diff (want/overrides/floor)
        run: node scripts/engine-ratchet-test.cjs
      # The check that gates whether a giveaway winner gets PAID. It false-positived on every
      # winner on 2026-09-04 because it judged a hold in dollars and the price cache was cold.
      - name: giveaway hold-check (token-based, survives a cold price feed)
        run: node scripts/giveaway-holdcheck-test.cjs
      # /api/token-metadata/* is FREE and unauthenticated, and rebuild-json fetches a URL the
      # caller supplies. That makes the private-network guard load-bearing rather than tidy: a
      # regression here turns a public tool into a probe of our internal network. Built-ins only,
      # no outbound network, so it runs in this dependency-free job.
      - name: SSRF guard for caller-supplied URLs
        run: node scripts/safe-fetch-test.cjs
      # The trade tape can miss trades three ways; only one of them used to be reported, so a
      # rate-limited scan returned a SHORT tape that looked complete. The giveaway scanner is
      # incremental and never looks back, so a silently-retired slice loses those trades forever
      # — and a missed SELL leaves a wallet holding entries that decide who wins a prize.
      - name: trade-tape coverage honesty
        run: node scripts/tape-coverage-test.cjs
      # Railway runs more than one process against one volume. Both school stores read their file
      # once at boot and rewrote it wholesale, so a stale instance DELETED the other's work —
      # lesson marks the graduation gate depends on, and issued transcripts. Spawns real child
      # processes; it is the only honest way to test this.
      - name: school stores survive a second process
        run: node scripts/store-multiprocess-test.cjs
      # Graduation ledger (Codex on #333): a live re-pass of a lesson counts toward the timing
      # spread, so a learner whose marks were replayed together can recover by doing lessons a few
      # minutes apart; the first sighting is never rewritten and a backfill replay never counts.
      - name: school-progress re-pass rule
        run: node scripts/school-progress-test.cjs
      - name: Normie Quest level-geometry guard (jumpability + no floating fixtures)
        run: node normie-quest/test/nq-geometry-check.cjs
      # WORLD_ART integrity (deep dive 9.5): a level's bgArt is loaded LAZILY by key, so a typo in
      # either direction — a level naming a key WORLD_ART doesn't have, or a WORLD_ART entry
      # pointing at a plate file that was renamed/deleted — ships green and only shows up as a
      # blank backdrop in front of a real player. Pure data, no browser.
      - name: Normie Quest world-art integrity (bgArt keys <-> worlds/ files)
        run: node normie-quest/test/nq-world-art-check.cjs
      # The leaderboard's anti-forgery floor (points-budget + checkpoint tokens) is load-bearing —
      # a regression silently re-opens score forgery. This job installs nothing, so the four
      # telemetry cases that mount the real express router SKIP here; the smoke-test job re-runs
      # the file after npm ci with NQ_LB_REQUIRE_ROUTER=1, which turns that skip into a failure.
      - name: Normie Quest leaderboard anti-forgery test (dependency-free cases)
        run: node normie-quest/test/nq-leaderboard-test.cjs
      # Nothing tied a leaderboard run to the wallet's ACCESS TIER, so a zero-holdings throwaway
      # wallet could script its way to a world-21 run that reads as verified and NOT suspect —
      # invisible to the suspect-run list reviewed before the weekly physical prize goes out.
      - name: Normie Quest tier gate (a run cannot claim a world the wallet never had)
        run: node normie-quest/test/nq-tier-gate-test.cjs
      # Prize claims need real ed25519 signatures (tweetnacl et al) — the whole file skips here
      # and runs strict in smoke-test. Kept in this job anyway so a syntax error still fails fast.
      - name: Normie Quest prize-claim test (skips without deps)
        run: node normie-quest/test/nq-claims-test.cjs
      # The per-level point budgets AND the level adjacency graph (checkpoint anti-forgery,
      # audit #6) are DERIVED from the level data; if game_logic.js changes levels but the
      # committed JSON isn't regenerated, the ceiling/graph drifts — a stale graph falsely
      # flags real players' checkpoints. Regenerate both and fail if either committed file is stale.
      - name: Normie Quest budget-table + level-graph freshness guard
        run: |
          node normie-quest/tools/gen-budgets.cjs
          node normie-quest/tools/gen-level-graph.cjs
          git diff --exit-code normie-quest/nq-budgets.json normie-quest/nq-level-graph.json \
            || (echo "::error::nq-budgets.json / nq-level-graph.json is stale — run node normie-quest/tools/gen-budgets.cjs && node normie-quest/tools/gen-level-graph.cjs and commit" && exit 1)
      # The served game HTML is BUILT from src/game_logic.js by build.js. A fix made to the built
      # HTML but not the source (or vice-versa) silently reverts on the next build — the exact
      # drift that shipped the mobile joystick fix only to the served file. Rebuild and fail if the
      # committed HTML isn't a fresh build of source.
      - name: Normie Quest build-freshness guard (served HTML == build(source))
        run: |
          node normie-quest/src/build.js
          git diff --exit-code normie-quest/public/normie-quest-platformer.html \
            || (echo "::error::served HTML is stale — run node normie-quest/src/build.js and commit" && exit 1)
      # EE5 (docs/COLOSSEUM_ROADMAP.md §15): the "onboarding clock, from the record" table
      # docs/VALIDATION_2026-09.md quotes is a SCRIPT's output, not typed numbers — this seeds a
      # temp DATA_DIR with a two-project fixture built through lib/hub/project.js (one project with
      # every milestone reached, one registered-only), runs scripts/validation-rows.cjs as a real
      # subprocess against it, and asserts every delta and the "—" dash for whatever was never
      # reached, plus the honest empty-template output for a DATA_DIR with no registry at all.
      - name: Validation rows — onboarding-clock table is derived, never guessed (EE5)
        run: node scripts/validation-rows-test.cjs
      # FF2 (docs/DEMO_STORYBOARD.md Part 4): a dependency-free drift guard — the "Capture
      # inventory" table's filenames (expanding every {mobile,desktop} pattern) and its own stated
      # total file count must equal the real listing of docs/demo/2026-09-18/, in both directions
      # (a file the doc names but the folder lacks, or a file in the folder the doc never
      # mentions, both fail), and every real file must be at or under the 300 KB budget.
      - name: Demo storyboard inventory — the doc's capture table matches the real folder (FF2)
        run: node scripts/demo-storyboard-inventory-test.cjs

  # Renders the actual app. The checks above are all static — they cannot see a component that
  # compiles fine and throws on mount, which is how the LP Lab shipped blank to production.
  # Split into its own job so a browser download never slows the fast static gate.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Rendering 40 school screens for a liquidity-engine or Telegram change is pure waiting.
      # The RENDER only matters when the diff can reach what renders: the React app, static
      # pages, deps, the harness itself — or a server.js hunk that actually touches page
      # serving. A server.js change that cannot reach a page still gets its boot proven by
      # the "server boots" step below, which is the failure this job really guards against.
      - name: decide whether the render applies
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # A dispatch run validates a pending PR branch (the push-before-PR-open quirk means
            # the pull_request run often never fires), so gate it exactly like that PR would be:
            # diff against the merge-base with main. Owner ask 2026-08-28: stop running the
            # Normie Quest render gates for changes that cannot touch Normie Quest.
            git fetch origin main --quiet 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
            if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: dispatch with no resolvable base — full run"; exit 0; fi
          elif [ "$EVENT" = "push" ]; then
            # A push to main/develop used to be an unconditional full run (a "production
            # tripwire"). Owner, 2026-09-13: that re-ran the render suite on every squash-merge
            # of a change CI had already cleared on its PR — fifteen times in two days for
            # store-edition, CUNA and Telegram work that cannot reach a page. The push range
            # (before..after) IS the merged PR's content, so gate it the same way. A range that
            # cannot be resolved (new branch, force-push) still runs in full.
            BASE="${{ github.event.before }}"
            case "$BASE" in 0000000000000000000000000000000000000000) BASE="";; esac
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: push with no resolvable range — full run"; exit 0
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: unknown event — full run"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/|public/|hub-verify-src/|index\.html$|package(-lock)?\.json$|vite\.(hubverify\.)?config|scripts/smoke-test\.js$|scripts/(cuna-share|wallet-standard|hub-a11y|hub-verify-page|hub-og|hub-status|hub-wallet|hub-bundle|hub-compare|hub-print)-test\.cjs$|normie-quest/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: render-relevant change — full run"
          elif echo "$CHANGED" | grep -qE '^server\.js$' && git diff "$BASE"...HEAD -- server.js | grep -qiE 'sendFile|res\.render|index\.html|dist/|catch-all'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: server.js diff touches page serving — full run"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "gate: no render-relevant paths — boot check only"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Always, even when the render is skipped: a backend change that stops the server
      # BOOTING takes the whole site down, and node --check cannot see that.
      # A boot failure must FAIL this step, not stall it. The first version was
      #   node -e "require('./server.js'); setTimeout(..., 12000)"
      # and it hung for 50 minutes on a real boot throw: require() threw before the
      # timer was ever scheduled, and server.js's own process.on("uncaughtException")
      # handler swallowed it, so nothing exited and nothing failed. Three things now:
      # catch the synchronous throw explicitly, prove the server is actually SERVING
      # (an async failure like EADDRINUSE gets swallowed by that same handler, so
      # "still running after 12s" is not proof of anything), and cap the whole thing
      # with timeout so no future variant can stall the job again.
      - name: server boots
        env:
          PREMIUM_ACCESS_KEY: ci-boot-check
        run: |
          timeout 90 node -e "
            try { require('./server.js'); }
            catch (e) { console.error('BOOT FAILED (require threw):', (e && e.stack) || e); process.exit(1); }
            setTimeout(async () => {
              const url = 'http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz';
              try {
                const r = await fetch(url);
                if (!r.ok) throw new Error('healthz returned ' + r.status);
                console.log('server booted and serving');
                process.exit(0);
              } catch (e) { console.error('BOOT FAILED (not serving):', e.message); process.exit(1); }
            }, 12000);
          "

      # The swap desk's safety property — verifyAndSign() signs only what it built — is the tamper
      # suite in scripts/test-swap-desk.js (48 local cases), and the airdrop engine's hand-built
      # instruction bytes (CLAUDE.md: diff them against the library before shipping) are checked by
      # scripts/verify-burn-close.cjs. Both are zero-network and deterministic; neither was in CI
      # until 2026-09-02, so a regression in either shipped green. The RPC is pinned to a closed
      # local port so the honest-path send can never reach a real node.
      - name: swap-desk tamper rejection + airdrop-engine byte diff
        env:
          FALLBACK_RPC_URL: "http://127.0.0.1:9"
          HELIUS_API_KEY: ""
          DATA_DIR: ${{ runner.temp }}/swapdesk
        run: |
          node scripts/test-swap-desk.js
          node scripts/verify-burn-close.cjs

      # Playwright is installed here rather than in package.json on purpose: Railway installs
      # devDependencies to run the Vite build, and playwright's postinstall drags browser
      # binaries into the production image. PINNED: the visual gate below diffs against committed
      # baselines, so an unpinned install would let a Chromium bump move the baseline with no repo
      # change. Bump the version deliberately, together with a `--update` baseline refresh.
      # Not gated: the tools-pass client and LP Lab tests below run on every push (P1-021) and
      # need the browser (Codex 2026-09-17, finding 8 — they had been un-gated without it).
      - name: install playwright + chromium
        run: |
          npm i --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      # The make-metadata-immutable instruction is hand-built (the Metaplex SDK is ESM-only and
      # fights this CommonJS server) and its effect is IRREVERSIBLE — one wrong Option byte
      # permanently erases a token's verified creator. This byte-diffs it against the real
      # library's own serializer. Lives here, not node-check: it needs @solana/web3.js and the
      # Metaplex package, and node-check installs nothing.
      - name: token-metadata lock instruction (byte-diff vs Metaplex)
        env:
          METAPLEX_REQUIRE_BYTEDIFF: "1"
        run: node scripts/token-metadata-lock-test.cjs
      # Revoking mint/freeze authority is the most destructive thing the tool can do — supply
      # capped forever, no undo. Byte-diffed against @solana/spl-token's own serializer for the
      # same reason as the metadata instruction, and here rather than in node-check because that
      # job installs no dependencies.
      - name: token-authority revocation (byte-diff vs SPL Token)
        run: node scripts/token-authority-test.cjs
      # The creator-trace cache is fed by the PUBLIC autopsy endpoint and used to grow without
      # limit — a slow OOM anyone could drive from outside a memory-capped container. It lives in
      # this job rather than node-check because lib/autopsy.js has dependencies, and node-check
      # installs none.
      - name: autopsy caches stay bounded
        run: node scripts/cache-bound-test.cjs
      # The AI tutor's free daily allowance was enforced ONLY in localStorage, so the real ceiling
      # was ~21,600 billed Anthropic calls per IP per day. This boots the real server, because the
      # cap has to fire in FRONT of the handler — a 429 after the paid call saves nothing.
      - name: AI tutor daily cap is enforced server-side
        run: node scripts/ai-daily-cap-test.cjs
      # Audit 2026-09-05 #5-#9: admin routes that arm, run, post or delete answer 405 on a GET (a
      # pasted link that a chat client unfurls must never move funds), armed vault calls must name
      # their project and every vault response echoes it, the Meteora pool lever is allowlisted, and
      # the two Telegram test routes 404 like every other admin route. Boots the real server with a
      # throwaway key and no secrets.
      - name: admin mutation discipline (405 on GET, explicit project, pool allowlist)
        run: node scripts/mutating-get-guard-test.cjs
      # Colosseum roadmap §10 Z3: the Hub's newer public read routes (reproducibility,
      # batch/inputs, buy-comp standings, a receipt, the holders-snapshot series and one
      # snapshot, the airdrop receipt routes, the JVP timeline, the JSON Schemas and the built
      # hub-verify bundle) carry an ETag and a Cache-Control tier consistent with the rest of the
      # Hub's public reads, the five that do real per-request work get a dedicated per-IP rate
      # limit that never touches the light per-page reads or a store-edition contract route, and
      # wallet/sig/mint query/path params are shape-checked before any store read. Always runs
      # (not diff-gated), like the schema test below — a route or a limiter here is exactly the
      # kind of change that would not otherwise touch a page or the game. Needs the small
      # hub-verify bundle (not the full React build) to check its own cache header/ETag.
      - name: Public-route hygiene — ETags, cache headers, rate limits, param caps (Z3)
        run: |
          test -f public/hub-verify.bundle.js || npm run build:hubverify
          HYGIENE_TEST_PORT=3225 node scripts/public-route-hygiene-test.cjs
      # Colosseum roadmap E4: the settlement library's public contract. Every schema in
      # lib/hub/schema/ validates a real fixture built the same way lib/hub/project.js,
      # lib/hub/ledger.js and lib/hub/public.js build one (including the exact wire subset
      # routes.js puts on the wire for a program version), GET /hub/schema/:name.json serves
      # each file byte-identical to disk with a cache header and 404s an unknown name, and
      # GET /api/hub/clkn's live body validates end to end. Boots the real server, so it lives
      # here rather than in node-check.
      - name: Hub settlement-library JSON Schemas (lib/hub/schema, E4)
        run: node scripts/hub-schema-test.cjs
      # X2 (docs/HUB_VERIFY.md): a static check, no server boot — asserts every script, lib file,
      # relative link and $HOST route the doc tells a judge to paste actually exists in this repo,
      # so the doc cannot silently drift from the code it describes. Always runs (like the schema
      # test above), never diff-gated: a route rename anywhere is exactly the kind of change that
      # would not otherwise touch a page or the game.
      - name: HUB_VERIFY.md matches the code it tells judges to run (X2)
        run: node scripts/hub-verify-doc-test.cjs
      # AA5 (docs/COLOSSEUM_ROADMAP.md §11): the trust-boundary page (/hub/trust) cannot silently
      # drift from HUB_VERIFY.md §(g) — every "not verifiable yet" bullet there carries a
      # `<!-- boundary: ... -->` marker matched to a `data-boundary` element on the page (both
      # directions, and the bullet count itself), the page never uses a forbidden word (verified /
      # safe / guaranteed / APR / APY / yield), and every relative link on it resolves to a
      # registered server.js route. Static, no server boot — always runs, like X2 above.
      - name: hub-trust.html matches HUB_VERIFY.md §(g), no forbidden words (AA5)
        run: node scripts/hub-trust-doc-test.cjs
      # AA4 (docs/COLOSSEUM_ROADMAP.md §11): public/hub-judge.html (the judge's fifteen minutes)
      # cannot silently drift from docs/JUDGE_GUIDE.md — regenerating the doc via
      # scripts/build-judge-page.cjs must produce the exact committed page, the doc never uses a
      # forbidden word or mentions Normie Quest/Wallet Watch, and every scripts/*.cjs, docs/*.md
      # and relative URL it names exists / matches a registered route. Static, no server boot —
      # always runs, like X2 and AA5 above.
      - name: hub-judge.html matches docs/JUDGE_GUIDE.md, no drift, no forbidden words (AA4)
        run: node scripts/hub-judge-doc-test.cjs
      - name: Tools pass server-side gate + raw console guard (2026-09-10)
        run: node scripts/tool-pass-gate-test.cjs
      - name: JVP dashboard data layer (sanitisation, decisions, slimming)
        run: node scripts/jvp-dashboard-test.cjs
      # Listing Checkup routes: validation, the offline run → cache → share page with every
      # attacker-controlled string escaped, the unknown-mint page. LISTING_CHECKUP_OFFLINE=1 keeps
      # CI off the aggregators' APIs.
      - name: Listing Checkup routes (offline)
        run: node scripts/listing-checkup-routes-test.cjs
      # CSP scoping: 'unsafe-eval' (Phaser needs it; nothing else does) must stay confined to the
      # Normie Quest game shell and never leak onto the site-wide default policy.
      - name: CSP scoping (unsafe-eval confined to the Normie Quest shell)
        run: node scripts/csp-scope-test.cjs
      # Launch checklist 18: the airdrop signup honeypot swallows bot posts without storing them.
      - name: Airdrop signup honeypot (offline)
        run: node scripts/airdrop-collect-honeypot-test.cjs
      # The lock-and-earn page's post-lock "announce on X" card only appears after a real
      # signature, which no test can produce; this drives it through its test hook and checks the
      # post is built from config numbers, stays under 280, hides dollars when the price is
      # unknown, and opens X's own compose window (we post nothing).
      - name: lock-and-earn announce card
        if: steps.gate.outputs.run == 'true'
        run: node scripts/cuna-share-test.cjs
      # cluck-wallet.js only found wallets by legacy injection; Jupiter Mobile's in-app browser
      # registers through the Wallet Standard and was invisible on every page (2026-09-05). This
      # drives the shared layer with a fake standard wallet: discovery, the Phantom-shaped shim,
      # dedupe, late registration, the in-app-browser UA path.
      - name: wallet standard discovery
        if: steps.gate.outputs.run == 'true'
        run: node scripts/wallet-standard-test.cjs
      # Colosseum roadmap §7 — "accessibility and phone polish on the public pages" — judges click
      # these on phones. Boots its own server and drives /hub, /hub/<project>, /hub/demo,
      # /for-projects, /hub/apply and /hub/<project>/pay at 360 and 390px with a real Chromium:
      # no horizontal overflow, every real tap target >= 44x44 (inline-in-prose links, compact
      # mono data links and table cells are the standard, accepted exceptions), every <img> has
      # alt, icon-only controls have an accessible name, heading order is sane, <main>/<nav>
      # landmarks exist, and long mono strings never overflow their box. Not a full WCAG audit —
      # contrast and the language toggle's lang attribute were checked by hand for this batch (see
      # the PR) and aren't re-derived here.
      - name: Hub pages — accessibility + phone polish
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-a11y-test.cjs
      # EE2: this job has Chromium installed (the step above), so re-running the glossary test
      # here (its drift + route sections re-verify cheaply; node-check above is where they're
      # REQUIRED to run) also exercises the rendered-page section for real: the page renders, the
      # #below_min_lock anchor scrolls to its section, the search box filters, and none of the
      # forbidden words appear.
      - name: Project Hub — the glossary (EE2) — rendered page (Chromium)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-glossary-test.cjs
      # Z2 (docs/COLOSSEUM_ROADMAP.md §10): GET /api/build (the git sha/branch this container is
      # actually running) and /hub/status (public/hub-status.html) — the page that renders it next
      # to every project's own public numbers (programs, receipts, the reproducibility ratio, the
      # latest holder snapshot), fed only by routes already public. Seeds a throwaway registry with
      # a dry-run project and a real one with a sent batch so both the dry-run badge and the
      # reproducibility ratio actually render, then checks the rendered page carries neither a
      # judgement word nor an APR/APY claim.
      - name: Hub status — /api/build and /hub/status
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-status-test.cjs
      # AA4 (docs/COLOSSEUM_ROADMAP.md §11): the doc-drift test above only proves a URL's SHAPE
      # matches a registered route (static, no boot). This is the live half — boots the real
      # server with NO BUILD (dist/ never generated) on port 3268 and GETs every relative URL
      # docs/JUDGE_GUIDE.md tells a judge to open, asserting 200. Every route it names has an
      # explicit app.get reading public/ or lib/hub/schema/ directly (like hub-trust.html and
      # hub-status.html above), so this must pass with no `npm run build` step run first.
      - name: Hub judge guide — every URL it names answers 200 on a no-build boot (AA4)
        if: steps.gate.outputs.run == 'true'
        env:
          HUB_JUDGE_LINK_TEST_PORT: "3268"
        run: node scripts/hub-judge-link-test.cjs
      # Y1 (docs/COLOSSEUM_ROADMAP.md §9): /hub/verify reproduces a Hub receipt IN THE BROWSER —
      # a second vite build (vite.hubverify.config.js) bundles the exact same pure
      # lib/hub/reproduce.js + lib/hub/schema-validate.js + lib/hub/canonical.js the Node script
      # (scripts/reproduce-receipt.cjs) runs, so the two must agree on every fixture, not just
      # "look similar". `npm run build:hubverify` is not part of the earlier `npm run build` gate
      # in this job (that one only runs when the render gate needs it), so this step builds it
      # itself when missing.
      - name: Hub verify — browser bundle reproduces the same fixtures as the Node script (Y1)
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f public/hub-verify.bundle.js || npm run build:hubverify
          node scripts/hub-verify-page-test.cjs
      # AA2 (docs/COLOSSEUM_ROADMAP.md §11): the offline evidence bundle — GET
      # /api/hub/:project/batch/:batchId/bundle (and the demo-fixture mirror), lib/hub/bundle.js's
      # own pure SHA-256 in isolation, the Node CLI's `--bundle` flag, and Chromium dropping a
      # bundle file on /hub/verify. Same reason this rides the Y1 gate: it shares the browser
      # bundle build and the exact same fixture-agreement discipline.
      - name: Hub evidence bundle — hash integrity, route, CLI and /hub/verify (AA2)
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f public/hub-verify.bundle.js || npm run build:hubverify
          node scripts/hub-bundle-test.cjs
      # Colosseum roadmap §9 Y4 — shareable Hub pages. Boots its own server (a hostile-label
      # registry project pre-seeded into DATA_DIR) and drives /hub, a real project page, the demo
      # fixture (project/program/receipt) and /for-projects: server-rendered Open Graph/Twitter
      # Card meta is present, escaped (an XSS-shaped project label never reaches the page raw),
      # <=70/<=200 char, carries the reproducibility line, a missing project/receipt still serves
      # 200 with the generic Hub meta, the demo pages carry "DRY RUN — fixture data", and the one
      # static branded card serves as image/png with a long cache header.
      - name: Hub shareable pages — Open Graph / Twitter Card meta (Y4)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-og-test.cjs
      # Colosseum roadmap §11 AA1 — one wallet, every project. Boots its own server (two registry
      # projects pre-seeded into DATA_DIR, a buy competition on each, the same fixture wallet
      # qualifying and paid in one, disqualified with a reason on record in the other) and drives
      # GET /api/hub/wallet/:wallet and the /hub/wallet[/:wallet] page: composed only from
      # hubPublic.walletLookup per project, no private field on the wire, a malformed address is
      # 400, an unseen valid address is an honest 200/seenIn:0, a demo/fixture project never
      # appears, "wallet" is refused as a real project id, and the page carries none of the
      # banned yield/APR/APY/verified/safe/guaranteed language.
      - name: Hub wallet look-up — one wallet, every project (AA1)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-wallet-test.cjs
      # CC1 (docs/COLOSSEUM_ROADMAP.md §13) — "what changed in the rules" between two program
      # versions. Boots its own server with two fixture program versions seeded directly through
      # lib/hub/project.js (differing in exactly two term fields) and asserts:
      # /hub/<project>/programs/compare resolves to the compare page at its literal path (never
      # the /hub/:project/programs or /hub/:project catch-alls — a longer path a shorter pattern
      # cannot match), a real Chromium renders exactly those two fields as changed and every other
      # field as unchanged (collapsed under the toggle), comparing a version with itself is empty,
      # both versions' hashes are shown and equal the public program-version API's own hashes, an
      # unknown version answers an honest not-found state, and no forbidden word appears.
      - name: Hub compare — what changed between two program versions (CC1)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-compare-test.cjs
      # DD4 (docs/COLOSSEUM_ROADMAP.md §14) — "a receipt you can print." Two independent checks:
      # public/hub-qr.js (a pure, no-network, no-library QR encoder) is unit-tested in Node —
      # finder/timing/format-info structure, the module-count invariant that caught a real
      # placement bug during development, and a byte-mode Reed-Solomon round trip on the actual
      # codewords a real encode produces (encode -> corrupt up to the max correctable count ->
      # decode -> recover exactly; one error past that never silently "recovers"). Then a real
      # Chromium loads /hub/<project>/r/<sig>?print=1 against a seeded receipt with a real
      # walkthrough behind it: the signature in full, the program-version hash, the amount, the
      # trust-boundary line, and an svg[role=img] whose aria-label is the exact receipt URL, plus
      # @media print emulation proving nav/pills/buttons/footer are hidden and the sheet itself is
      # print-safe (white background). No forbidden word (verified/audited/APR/APY, Normie Quest,
      # Wallet Watch) anywhere the feature renders.
      - name: Hub print sheet — QR encoder + Reed-Solomon + the print page (DD4)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/hub-print-test.cjs
      # EE3 (docs/COLOSSEUM_ROADMAP.md §15) — "load proof for the public reads." Builds a
      # deterministic 10-project x 50-receipt fixture (scripts/hub-load-fixture.cjs — the reduced
      # scale this CI job uses; the full 50x200 numbers live in docs/HUB_LOAD_2026-09-18.md) and
      # drives every heavy Hub read (reproducibility, its history, buy-comp standings, the
      # evidence bundle, the badge, both feeds, the wallet roll-up) plus the two plain reads P1-03
      # flagged as carrying no rate limiter (`/api/hub`, `/api/hub/:project`) and the `/hub/:project`
      # share page, at/over the `hubheavy` ceiling, from scripts/hub-load-smoke.cjs. Reports p50/p95
      # per route and the worst `/healthz` latency observed while the burst runs — the exact
      # event-loop-stall shape the P1-03 finding measured. Not diff-gated: a route or a limiter
      # here never touches a rendered page, so the render-diff gate would never see it change.
      # Always-run per the roadmap item's own budgets. The P1-03 fix round (limiter + per-project
      # view cache) landed in the same batch; the after-picture in docs/HUB_LOAD_2026-09-18.md
      # measures every route under the 500ms p95 budget and `/healthz` at ~400ms max while sixty
      # requests land on one event loop at once (it was 1.3s before the fix, 52s on the 50x200
      # fixture). The /healthz budget here is 1000ms — a real stall regression (the P1-03 shape is
      # seconds, not hundreds of milliseconds) still trips it; a slow CI runner does not.
      - name: Hub load proof — heavy public reads under a rate-limit-ceiling burst (Colosseum §15 EE3)
        run: |
          node scripts/hub-load-fixture.cjs --projects 10 --receipts 50
          HUB_LOAD_TEST_PORT=3420 node scripts/hub-load-smoke.cjs --healthz-ms 1000
      # Tools pass CLIENT (second reviewer, round 4): a wallet that broadcast but whose callback
      # rejected left no record, so the next tap sent a SECOND transfer. The attempt is now durable
      # before anything can broadcast (sign-first path persists the signature before the send; the
      # send-only path records an unresolved attempt and resolves it on-chain). Fake Wallet Standard
      # wallet + mocked RPC, real server, real cluck-gate.js on a real tool page.
      # Not diff-gated (deep dive P1-021): this is a money test, and the render gate skipped it
      # whenever a change did not touch a page — which is exactly when a server-side gate change
      # breaks the client flow.
      - name: tools pass client — a lost wallet callback never charges twice
        run: node scripts/tool-pass-client-test.cjs
      # GRAB $NORMIE on the between-level beat opened the wallet panel while the beat's auto-advance
      # kept running underneath, so the next level started behind the panel — music, dead taps
      # (owner, 2026-09-05). This drives the lab hooks: panel open → the beat holds; Escape closes;
      # a tap continues; with no panel the beat still auto-advances.
      - name: Normie Quest between-level beat vs wallet panel
        if: steps.gate.outputs.run == 'true'
        run: node normie-quest/test/nq-beat-panel-test.cjs
      - name: render every screen and lesson
        if: steps.gate.outputs.run == 'true'
        run: node scripts/smoke-test.js
      # LP Lab progress used to be keyed by ARRAY INDEX, so inserting or reordering a lesson
      # silently moved every learner's ticks onto different lessons. Nothing errors when that
      # happens, which is exactly why it needs a test that looks at the rendered tiles.
      # Not diff-gated (deep dive P1-021), but the React build above IS — so on a server-only diff
      # this step booted a server with no dist/index.html and every page render failed (PR #336,
      # 2026-09-17). It builds the shell itself when the gated step did not.
      - name: LP Lab progress survives a lesson insert
        run: |
          test -f dist/index.html || npm run build
          PORT=3111 node server.js & echo $! > /tmp/lp-srv.pid
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3111/healthz >/dev/null && break; sleep 1; done
          node scripts/lplab-progress-test.cjs http://127.0.0.1:3111
          kill "$(cat /tmp/lp-srv.pid)" || true
      # Full leaderboard suite including the telemetry-router cases that node-check (no deps)
      # skips — here express is installed, so a skip means something is wrong and must fail.
      - name: Normie Quest leaderboard anti-forgery test (full, incl. telemetry router)
        env:
          NQ_LB_REQUIRE_ROUTER: "1"
        run: node normie-quest/test/nq-leaderboard-test.cjs
      # The payout-loop cases need @solana/web3.js (whirlpool-vault), so they SKIP in node-check.
      # Here the deps exist, and GIVEAWAY_REQUIRE_VAULT turns that skip into a failure — this loop
      # is the send/record/confirm ordering on the prize money path and must not go untested.
      - name: giveaway payout tests (full, incl. the send/record/confirm loop)
        env:
          GIVEAWAY_REQUIRE_VAULT: "1"
        run: node scripts/giveaway-holdcheck-test.cjs
      - name: Normie Quest prize-claim test (full, incl. signatures + routes)
        env:
          NQ_CLAIMS_REQUIRE_DEPS: "1"
        run: node normie-quest/test/nq-claims-test.cjs
      # The Owners Snapshot crawl is an hour of paid RPC reads per run, so an ungated
      # /start is a public credit lever. This boots the server both ways and proves the
      # gate closes — and that TOOLGATE_OFF still opens it.
      - name: Owners Snapshot access gate
        run: node scripts/owners-snapshot-gate-test.cjs

  # The static guards AND the smoke test above still cannot SEE the game's own render. Every costly
  # regression this year was visual and built/deployed clean: the HUD slid off-screen at 3x zoom, a
  # creature shipped with a black box baked around it, a character rendered the wrong size, a run
  # animation bounced. This boots the real server and pixel-diffs the game's key surfaces (title,
  # HUD, the three characters, the gravemite) against committed baselines in
  # normie-quest/test/visual-baselines/. A structural change fails the build; the diff images upload
  # as an artifact for the owner (sole sign-off) to look at. Full workflow: docs/STAGING_WORKFLOW.md.
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The 13-minute game render gate only earns its time when the change could
      # plausibly touch the game's render path. A PR that only edits docs, tool
      # pages, backend libs, or scripts cannot break the Normie Quest canvas —
      # skip the boot+render for those and pass fast. Anything matching the game
      # itself, server.js (it serves the game), deps, or this workflow still runs
      # the full gate. Non-PR events (push to main/develop, manual dispatch)
      # ALWAYS run in full — main is production.
      - name: decide whether the game gate applies
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # A dispatch run validates a pending PR branch (the push-before-PR-open quirk means
            # the pull_request run often never fires), so gate it exactly like that PR would be:
            # diff against the merge-base with main. Owner ask 2026-08-28: stop running the
            # Normie Quest render gates for changes that cannot touch Normie Quest.
            git fetch origin main --quiet 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
            if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: dispatch with no resolvable base — full run"; exit 0; fi
          elif [ "$EVENT" = "push" ]; then
            # Same push gate as the smoke job (owner, 2026-09-13): the push range is the merged
            # PR's content, so a store/CUNA/Telegram merge no longer pays for the 13-minute game
            # render it already skipped on the PR. Unresolvable range → full run.
            BASE="${{ github.event.before }}"
            case "$BASE" in 0000000000000000000000000000000000000000) BASE="";; esac
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: push with no resolvable range — full run"; exit 0
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: unknown event — full run"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(normie-quest/|package(-lock)?\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: game-relevant change — full run"
          elif echo "$CHANGED" | grep -qE '^\.github/workflows/' && git diff "$BASE"...HEAD -- .github/workflows | grep -qiE 'nq-|normie|visual|playwright|game_logic'; then
            # Editing THIS file only matters to the render when the edit touches the render or
            # game jobs. Adding a unit-test step to node-check (PR #284) used to cost 13 minutes.
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: workflow edit touches the render/game jobs — full run"
          elif echo "$CHANGED" | grep -qE '^server\.js$'; then
            # server.js is ~11k lines covering the WHOLE app, so "server.js changed" fired the
            # 13-minute render gate for Telegram routes, liquidity endpoints and admin params
            # that cannot reach the game. Look at the DIFF instead of the filename: only hunks
            # that mention the game (its routes, assets, env or build output) can break the
            # render, and those still run the gate in full.
            if git diff "$BASE"...HEAD -- server.js | grep -qiE 'normie|nq[-_]|/play|game_logic'; then
              echo "run=true" >> "$GITHUB_OUTPUT"; echo "gate: server.js diff touches the game — full run"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"; echo "gate: server.js diff has no game references — skipping render"
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "gate: no game-relevant paths — skipping render"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      # No `npm run build` here (unlike smoke-test): server.js serves the game through an EXPLICIT
      # route and the built normie-quest HTML is committed; only the React catch-all reads dist/,
      # which this job never hits. Booting without a build keeps it lean.
      - name: install playwright chromium
        if: steps.gate.outputs.run == 'true'
        run: |
          npm i --no-save playwright@1.62.1   # pinned — see the smoke-test job
          npx playwright install --with-deps chromium
      - name: boot server + run visual regression
        if: steps.gate.outputs.run == 'true'
        env:
          PORT: "3111"
          # Booted with NO secrets on purpose: the scheduler/bot block only starts when a Telegram
          # token is present and every money path needs a key, so this render-only run is side-effect
          # free — no posts, no vault, nothing live.
          UPDATE_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines || 'false' }}
        run: |
          node server.js & echo $! > /tmp/nq_server.pid
          for i in $(seq 1 40); do curl -sf "http://localhost:3111/healthz" >/dev/null && break || sleep 2; done
          # `timeout` bounds the whole run: a single hung capture (a browser can wedge under memory
          # pressure) then fails the job at 10 min instead of hanging until GitHub's 6-hour cap.
          if [ "$UPDATE_BASELINES" = "true" ]; then
            timeout 1500 node normie-quest/test/nq-visual.cjs http://localhost:3111 --update
          else
            timeout 1500 node normie-quest/test/nq-visual.cjs http://localhost:3111
          fi
          code=$?
          kill "$(cat /tmp/nq_server.pid)" 2>/dev/null || true
          exit $code
      - name: upload diff images (on regression)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nq-visual-diffs
          path: normie-quest/test/visual-diffs/
          if-no-files-found: ignore
      # Only on a manual "regenerate baselines" run: hand the new PNGs back so they can be committed
      # from the environment that will be checking them (fixes cross-machine webfont noise).
      - name: upload refreshed baselines (manual --update dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: nq-visual-baselines
          path: normie-quest/test/visual-baselines/

  # ---- Normie Quest STATE TEST: only when the change is STRUCTURAL, and split across runners ----
  # Owner, 2026-09-06: "use multiple agents and split the levels up so they don't have to work so
  # long, and only need to do full reviews of levels if something structurally changed to the
  # levels, not like an icon change or background change". This is that rule, mechanised:
  #   1. nq-state-plan asks normie-quest/test/nq-verify.cjs (--json) what the diff can reach. An
  #      icon, a backdrop, a between-level card, a menu or a DOM control → mode=none (nothing here
  #      runs; the visual gate / beat test in the other jobs cover those). One level's data →
  #      mode=some (that level only). ENGINE code (constants, the Game scene, the Phaser config) →
  #      mode=full: every level, as a 6-way matrix, ~15 levels per runner instead of 90 on one box.
  #   2. nq-state runs one shard per runner (NQ_SHARD=i/n in nq-state-test.cjs — round-robin, so the
  #      wide VIP levels are spread, not dumped on the last shard).
  # The full run had never run in CI before this (it lived on a session's box, 15-120 minutes,
  # and timed out under load on 2026-09-05), so it is ADVISORY for its first week: a red shard
  # cannot block a merge until it has proved it does not invent NO-LOADs on a 2-vCPU runner.
  # Promote by deleting the continue-on-error line on or after 2026-09-13 if the week was clean.
  # Rules + the local recipe: docs/NQ_TESTING_RULES.md.
  nq-state-plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      only: ${{ steps.plan.outputs.only }}
      shards: ${{ steps.plan.outputs.shards }}
      bossGround: ${{ steps.plan.outputs.bossGround }}
      touchPause: ${{ steps.plan.outputs.touchPause }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No npm ci: the planner is plain node + git.
      # nq-verify.cjs's REGION_BOUNDS decide which test tier a game_logic.js change gets. If a
      # boundary regex ever stops matching (a reworded banner comment, a renamed scene), the
      # region it anchors silently MERGES into the region before it — no error, just a plan that
      # quietly under-tests (e.g. losing the 'Game' boundary would downgrade tier-gate code from a
      # full state-test run to a smoke level). Prove every boundary still matches, IN ORDER, before
      # trusting the plan that follows.
      - name: nq-verify self-test (REGION_BOUNDS still match game_logic.js, in order)
        run: node normie-quest/test/nq-verify-selftest.cjs
      - name: plan the state test from the diff
        id: plan
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
            case "$BASE" in 0000000000000000000000000000000000000000) BASE="";; esac
          else
            git fetch origin main --quiet 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            MODE=full; ONLY=""; BOSSGROUND=true; TOUCHPAUSE=true; echo "plan: no resolvable base — full run"
          else
            node normie-quest/test/nq-verify.cjs --against "$BASE" --json > /tmp/nq-plan.json
            cat /tmp/nq-plan.json
            MODE=$(node -e "const p=require('/tmp/nq-plan.json').plan;console.log(p.state==='ALL'?'full':(Array.isArray(p.state)&&p.state.length?'some':'none'))")
            ONLY=$(node -e "const p=require('/tmp/nq-plan.json').plan;console.log(Array.isArray(p.state)?p.state.join(','):'')")
            BOSSGROUND=$(node -e "console.log(!!require('/tmp/nq-plan.json').plan.bossGround)")
            TOUCHPAUSE=$(node -e "console.log(!!require('/tmp/nq-plan.json').plan.touchPause)")
          fi
          if [ "$MODE" = "full" ]; then SHARDS='["1/6","2/6","3/6","4/6","5/6","6/6"]'; else SHARDS='["1/1"]'; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "bossGround=$BOSSGROUND" >> "$GITHUB_OUTPUT"
          echo "touchPause=$TOUCHPAUSE" >> "$GITHUB_OUTPUT"
          echo "plan: mode=$MODE only='$ONLY' shards=$SHARDS bossGround=$BOSSGROUND touchPause=$TOUCHPAUSE"

  nq-state:
    needs: nq-state-plan
    if: needs.nq-state-plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    # ADVISORY until 2026-09-13 (see the note above) — delete this line to make it a gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.nq-state-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: install playwright chromium
        run: |
          npm i --no-save playwright@1.62.1   # pinned — see the smoke-test job
          npx playwright install --with-deps chromium
      - name: boot server + state test (shard ${{ matrix.shard }})
        env:
          PORT: "3111"
          NQ_SHARD: ${{ matrix.shard }}
          NQ_ONLY: ${{ needs.nq-state-plan.outputs.only }}
          # Booted with NO secrets on purpose — same reasoning as the visual job: no scheduler, no
          # money path, nothing live can be reached from a level boot.
        run: |
          node server.js & echo $! > /tmp/nq_server.pid
          for i in $(seq 1 40); do curl -sf "http://localhost:3111/healthz" >/dev/null && break || sleep 2; done
          timeout 1500 node normie-quest/test/nq-state-test.cjs http://localhost:3111
          code=$?
          kill "$(cat /tmp/nq_server.pid)" 2>/dev/null || true
          exit $code

  # ---- Normie Quest BOSS GROUND: gate a boss-plate swap against the shared body constants ----
  # F22 (2026-09-06 deep dive): nq-boss-ground.cjs existed, worked, and never ran in CI — nq-verify
  # computed plan.bossGround from the diff and the workflow discarded it. Wired the same way as the
  # state-test plan/run split above: nq-state-plan already asks nq-verify.cjs for the full plan, so
  # it also surfaces plan.bossGround as a job output, and this job runs the harness only when a
  # boss plate actually changed. Real gate, not advisory — a swapped plate with a different bottom
  # margin silently sinks or floats a boss (CLAUDE.md, 2026-08-16); a PR touching no boss plate
  # gets bossGround=false from nq-verify and this job is skipped entirely.
  nq-boss-ground:
    needs: nq-state-plan
    if: needs.nq-state-plan.outputs.bossGround == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: install playwright chromium
        run: |
          npm i --no-save playwright@1.62.1   # pinned — see the smoke-test job
          npx playwright install --with-deps chromium
      - name: boot server + boss-ground check
        env:
          PORT: "3111"
          # Booted with NO secrets on purpose — same reasoning as the visual/state jobs: no
          # scheduler, no money path, nothing live can be reached from a level boot.
        run: |
          node server.js & echo $! > /tmp/nq_server.pid
          for i in $(seq 1 40); do curl -sf "http://localhost:3111/healthz" >/dev/null && break || sleep 2; done
          timeout 900 node normie-quest/test/nq-boss-ground.cjs http://localhost:3111
          code=$?
          kill "$(cat /tmp/nq_server.pid)" 2>/dev/null || true
          exit $code

  # ---- Normie Quest PAUSE-TOUCH: gate the joystick guard band + resume latch on real input -----
  # 9.4 (2026-09-06 deep dive): nq-pause-touch.cjs was fully written, exits real pass/fail, and was
  # never invoked. Wired the same way as nq-boss-ground above: nq-state-plan already asks
  # nq-verify.cjs for the full plan, so it also surfaces plan.touchPause as a job output, and this
  # job runs the harness only when the Game scene, its helpers, or the DOM overlay layer actually
  # changed — exactly the regions the two bugs this file guards (the joystick's top-band geometry;
  # resume-on-a-held-button spending a Solana disc; the pause-rebase timer burst) live in. A PR
  # touching neither gets touchPause=false from nq-verify and this job is skipped entirely.
  nq-pause-touch:
    needs: nq-state-plan
    if: needs.nq-state-plan.outputs.touchPause == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: install playwright chromium
        run: |
          npm i --no-save playwright@1.62.1   # pinned — see the smoke-test job
          npx playwright install --with-deps chromium
      - name: boot server + pause-touch check
        env:
          PORT: "3111"
          # Booted with NO secrets on purpose — same reasoning as the visual/state/boss-ground
          # jobs: no scheduler, no money path, nothing live can be reached from a level boot.
        run: |
          node server.js & echo $! > /tmp/nq_server.pid
          for i in $(seq 1 40); do curl -sf "http://localhost:3111/healthz" >/dev/null && break || sleep 2; done
          timeout 900 node normie-quest/test/nq-pause-touch.cjs http://localhost:3111
          code=$?
          kill "$(cat /tmp/nq_server.pid)" 2>/dev/null || true
          exit $code
