<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>👑 The VIP Lounge</title>
<style>
  /* ===== THE LUXURIOUS LOUNGE — dark speakeasy-luxe: warm near-black, gold + red neon, blue accent.
     Deliberately NOT the retro arcade look of the game — a premium members' room. Self-contained
     (no external fonts/assets) to stay CSP-safe + offline-friendly. ===== */
  :root {
    --bg:#080605; --ink:#0e0b09; --panel:rgba(30,23,16,.60); --edge:rgba(255,196,92,.18);
    --gold:#ffc85a; --gold-hi:#ffe6a6; --red:#ff4a33; --red-hi:#ff7a5c; --blue:#38c9ff;
    --txt:#f4ecdd; --mut:#b6a789; --dim:#7d715c;
    --neon-gold:0 0 6px rgba(255,200,90,.55), 0 0 22px rgba(255,170,40,.35);
    --neon-red:0 0 7px rgba(255,74,51,.6), 0 0 24px rgba(255,74,51,.4);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--txt); min-height:100vh;
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Inter,sans-serif;
    /* warm cinematic depth: amber pool + cigar-smoke haze + vignette over near-black */
    background-image:
      radial-gradient(120% 80% at 50% -10%, rgba(255,150,40,.14), transparent 60%),
      radial-gradient(90% 60% at 85% 20%, rgba(56,201,255,.06), transparent 60%),
      radial-gradient(140% 120% at 50% 120%, rgba(255,60,30,.10), transparent 55%),
      linear-gradient(180deg,#0b0806,#060403);
    background-attachment:fixed; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.66)); }
  .wrap { position:relative; z-index:1; max-width:720px; margin:0 auto; padding:34px 16px 70px; }

  /* --- neon header --- */
  header { text-align:center; margin-bottom:26px; }
  .brand { display:inline-block; line-height:.94; padding:6px 2px; }
  .brandimg { display:block; width:min(420px,82vw); height:auto; margin:0 auto;
    mix-blend-mode:screen; filter:drop-shadow(0 0 18px rgba(255,90,40,.28)); }
  .lx-the { display:block; font-size:15px; font-weight:800; letter-spacing:5px; color:var(--red-hi);
    text-shadow:var(--neon-red); margin-bottom:2px; }
  .lx-lux { display:block; font-family:'Snell Roundhand','Brush Script MT',cursive; font-style:italic;
    font-size:46px; font-weight:700; color:var(--gold); text-shadow:var(--neon-gold); letter-spacing:1px; }
  .lx-lounge { display:block; font-size:38px; font-weight:900; letter-spacing:7px; color:var(--red);
    text-shadow:var(--neon-red); margin-top:-2px; }
  .sub { color:var(--mut); font-size:11.5px; letter-spacing:2.5px; margin-top:12px; text-transform:uppercase; font-weight:700; }
  .rule { height:1px; max-width:220px; margin:16px auto 0; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.5; }

  /* --- glass panels --- */
  .card { position:relative; background:var(--panel); border:1px solid var(--edge); border-radius:16px;
    padding:20px; margin-bottom:14px; backdrop-filter:blur(9px) saturate(1.1); -webkit-backdrop-filter:blur(9px) saturate(1.1);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05); }
  .card.vipwall { text-align:center; padding:36px 20px; border-color:rgba(255,200,90,.28); }

  /* --- buttons: gold neon --- */
  button { background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#241503; border:0;
    border-radius:11px; padding:13px 22px; font-size:15px; font-weight:800; letter-spacing:.4px; cursor:pointer;
    margin:8px 4px 0; box-shadow:0 4px 16px rgba(255,170,40,.28), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .08s, box-shadow .15s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(255,170,40,.45); }
  button:active { transform:translateY(0); }
  button.ghost { background:rgba(255,255,255,.04); color:var(--txt); border:1px solid rgba(255,200,90,.35);
    box-shadow:none; font-weight:700; }
  button.ghost:hover { border-color:var(--gold); box-shadow:0 0 14px rgba(255,200,90,.25); }
  button:disabled, .spinbtn:disabled { background:rgba(255,255,255,.05); color:var(--dim); box-shadow:none;
    border:1px solid rgba(255,255,255,.06); cursor:default; transform:none; }
  a { color:var(--blue); text-decoration:none; } a:hover { text-shadow:0 0 10px rgba(56,201,255,.5); }
  .err { color:var(--red-hi); font-size:13px; margin-top:10px; min-height:16px; }

  /* --- VIP status bar --- */
  .idrow { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:11px 15px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); font-size:13px; color:var(--mut); margin-bottom:16px; }
  .idrow .stat { display:flex; align-items:center; gap:9px; }
  .idrow .dot { width:8px; height:8px; border-radius:50%; background:var(--blue); box-shadow:0 0 10px var(--blue); }
  .idrow b { color:var(--gold); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.5px; }
  .idrow .tier { font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    padding:3px 10px; border-radius:99px; }
  .idrow .tier.vip { color:#241503; background:linear-gradient(180deg,var(--gold-hi),var(--gold)); box-shadow:0 0 14px rgba(255,200,90,.4); }
  .idrow .tier.free { color:var(--mut); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); }
  .idrow button { font-size:12px; font-weight:700; padding:6px 13px; margin:0; }

  /* --- section headings --- */
  .sechead { display:flex; align-items:center; gap:10px; margin:22px 2px 12px; }
  .sechead h2 { font-size:13px; font-weight:900; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold); text-shadow:var(--neon-gold); white-space:nowrap; }
  .sechead .line { flex:1; height:1px; background:linear-gradient(90deg,rgba(255,200,90,.5),transparent); }

  /* --- coming-soon preview rail --- */
  .rail { display:flex; gap:12px; overflow-x:auto; padding:2px 2px 10px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .rail::-webkit-scrollbar { height:6px; } .rail::-webkit-scrollbar-thumb { background:rgba(255,200,90,.25); border-radius:99px; }
  .peek { flex:0 0 190px; scroll-snap-align:start; position:relative; border-radius:14px; overflow:hidden;
    border:1px solid var(--edge); background:var(--ink); box-shadow:0 8px 22px rgba(0,0,0,.5); }
  .peek .art { height:112px; display:flex; align-items:center; justify-content:center; font-size:52px;
    background:radial-gradient(120% 120% at 50% 0%, rgba(255,255,255,.12), transparent 60%); position:relative; }
  .peek .art::after { content:''; position:absolute; inset:0; backdrop-filter:blur(1.5px); background:rgba(4,3,2,.22); }
  .peek .art .lock { position:absolute; z-index:2; font-size:22px; right:8px; top:8px; filter:drop-shadow(0 0 6px rgba(0,0,0,.8)); backdrop-filter:none; }
  .peek .art .thumb { position:relative; z-index:2; height:96px; width:auto; max-width:86%; object-fit:contain; image-rendering:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)); backdrop-filter:none; }
  .peek .meta { padding:11px 12px 13px; }
  .peek .meta .t { font-size:13px; font-weight:800; color:var(--txt); letter-spacing:.3px; }
  .peek .meta .d { font-size:11px; color:var(--mut); margin-top:3px; line-height:1.4; }
  .peek .meta .badge { display:inline-block; margin-top:8px; font-size:9.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:99px; color:var(--gold); border:1px solid rgba(255,200,90,.35); }
  .peek .meta .badge.wheel { color:#c79bff; border-color:rgba(176,106,255,.5); background:rgba(176,106,255,.12); }
  .peek .meta .badge.on { color:#57f39a; border-color:rgba(87,243,154,.55); background:rgba(87,243,154,.12); }
  a.peek.unlocked { text-decoration:none; border-color:rgba(87,243,154,.5); box-shadow:0 0 0 1px rgba(87,243,154,.25), 0 8px 24px rgba(0,0,0,.5); }

  /* --- 🎟️ Preview Pass banner (a won hidden-world unlock) --- */
  .passcard { display:block; text-decoration:none; margin:2px 2px 14px; padding:16px 18px; border-radius:16px; position:relative; overflow:hidden;
    background:linear-gradient(135deg, rgba(176,106,255,.18), rgba(58,31,92,.28)); border:1px solid rgba(176,106,255,.5);
    box-shadow:0 0 0 1px rgba(176,106,255,.15), 0 12px 30px rgba(0,0,0,.5); transition:transform .12s ease, box-shadow .12s ease; }
  .passcard:hover { transform:translateY(-1px); box-shadow:0 0 0 1px rgba(176,106,255,.4), 0 16px 36px rgba(0,0,0,.55); }
  .passcard .pill { display:inline-block; font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:#d9bcff; padding:3px 10px; border-radius:99px; border:1px solid rgba(176,106,255,.6); background:rgba(176,106,255,.14); }
  .passcard .pt { font-size:18px; font-weight:900; color:var(--txt); margin-top:9px; letter-spacing:.3px; }
  .passcard .pd { font-size:12px; color:var(--mut); margin-top:4px; line-height:1.5; }
  .passcard .pgo { display:inline-block; margin-top:10px; font-size:12px; font-weight:800; letter-spacing:.5px; color:#c79bff; }

  /* --- feed posts --- */
  .post { border:1px solid var(--edge); }
  .post .tag { display:inline-block; font-size:10px; font-weight:800; letter-spacing:1px; padding:3px 9px; border-radius:99px; background:rgba(255,255,255,.05); color:var(--gold); margin-bottom:9px; text-transform:uppercase; border:1px solid rgba(255,200,90,.25); }
  .post .tag.giveaway { color:#57f39a; border-color:rgba(87,243,154,.3); } .post .tag.alpha { color:var(--blue); border-color:rgba(56,201,255,.3); } .post .tag.perk { color:var(--red-hi); border-color:rgba(255,122,92,.3); }
  .post h3 { font-size:16px; margin-bottom:6px; color:var(--txt); }
  .post p { font-size:14px; color:var(--mut); line-height:1.6; white-space:pre-wrap; }
  .post .ts { font-size:11px; color:var(--dim); margin-top:11px; font-family:ui-monospace,monospace; }

  /* --- spin wheel --- */
  .wheelcard { text-align:center; background:var(--panel); border:1px solid rgba(255,200,90,.24); border-radius:16px;
    padding:22px 18px; margin-bottom:14px; backdrop-filter:blur(9px) saturate(1.1); -webkit-backdrop-filter:blur(9px) saturate(1.1);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05); }
  .wheelcard h2 { color:var(--gold); font-size:15px; margin:0 0 2px; letter-spacing:2px; text-shadow:var(--neon-gold); }
  .wheelcard .cap { font-size:12px; color:var(--mut); margin-bottom:4px; line-height:1.5; }
  .wheelwrap { position:relative; width:230px; height:230px; margin:16px auto 4px; filter:drop-shadow(0 8px 26px rgba(255,140,20,.22)); }
  .wheelwrap svg { display:block; width:100%; height:100%; }
  #thewheel { transition:transform 4.2s cubic-bezier(.15,.72,.18,1); transform-origin:130px 130px; }
  .pend { display:block; margin-top:10px; font-size:12.5px; color:#8dffc0; }
  .pend a { color:#8dffc0; }
  .wheelmsg { font-size:14px; color:var(--txt); margin-top:12px; min-height:20px; }
  .wheelmsg b { color:var(--gold); }
  .odds { font-size:11px; color:var(--dim); margin-top:6px; }
  .raffleline { margin-top:10px; font-size:12.5px; color:#7ef0a6; }
  .raffleline b { color:#b6ffce; }
  .buffline { margin-top:10px; font-size:12.5px; color:#ff9ec8; }
  .buffline b { color:#ffc2dd; }
  .jackteaser { display:flex; align-items:center; gap:12px; text-align:left; margin-top:12px; padding:12px 14px; border-radius:14px;
    background:linear-gradient(135deg, rgba(255,200,90,.12), rgba(90,60,10,.18)); border:1px dashed rgba(255,200,90,.5); }
  .jackteaser .jt-coin { font-size:26px; filter:drop-shadow(0 0 8px rgba(255,200,90,.5)); }
  .jackteaser .jt-t { font-size:13px; font-weight:900; color:var(--gold); letter-spacing:.4px; }
  .jackteaser .jt-d { font-size:11.5px; color:var(--mut); margin-top:2px; line-height:1.45; }
  .jackteaser .jt-soon { margin-left:auto; align-self:flex-start; font-size:9.5px; font-weight:900; letter-spacing:1.5px; color:#1a1204;
    background:var(--gold); padding:3px 8px; border-radius:99px; }
  .crown { display:none; }

  /* ============================================================================
     ✦ HIGH-TECH UPGRADE LAYER (2026-08-11) — holographic depth, motion + HUD glow.
     Appended so it layers over the base speakeasy styling without touching the
     JS-driven markup (every class name is preserved). ============================ */
  @keyframes lxAurora { to { transform:rotate(360deg); } }
  @keyframes lxGrid   { to { background-position:46px 46px, 46px 46px, 0 0; } }
  @keyframes lxRise   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes lxSheen  { 0% { background-position:-150% 0; } 60%,100% { background-position:150% 0; } }
  @keyframes lxPulse  { 0%,100% { opacity:.45; transform:scale(1); } 50% { opacity:1; transform:scale(1.3); } }
  @keyframes lxFloat  { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }

  body { background:#050403; }
  /* drifting cyber grid + edge vignette, masked to fade toward the sides */
  body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,200,90,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,201,255,.075) 1px, transparent 1px),
      radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.72));
    background-size:46px 46px, 46px 46px, 100% 100%;
    -webkit-mask-image:radial-gradient(130% 95% at 50% 16%, #000 30%, transparent 82%);
    mask-image:radial-gradient(130% 95% at 50% 16%, #000 30%, transparent 82%);
    animation:lxGrid 8s linear infinite; }
  /* slow-rotating holographic aurora behind everything */
  body::after { content:''; position:fixed; inset:-45%; z-index:0; pointer-events:none; will-change:transform;
    background:
      radial-gradient(36% 44% at 26% 30%, rgba(56,201,255,.13), transparent 62%),
      radial-gradient(40% 48% at 78% 24%, rgba(176,106,255,.15), transparent 60%),
      radial-gradient(50% 52% at 50% 86%, rgba(255,120,40,.14), transparent 60%),
      radial-gradient(42% 44% at 84% 80%, rgba(87,243,154,.09), transparent 60%);
    filter:blur(30px) saturate(1.25); animation:lxAurora 42s linear infinite; }

  .wrap { max-width:740px; }
  /* panels rise in + gain a glow on hover */
  .card, .wheelcard, .idrow, .passcard, #preview .peek, #feed .post {
    animation:lxRise .6s cubic-bezier(.2,.7,.2,1) both; }
  .card:hover, .wheelcard:hover { border-color:rgba(255,200,90,.5);
    box-shadow:0 16px 44px rgba(0,0,0,.6), 0 0 24px rgba(255,200,90,.16), inset 0 1px 0 rgba(255,255,255,.07); }
  /* glowing HUD accent line across the top of every panel (cyan→gold) */
  .card::before, .wheelcard::before { content:''; position:absolute; top:0; left:16px; right:16px; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(56,201,255,.55) 30%, rgba(255,200,90,.65) 70%, transparent); }
  /* shimmering gold section headings */
  .sechead h2 { background:linear-gradient(100deg, var(--gold) 22%, var(--gold-hi) 42%, #fff 50%, var(--gold-hi) 58%, var(--gold) 78%);
    background-size:210% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:lxSheen 5s ease-in-out infinite; }
  /* light-sweep shimmer across active buttons + the VIP badge */
  button:not(:disabled) { position:relative; overflow:hidden; }
  button:not(:disabled)::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(100deg, transparent 34%, rgba(255,255,255,.5) 50%, transparent 66%);
    background-size:230% 100%; animation:lxSheen 4.6s ease-in-out infinite; }
  .idrow .tier.vip { position:relative; overflow:hidden; }
  .idrow .tier.vip::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(100deg, transparent 36%, rgba(255,255,255,.6) 50%, transparent 64%);
    background-size:230% 100%; animation:lxSheen 3.8s ease-in-out infinite; }
  .idrow .dot { animation:lxPulse 1.8s ease-in-out infinite; }
  /* wheel gets a cool+warm double glow + a gentle float */
  .wheelwrap { filter:drop-shadow(0 8px 26px rgba(56,201,255,.18)) drop-shadow(0 0 30px rgba(255,140,20,.16));
    animation:lxFloat 6s ease-in-out infinite; }

  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58encode(bytes) {
    var d = [], s = '', i, j, c, n;
    for (i = 0; i < bytes.length; i++) { c = bytes[i]; n = 0;
      for (j = 0; j < d.length || c; j++) { n = (d[j] || 0) * 256 + c; d[j] = n % 58; c = Math.floor(n / 58); } }
    for (i = 0; i < bytes.length && bytes[i] === 0; i++) s += '1';
    for (i = d.length - 1; i >= 0; i--) s += B58[d[i]];
    return s;
  }
  function esc(t) { var d = document.createElement('div'); d.textContent = String(t == null ? '' : t); return d.innerHTML; }

  // ---- wallet detection: legacy globals + Wallet Standard (Jupiter-only desktops etc.) ----
  // ⚠ FIXED 2026-08-02. The register-wallet handler used to read `ev.detail` as a WALLET and
  // explicitly did NOTHING when it was a function — but per the Wallet Standard spec `detail` IS
  // the callback the app must invoke with its registry API. So the one branch that actually fires
  // was the one wired to a no-op, and a Wallet-Standard-only wallet (Jupiter is the common case)
  // never appeared on this page at all. The game's copy of this code had it right; the lounge did
  // not. Both shapes are handled now.
  var stdWallets = [];
  function regStd(w) { if (stdOk(w) && stdWallets.indexOf(w) < 0 && !stdWallets.some(function (x) { return x.name === w.name; })) stdWallets.push(w); }
  var stdApi = { register: function () { for (var i = 0; i < arguments.length; i++) regStd(arguments[i]); return function () {}; } };
  try {
    window.addEventListener('wallet-standard:register-wallet', function (ev) {
      try { if (ev && typeof ev.detail === 'function') ev.detail(stdApi); else if (ev && ev.detail) regStd(ev.detail); } catch (e) {}
    });
    window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: stdApi }));
  } catch (e) {}
  function stdOk(w) { try { return !!(w && (w.chains || []).some(function (c) { return String(c).indexOf('solana:') === 0; }) && w.features && w.features['standard:connect'] && w.features['solana:signMessage']); } catch (e) { return false; } }
  function stdAdapter(w) {
    return { connect: function () { return w.features['standard:connect'].connect().then(function (r) {
        var acct = (r && r.accounts && r.accounts[0]) || (w.accounts && w.accounts[0]);
        if (!acct) throw new Error('no account');
        var pk = acct.address; w.__acct = acct;
        return { publicKey: { toString: function () { return pk; } } }; }); },
      signMessage: function (bytes) { return w.features['solana:signMessage'].signMessage({ account: w.__acct, message: bytes }).then(function (res) {
        var out = Array.isArray(res) ? res[0] : res; return { signature: out.signature }; }); } };
  }
  function detect() {
    var found = [];
    function add(name, p) { if (p && !found.some(function (f) { return f.name === name; })) found.push({ name: name, provider: p }); }
    try { if (window.phantom && window.phantom.solana && window.phantom.solana.isPhantom) add('Phantom', window.phantom.solana); } catch (e) {}
    try { if (window.solflare && window.solflare.isSolflare) add('Solflare', window.solflare); } catch (e) {}
    try { if (window.backpack && window.backpack.isBackpack) add('Backpack', window.backpack); } catch (e) {}
    try { if (window.solana && window.solana.isPhantom && !found.length) add('Phantom', window.solana); } catch (e) {}
    try { window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: stdApi })); } catch (e) {}   // re-announce for late registrations
    stdWallets.forEach(function (w) { add(w.name, stdAdapter(w)); });
    try { if (!found.length && window.solana) add('Wallet', window.solana); } catch (e) {}
    return found;
  }

  var errEl = document.getElementById('err');
  function renderButtons() {
    var box = document.getElementById('wallets'), ws = detect();
    box.innerHTML = '';
    if (!ws.length) { box.innerHTML = '<p style="font-size:13px;color:#b6bfe0">No Solana wallet detected — open this page in your wallet\'s browser, or install Phantom / Solflare / Jupiter and reload.</p>'; return; }
    ws.forEach(function (w) {
      var b = document.createElement('button'); b.textContent = 'Connect ' + w.name;
      b.onclick = function () { go(w).catch(function (e) { errEl.textContent = String(e && e.message || e); }); };
      box.appendChild(b);
    });
  }

  var activeProvider = null;   // the provider we actually connected with — needed to disconnect it
  async function go(w) {
    errEl.textContent = '';
    var resp = await w.provider.connect();
    activeProvider = w.provider;
    var pk = (resp && resp.publicKey ? resp.publicKey : w.provider.publicKey).toString();
    var ch = await (await fetch('/api/nq/wallet/challenge?pubkey=' + pk)).json();
    if (!ch.ok) throw new Error('Challenge failed');
    var signed = await w.provider.signMessage(new TextEncoder().encode(ch.message), 'utf8');
    var sig = signed && signed.signature ? signed.signature : signed;
    var vr = await (await fetch('/api/nq/wallet/verify', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pubkey: pk, signature: b58encode(sig), walletName: 'lounge:' + w.name }) })).json();
    if (!vr.ok) throw new Error('Verification failed');
    try { localStorage.setItem('nqLoungeAuth', JSON.stringify({ pubkey: pk, token: vr.token })); } catch (e) {}
    await openLounge(pk, vr.token);
  }

  // Anywhere a wallet can connect it must be able to DISCONNECT — say which wallet is connected,
  // call the provider's own disconnect() AND clear local state. This page had none of that: once
  // you signed in there was no way out short of clearing site data.
  function renderWho(pk, vip) {
    var who = document.getElementById('who');
    who.style.display = 'flex';
    who.className = 'idrow';
    who.innerHTML = '<span class="stat"><span class="dot"></span>Signed in&nbsp;<b>' + esc(pk.slice(0, 4) + '…' + pk.slice(-4)) + '</b></span>'
      + '<span class="stat"><span class="tier ' + (vip ? 'vip' : 'free') + '">' + (vip ? '👑 VIP' : 'Guest') + '</span>'
      + '<button class="ghost" id="disc">Disconnect</button></span>';
    document.getElementById('disc').onclick = function () {
      try { if (activeProvider && typeof activeProvider.disconnect === 'function') activeProvider.disconnect(); } catch (e) {}
      activeProvider = null;
      try { localStorage.removeItem('nqLoungeAuth'); } catch (e) {}
      ['who', 'preview', 'wheel', 'feed'].forEach(function (id) { var el = document.getElementById(id); el.style.display = 'none'; el.innerHTML = ''; });
      document.getElementById('gate').style.display = '';
      errEl.textContent = '';
      renderButtons();
    };
  }

  // ---- 🔮 COMING SOON preview rail — teaser cards for hidden/upcoming worlds, to build hype.

  // st (wheel status) is optional — the first paint runs without it (static rail); renderWheel
  // re-calls with live status so the featured world and a held Preview Pass show through.
  function renderPreview(st) {
    var box = document.getElementById('preview');
    box.style.display = 'block';
    var featured = st && st.preview && st.preview.room;      // the world on the wheel this rotation
    var pass = (st && st.pass) || null;                       // this wallet's active pass, or null
    // A won pass gets its own bright banner above the rail, with a play link and a live countdown.
    var passHtml = '';
    if (pass && pass.room) {
      var left = fmtCountdown((pass.expires || 0) - Date.now());
      passHtml = '<a class="passcard" href="' + GAME_URL + '?room=' + encodeURIComponent(pass.room) + '" target="_blank" rel="noopener">'
        + '<span class="pill">🎟️ PREVIEW PASS</span>'
        + '<div class="pt">' + esc(pass.emoji || '🌊') + ' Play ' + esc(pass.label || 'the hidden world') + '</div>'
        + '<div class="pd">Your pass is live — hidden prizes inside. Expires in ' + esc(left) + '.</div>'
        + '<span class="pgo">Enter the room →</span></a>';
    }
    box.innerHTML = '<div class="sechead"><h2>🔮 Coming Soon</h2><span class="line"></span></div>'
      + passHtml
      + '<div class="rail">' + PREVIEWS.map(function (p) {
        var unlocked = pass && p.room && pass.room === p.room;
        var onWheel = !unlocked && featured && p.room === featured;
        // The 'preview' wedge is VIP-only — a free player can't win it, so don't imply they can.
        var badge = unlocked ? '🎟️ Unlocked — play' : (onWheel ? (st && st.vip ? '🎡 On the wheel now' : '🎟️ VIP wheel prize') : (p.badge || 'Preview soon'));
        var badgeCls = unlocked ? 'badge on' : (onWheel ? 'badge wheel' : 'badge');
        var face = p.img ? '<img class="thumb" alt="" src="data:image/png;base64,' + p.img + '">' : '<span>' + p.emoji + '</span>';
        var art = '<div class="art" style="background-color:' + p.hue + '22">' + face
          + '<span class="lock">' + (unlocked ? '🎟️' : '🔒') + '</span></div>';
        var meta = '<div class="meta"><div class="t">' + esc(p.t) + '</div><div class="d">' + esc(p.d) + '</div>'
          + '<span class="' + badgeCls + '">' + esc(badge) + '</span></div>';
        return unlocked
          ? '<a class="peek unlocked" href="' + GAME_URL + '?room=' + encodeURIComponent(p.room) + '" target="_blank" rel="noopener">' + art + meta + '</a>'
          : '<div class="peek">' + art + meta + '</div>';
      }).join('') + '</div>';
  }

  async function openLounge(pk, token) {
    var r = await (await fetch('/api/nq/lounge?wallet=' + pk + '&token=' + encodeURIComponent(token))).json();
    // A rejected session is not a transient failure — the stored proof is dead, so bin it rather
    // than retrying it on every future visit.
    if (r && r.error === 'bad_session') { try { localStorage.removeItem('nqLoungeAuth'); } catch (e) {} throw new Error('Session expired — connect again.'); }
    if (!r.ok && r.error !== 'not_vip') throw new Error('Lounge check failed');
    // NOT VIP is no longer a dead end. It used to return here, which meant a non-VIP could never
    // reach the wheel at all — the daily spin existed only for people who had already converted.
    // Now the page opens, the free daily spin renders, and the members' feed is replaced by the
    // pitch for what a seat gets you.
    if (!r.ok) {
      document.getElementById('gate').style.display = 'none';
      renderWho(pk, false);
      renderPreview();
      renderWheel(pk, token);
      var feed0 = document.getElementById('feed');
      feed0.style.display = 'block';
      // No hold amount — NQ's gating terms are unagreed with the NORMIE team (CLAUDE.md).
      feed0.innerHTML = '<div class="card post"><span class="tag perk">perk</span>'
        + '<h3>👑 The Lounge is members-only</h3>'
        + '<p>Your free daily spin is above — it is yours every day, VIP or not.</p>'
        + '<p>A VIP seat adds better wheel odds, bonus spins through the day, the members\' feed '
        + '(giveaways, alpha drops and perks), and the VIP worlds.</p>'
        + '<p style="color:#6e6a86;font-size:12px">Seats come from holding $NORMIE or from winning one in a community competition — terms are still in testing.</p>'
        + '</div>';
      return;
    }
    document.getElementById('gate').style.display = 'none';
    renderWho(pk, true);
    renderPreview();
    renderWheel(pk, token);
    var feed = document.getElementById('feed');
    feed.style.display = 'block';
    feed.innerHTML = (r.posts || []).map(function (p) {
      return '<div class="card post"><span class="tag ' + esc(p.tag || 'perk') + '">' + esc(p.tag || 'perk') + '</span>'
        + '<h3>' + esc(p.title) + '</h3><p>' + esc(p.body) + '</p>'
        + '<div class="ts">' + esc(new Date(p.ts).toUTCString().replace(':00 GMT', ' UTC')) + '</div></div>';
    }).join('') || '<div class="card post"><h3>Nothing posted yet</h3><p>Check back soon.</p></div>';
  }

  // ---- 🎡 daily VIP prize wheel — win a game boost, banked to your Normie Quest inventory ----
  // The wheel DRAWS ITSELF from the odds the server sends: wedge sizes are the real percentages,
  // so a free player's 70/22/8 wheel and a VIP's 40/35/25 wheel LOOK different — the better odds
  // are visible, not just claimed, and an equal-slice wheel over unequal odds would be exactly
  // the kind of quiet dishonesty this project exists to teach people to spot. It also means a
  // prize added to the server table just appears (the old conic-gradient graphic was fixed at
  // three wedges and had to be rebuilt by hand). star / bomb are in ITEM_META because the
  // PENDING count includes owner grants and shop purchases, and an unnamed prize read as a bug.
  var ITEM_META = { disc: { emoji: '🥏', name: 'SOL Discs +5' }, vial: { emoji: '❤️', name: 'Full Heal' }, shield: { emoji: '🛡️', name: 'Audit Shield' },
    star: { emoji: '⭐', name: 'Star Power' }, bomb: { emoji: '🚀', name: 'Air Strike' }, preview: { emoji: '🎟️', name: 'Preview Pass' },
    raffle: { emoji: '🎫', name: 'Drawing Entry' }, heart: { emoji: '💗', name: 'Extra Heart · 24h' } };
  var GAME_URL = '/normie-quest-x7';
  var WHEEL_HUES = { disc: ['#e0a63a', '#5c3f0d'], vial: ['#e0503a', '#571a12'], shield: ['#3aa8cc', '#123f50'],
    star: ['#ffcf5a', '#6a4e10'], bomb: ['#ff6a3c', '#5a2010'], preview: ['#b06aff', '#3a1f5c'], raffle: ['#3ecf7a', '#12492c'], heart: ['#ff5aa0', '#5a1230'] };
  var wedgeCenter = {};   // prize id -> wedge-center angle, rebuilt with every render
  var wheelRot = 0;
  function wpt(a, r) { var rad = a * Math.PI / 180; return { x: (130 + r * Math.sin(rad)).toFixed(1), y: (130 - r * Math.cos(rad)).toFixed(1) }; }
  function wheelSvg(odds) {
    var R = 100;
    var list = (odds && odds.length) ? odds : [{ item: 'disc', pct: 34 }, { item: 'vial', pct: 33 }, { item: 'shield', pct: 33 }];
    var total = list.reduce(function (s, o) { return s + (Number(o.pct) || 0); }, 0) || 100;
    var defs = '', wedges = '', labels = '', a0 = 0;
    wedgeCenter = {};
    list.forEach(function (o, i) {
      var span = (Number(o.pct) || 0) / total * 360;
      if (span <= 0) return;
      var a1 = a0 + span, mid = a0 + span / 2;
      wedgeCenter[o.item] = mid;
      var p0 = wpt(a0, R), p1 = wpt(a1, R);
      var hue = WHEEL_HUES[o.item] || ['#6e6a86', '#2a2440'];
      defs += '<radialGradient id="wg' + i + '" cx="50%" cy="50%" r="70%">'
        + '<stop offset="0%" stop-color="' + hue[0] + '"/><stop offset="100%" stop-color="' + hue[1] + '"/></radialGradient>';
      wedges += '<path d="M130 130 L' + p0.x + ' ' + p0.y + ' A' + R + ' ' + R + ' 0 ' + (span > 180 ? 1 : 0) + ' 1 ' + p1.x + ' ' + p1.y + ' Z" '
        + 'fill="url(#wg' + i + ')" stroke="#ffd23f" stroke-width="1.5"/>';
      var m = ITEM_META[o.item] || { emoji: '🎁' };
      var e = wpt(mid, R * 0.66), t = wpt(mid, R * 0.38);
      labels += '<text x="' + e.x + '" y="' + e.y + '" font-size="24" text-anchor="middle" dominant-baseline="central" style="filter:drop-shadow(0 1px 2px #000)">' + m.emoji + '</text>'
        + '<text x="' + t.x + '" y="' + t.y + '" font-size="11" font-weight="700" fill="rgba(255,255,255,.85)" text-anchor="middle" dominant-baseline="central">' + Math.round(Number(o.pct) || 0) + '%</text>';
      a0 = a1;
    });
    var studs = '';
    for (var k = 0; k < 12; k++) { var s = wpt(k * 30, 112); studs += '<circle cx="' + s.x + '" cy="' + s.y + '" r="3.2" fill="' + (k % 2 ? '#ffd23f' : '#7a5c10') + '"/>'; }
    return '<div class="wheelwrap"><svg viewBox="0 0 260 260" aria-hidden="true">'
      + '<defs>' + defs + '</defs>'
      + '<circle cx="130" cy="130" r="124" fill="#130d07" stroke="#4a3a10" stroke-width="1.5"/>'
      + '<circle cx="130" cy="130" r="112" fill="none" stroke="#2a1e08" stroke-width="17"/>'
      + '<g id="thewheel">' + wedges + labels + '</g>'
      + studs
      + '<circle cx="130" cy="130" r="17" fill="#1a1204" stroke="#ffd23f" stroke-width="3"/>'
      + '<circle cx="130" cy="130" r="5" fill="#ffd23f"/>'
      + '<path d="M130 4 L117 32 L130 25 L143 32 Z" fill="#ffd23f" stroke="#7a5c10" stroke-width="1.5" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))"/>'
      + '</svg></div>';
  }
  function fmtCountdown(ms) {
    if (ms <= 0) return 'now';
    var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
    // Under an hour, "0h 7m" is just noise — and the last minute should say "under a minute"
    // rather than the flat "0m" it used to show for a full sixty seconds.
    if (h <= 0) return m >= 1 ? m + 'm' : 'under a minute';
    return h + 'h ' + m + 'm';
  }
  // 🎫 running drawing-entry tally + 🪙 the $NORMIE jackpot teaser (a labeled 'coming soon' — NOT a
  // wheel wedge, so the wheel's slice-size-equals-odds honesty stays intact).
  function renderJackpot(st) {
    var el = document.getElementById('jackpot'); if (!el) return;
    var html = '';
    // 💗 Extra Heart buff: the server is the source of truth. Re-mirror its expiry into localStorage
    // so the game reads it even if the win happened on this device earlier (or localStorage was cleared).
    if (st && st.heartBuff && st.heartBuff.expires > Date.now()) {
      try { localStorage.setItem('nqHeartBuffUntil', String(st.heartBuff.expires)); } catch (e) {}
      html += '<div class="buffline">💗 <b>Extra Heart</b> active — 4 hearts on every level for '
        + fmtCountdown(st.heartBuff.expires - Date.now()) + '.</div>';
    }
    if (st && st.raffle) html += '<div class="raffleline">🎫 You hold <b>' + st.raffle + '</b> drawing '
      + (st.raffle === 1 ? 'entry' : 'entries') + ' — winners drawn in the members’ feed.</div>';
    if (st && st.jackpotSoon) html += '<div class="jackteaser"><span class="jt-coin">🪙</span>'
      + '<div><div class="jt-t">MEGA JACKPOT — real $NORMIE</div>'
      + '<div class="jt-d">Coming soon. When it’s live, the rarest spin pays out real tokens.</div></div>'
      + '<span class="jt-soon">SOON</span></div>';
    el.innerHTML = html;
  }
  async function renderWheel(pk, token) {
    var box = document.getElementById('wheel');
    var st;
    try { st = await (await fetch('/api/nq/wheel/status?wallet=' + pk + '&token=' + encodeURIComponent(token))).json(); } catch (e) { return; }
    if (!st || !st.ok) return;
    box.style.display = 'block';
    // refresh the preview rail with live status (featured world + any pass this wallet holds)
    try { renderPreview(st); } catch (e) {}
    var oddsTxt = (st.odds || []).map(function (o) { return (ITEM_META[o.item] ? ITEM_META[o.item].emoji : '') + ' ' + o.pct + '%'; }).join('  ·  ');
    box.innerHTML =
      '<div class="wheelcard"><h2>🎡 DAILY SPIN</h2>'
      + '<div class="cap">One free spin a day — every spin wins a game boost.'
        + (st.vip ? '<br>🎉 <b>Bonus spins</b> drop a few times a day — check back!'
            + (st.preview && st.preview.label ? '<br>🎟️ Land the ticket to unlock <b>' + esc(st.preview.label) + '</b> — hidden prizes inside.' : '')
                  : '<br><span style="color:#6e6a86">VIP seats get better odds, bonus spins, and hidden-world Preview Passes.</span>') + '</div>'
      + (st.bonusReady && !st.dailyReady ? '<div class="cap" style="color:#ffd23f">🎉 BONUS SPIN AVAILABLE NOW!</div>' : '')
      + wheelSvg(st.odds)
      + '<button class="spinbtn" id="spinbtn">SPIN</button>'
      + '<div class="wheelmsg" id="wheelmsg"></div>'
      + '<div class="odds" id="wheelcd"></div>'
      + '<div class="odds">' + esc(oddsTxt) + '</div>'
      // The unclaimed count used to hide at 11px in the odds line. It is the one thing on this
      // page with something waiting on the other end, so it gets its own line and a way to go get it.
      + (st.pending ? '<span class="pend">🎁 ' + st.pending + ' item' + (st.pending === 1 ? '' : 's')
          + ' waiting for you — <a href="' + GAME_URL + '">open Normie Quest</a> to collect.</span>' : '')
      + '<div id="jackpot"></div>'
      + '</div>';
    try { renderJackpot(st); } catch (e) {}
    var btn = document.getElementById('spinbtn'), msg = document.getElementById('wheelmsg'), wheelEl = document.getElementById('thewheel'), cd = document.getElementById('wheelcd');
    wheelRot = 0;   // the SVG group above was just rebuilt at 0° — the accumulator must match it
    var cdTimer = null;   // single countdown interval — cleared on every re-lock so stale ones can't flicker the button
    function armSpin(bonus) {   // enable the button for a (regular or bonus) spin
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      btn.disabled = false; btn.textContent = 'SPIN'; cd.textContent = '';
      msg.innerHTML = bonus ? '🎉 <b>BONUS SPIN</b> ready — tap SPIN 👇' : 'Tap SPIN 👇';
      btn.onclick = doSpin;
    }
    function lockUntil() {
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      // next chance = the SOONER of tomorrow's daily reset or the next bonus-spin window
      var bonusIsSooner = (st.nextBonusAt || Infinity) < (st.nextSpinAt || Infinity);
      btn.disabled = true; btn.textContent = bonusIsSooner ? 'BONUS SPIN SOON' : 'COME BACK TOMORROW';
      var tick = function () {   // countdown lives in its OWN line so it never clobbers a prize message
        var nextChance = Math.min(st.nextSpinAt || Infinity, st.nextBonusAt || Infinity);   // re-read (may update)
        var left = (isFinite(nextChance) ? nextChance : 0) - Date.now();
        cd.innerHTML = ((st.nextBonusAt || Infinity) < (st.nextSpinAt || Infinity) ? '🎉 Next bonus spin in <b>' : 'Next spin in <b>') + fmtCountdown(left) + '</b>';
        if (left <= 0) { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } btn.disabled = false; btn.textContent = 'SPIN'; cd.textContent = ''; btn.onclick = doSpin; return; }
      };
      tick(); cdTimer = setInterval(tick, 30000);
    }
    async function doSpin() {
      if (btn.disabled) return;
      btn.disabled = true; btn.textContent = 'SPINNING…'; msg.textContent = '';
      var res;
      try { res = await (await fetch('/api/nq/wheel/spin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ wallet: pk, token: token }) })).json(); } catch (e) { res = { ok: false }; }
      // ⚠ Only a VIP has bonus windows. rewards.spin() returns nextBonusAt to EVERYONE, and
      // copying it into `st` made the countdown tell a free player "🎉 Next bonus spin in 1h 7m"
      // — a perk they will never get, promised by a bug. Adopt it only when st.vip.
      if (!res.ok) {
        if (res.error === 'already_spun') { st.nextSpinAt = res.nextSpinAt; if (st.vip) st.nextBonusAt = res.nextBonusAt; lockUntil(); }
        else { btn.disabled = false; btn.textContent = 'SPIN'; msg.textContent = 'Spin failed — try again.'; }
        return;
      }
      // wedgeCenter comes from the layout wheelSvg just drew, so targeting stays right whatever
      // the odds table says. Fixes a carried bug too: wheelRot survived across re-renders while
      // the (rebuilt) wheel element was back at 0°, so the first spin after any re-render landed
      // offset by the previous session's rotation. renderWheel now zeroes it (below).
      var center = wedgeCenter[res.prize] || 0;
      var targetMod = (360 - center) % 360, cur = ((wheelRot % 360) + 360) % 360;
      wheelRot += 5 * 360 + ((targetMod - cur + 360) % 360) + (Math.random() * 22 - 11);
      wheelEl.style.transform = 'rotate(' + wheelRot + 'deg)';
      setTimeout(function () {
        var m = ITEM_META[res.prize] || { emoji: '🎁', name: res.prize };
        if (res.prize === 'preview' && res.pass) {
          // 🎟️ Preview Pass win: not a banked item — a live unlock. Surface the play link and
          // repaint the rail so the pass banner + unlocked card appear immediately.
          msg.innerHTML = (res.bonus ? '🎉 <b>BONUS SPIN!</b> ' : '') + '🎟️ <b>PREVIEW PASS</b> to ' + esc(res.pass.label || 'a hidden world')
            + '! <a href="' + GAME_URL + '?room=' + encodeURIComponent(res.pass.room) + '" target="_blank" rel="noopener">Play it now →</a>';
          st.pass = res.pass;
          try { renderPreview(st); } catch (e) {}
        } else if (res.prize === 'raffle') {
          // 🎫 a drawing entry — banked to a running count, not a game item. Update the tally.
          st.raffle = res.entries;
          msg.innerHTML = (res.bonus ? '🎉 <b>BONUS SPIN!</b> ' : '') + '🎫 <b>DRAWING ENTRY</b> banked'
            + (res.entries ? ' — you now have <b>' + res.entries + '</b> ' + (res.entries === 1 ? 'entry' : 'entries') : '')
            + '. Winners are drawn in the members’ feed.';
          try { renderJackpot(st); } catch (e) {}
        } else if (res.prize === 'heart') {
          // 💗 Extra Heart buff — mirror the server's expiry into same-origin localStorage so the game
          // (which reads nqHeartBuffUntil at every level start) grants 4 hearts. Same device: instant.
          var exp = (res.buff && res.buff.expires) || (Date.now() + 24 * 3600e3);
          try { localStorage.setItem('nqHeartBuffUntil', String(exp)); } catch (e) {}
          st.heartBuff = { expires: exp };
          msg.innerHTML = (res.bonus ? '🎉 <b>BONUS SPIN!</b> ' : '') + '💗 <b>EXTRA HEART</b> for 24h — '
            + '<b>4 hearts</b> on every level! Live now — <a href="' + GAME_URL + '">open Normie Quest</a>.';
          try { renderJackpot(st); } catch (e) {}
        } else {
          msg.innerHTML = (res.bonus ? '🎉 <b>BONUS SPIN!</b> ' : '') + m.emoji + ' <b>' + esc(m.name) + '</b>! Banked to your wallet — '
            + '<a href="' + GAME_URL + '">open Normie Quest</a> to use it.';
        }
        st.nextSpinAt = res.nextSpinAt; if (st.vip) st.nextBonusAt = res.nextBonusAt;
        // a bonus spin may STILL be open (e.g. the daily was just consumed inside a bonus window) —
        // keep the button live for it instead of locking the player out until reload. VIP only:
        // the server refuses a bonus spin to a free wallet, so offering the button would just fail.
        if (st.vip && res.bonusAvailable) { cd.innerHTML = '🎉 <b>Bonus spin available now!</b>'; armSpin(true); }
        else lockUntil();
      }, 4300);
    }
    if (!st.canSpin) { lockUntil(); return; }
    armSpin(st.bonusReady && !st.dailyReady);
  }

  // remembered auth → straight in
  var saved = null; try { saved = JSON.parse(localStorage.getItem('nqLoungeAuth') || 'null'); } catch (e) {}
  if (saved && saved.pubkey && saved.token) {
    // Hide the gate while the remembered session is being restored — it used to render the
    // connect buttons underneath and flash them at every returning member.
    document.getElementById('gate').style.display = 'none';
    openLounge(saved.pubkey, saved.token).catch(function (e) {
      document.getElementById('gate').style.display = '';
      errEl.textContent = String((e && e.message) || '');
      renderButtons();
    });
  } else {
    renderButtons();
  }
  // Late Wallet-Standard registrations (Jupiter) — only worth redrawing if we are still on the gate.
  setTimeout(function () { if (document.getElementById('gate').style.display !== 'none') renderButtons(); }, 600);
})();
</script>
