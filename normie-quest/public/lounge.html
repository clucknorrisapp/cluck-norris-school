<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0e">
<link rel="apple-touch-icon" href="/nq-assets/apple-touch-icon.png">
<title>The Lounge · Normie Quest</title>
<!-- The shared brand system. This page used to carry a private palette block, two stacked themes
     and thirteen priority overrides; all of that is gone. theme.css owns the tokens, and it pulls
     the brand faces from Google Fonts via @import — the one thing this page did not do before, and
     a deliberate trade: the brand type system in exchange for the old offline-first stance. The
     font tokens fall back to the platform stack if the faces do not load. -->
<link rel="stylesheet" href="/theme.css">
<style>
  /* Obsidian and brass. The custom properties below are NEW names set on `body` — no theme token
     is redefined anywhere in this file, and the page declares no palette block of its own. */
  * { box-sizing: border-box; }
  body {
    --brass: rgba(255,182,39,.34);
    --brass-soft: rgba(255,182,39,.13);
    --brass-glow: rgba(255,182,39,.10);
    --hair: rgba(255,255,255,.06);
    --shade: 0 18px 44px rgba(0,0,0,.55);
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    -webkit-text-size-adjust: 100%;
  }
  /* ONE static warm glow, behind the wheel only. No aurora, no grid, no starfield, no rotation. */
  .glow {
    position: fixed; left: 50%; top: 0; width: 720px; height: 460px; transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--brass-glow), transparent 72%);
    pointer-events: none; z-index: 0;
  }
  .wrap {
    position: relative; z-index: 1; max-width: 640px; margin: 0 auto;
    padding: 22px max(14px, env(safe-area-inset-left)) calc(36px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
  }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- wordmark ------------------------------------------------------------------------- */
  .lx-head { text-align: center; margin: 6px 0 20px; }
  .lx-head h1 { margin: 0; }
  .lx-mark { display: block; width: min(320px, 88%); height: auto; margin: 0 auto; }
  .lx-kicker { margin: 10px 0 0; font-family: var(--mono); font-size: 12.5px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; }

  /* ---- fixtures ------------------------------------------------------------------------- */
  .fx {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; margin: 0 0 32px; box-shadow: var(--shade), inset 0 1px 0 var(--hair);
  }
  @media (min-width: 480px) { .fx { padding: 28px; } }
  .eyebrow {
    display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
    font-family: var(--disp); font-size: 13px; font-weight: 400; letter-spacing: 2.8px;
    text-transform: uppercase; color: var(--gold);
  }
  .eyebrow::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--brass), transparent); }
  .prose { margin: 0 0 10px; font-size: 15px; line-height: 1.6; color: var(--body-text); }
  .prose:last-child { margin-bottom: 0; }
  .fine { margin: 10px 0 0; font-size: 12.5px; line-height: 1.65; color: var(--muted); }
  .num { font-family: var(--mono); }
  .ic { display: inline-flex; width: 16px; height: 16px; vertical-align: -3px; }
  .ic svg { width: 16px; height: 16px; display: block; }

  /* ---- buttons -------------------------------------------------------------------------- */
  .btn {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 44px; padding: 12px 20px; border: 1px solid transparent; border-radius: 12px;
    font-family: var(--body); font-size: 15px; font-weight: 600; letter-spacing: .4px; cursor: pointer;
    background: linear-gradient(180deg, #FFC957, var(--gold)); color: #2a1b02; text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.34);
  }
  .btn + .btn { margin-top: 10px; }
  .btn.ghost { background: none; color: var(--text); border-color: var(--brass); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--gold); }
  .btn.sm { width: auto; padding: 10px 14px; font-size: 13px; }
  /* Disabled reads NEUTRAL GREY — a faded brass gradient reads as broken, not inactive. */
  .btn:disabled { background: #22242a; color: var(--muted); border-color: var(--border); box-shadow: none; cursor: default; }
  .btn:disabled::after { content: none; }
  a.lnk { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; }

  /* ---- status bar (backdrop-filter #1 of exactly two) ------------------------------------ */
  .bar {
    position: sticky; top: 0; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 0 0 32px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 16px;
    background: rgba(20,21,26,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shade);
  }
  /* Identity stacks (address over provider name) so the whole bar stays two short rows on a phone
     — at 320px the row still wraps rather than overflowing, and nothing here is a scroll container. */
  .bar .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
  .bar .who .ic { color: var(--gold); flex: none; }
  .bar .id { display: flex; flex-direction: column; min-width: 0; }
  .bar .addr { font-family: var(--mono); font-size: 14px; line-height: 1.3; color: var(--text); }
  .bar .prov { font-size: 12.5px; line-height: 1.3; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    flex: none; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--brass);
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 1.4px; color: var(--gold); text-transform: uppercase;
  }
  .pill.guest { border-color: var(--border); color: var(--sub); }
  .bar .counts { flex: 1 0 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bar .ct { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; border: 1px solid var(--border); border-radius: 11px; padding: 6px 9px; background: var(--card2); }
  .bar .ct .k { font-size: 12.5px; letter-spacing: 1.2px; color: var(--sub); text-transform: uppercase; }
  .bar .ct .v { font-family: var(--mono); font-size: 16px; color: var(--text); }

  /* ---- the wheel (the centrepiece) ------------------------------------------------------- */
  .plinth {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    margin: 2px 0 16px; padding: 18px 12px 16px; border-radius: 16px;
    border: 1px solid var(--brass-soft); background: rgba(16,17,22,.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);   /* backdrop-filter #2 of two */
    box-shadow: inset 0 1px 0 var(--hair);
  }
  .plinth .disk { position: relative; width: min(340px, 78vw); max-width: 100%; }
  .plinth svg.wheel { display: block; width: 100%; height: auto; }
  #nqRotor { transform-origin: 130px 130px; }
  #nqPointer { transition: opacity .4s ease; }
  .spinwrap { width: 100%; max-width: 300px; }
  .btn.spin { font-family: var(--mono); font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .btn.spin.ready::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 38%, rgba(255,255,255,.42) 50%, transparent 62%);
    background-size: 240% 100%; animation: lxSweep 6s ease-in-out infinite;
  }
  @keyframes lxSweep { 0% { background-position: 150% 0; } 55%, 100% { background-position: -150% 0; } }
  @keyframes lxSettle { 0% { transform: rotate(0deg); } 35% { transform: rotate(.55deg); } 70% { transform: rotate(-.3deg); } 100% { transform: rotate(0deg); } }
  .settle { animation: lxSettle .42s ease-out 1; }
  .spent { display: block; margin-top: 8px; font-family: var(--mono); font-size: 13px; color: var(--sub); text-align: center; }
  .msg { margin: 4px 0 0; min-height: 22px; font-size: 15px; line-height: 1.6; color: var(--body-text); text-align: center; }
  .won { font-family: var(--disp); font-size: 17px; font-weight: 400; letter-spacing: 2.2px; color: var(--gold); text-transform: uppercase; }
  .oddsline { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; margin: 14px 0 0; }
  .oddsline span { font-family: var(--mono); font-size: 12.5px; color: var(--sub); }

  /* ---- perks ----------------------------------------------------------------------------- */
  .perk { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-top: 1px solid var(--border); }
  .perk:first-of-type { border-top: 0; padding-top: 0; }
  .perk .ic { color: var(--green); margin-top: 3px; flex: none; }
  .perk .t { margin: 0; font-size: 15px; line-height: 1.5; color: var(--body-text); }
  .perk .t b { font-family: var(--mono); font-weight: 400; color: var(--text); }

  /* ---- the vault -------------------------------------------------------------------------- */
  .vault { display: flex; align-items: center; gap: 16px; padding: 4px 0 2px; }
  .vault .door { flex: none; width: 104px; height: 104px; }
  .vault .sealed {
    display: inline-block; margin: 0 0 8px; padding: 4px 11px; border: 1px solid var(--brass); border-radius: 999px;
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase;
  }
  @media (max-width: 359px) { .vault { flex-direction: column; align-items: flex-start; } }

  /* ---- rooms ------------------------------------------------------------------------------ */
  .rooms { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 480px) { .rooms { grid-template-columns: repeat(2, 1fr); } }
  .room { position: relative; display: block; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--card2); text-decoration: none; color: inherit; }
  .room .art { position: relative; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; }
  .room .art svg { width: 46%; height: auto; opacity: .9; }
  .room.locked .art { filter: grayscale(.8) brightness(.55); }
  .room .art::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px var(--brass-soft); }
  .room .tag { position: absolute; left: 9px; top: 9px; z-index: 1; padding: 4px 9px; border-radius: 999px; background: rgba(11,12,14,.84); border: 1px solid var(--brass-soft); font-family: var(--mono); font-size: 12.5px; letter-spacing: 1.6px; color: var(--sub); text-transform: uppercase; }
  .room.open .tag { color: var(--green); border-color: rgba(123,226,107,.4); }
  .room .meta { padding: 12px 13px 14px; }
  .room .meta .n { margin: 0; font-size: 15px; line-height: 1.4; color: var(--text); }
  .room .meta .d { margin: 4px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }

  /* ---- feed -------------------------------------------------------------------------------- */
  .post { border-top: 1px solid var(--border); padding: 16px 0; }
  .post:first-of-type { border-top: 0; padding-top: 2px; }
  .post .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; letter-spacing: 1.4px; color: var(--sub); text-transform: uppercase; }
  /* h3 keeps its heading semantics but NOT the display face — the display font is reserved for the
     three uses the spec names (wordmark, eyebrows, a banked reward's name). 0-2-0 beats theme's 0-0-1. */
  .post .ttl { margin: 9px 0 5px; font-family: var(--body); font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--text); }
  .post .body { margin: 0; font-size: 15px; line-height: 1.6; color: var(--body-text); white-space: pre-wrap; }
  .post .ts { margin: 10px 0 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .quiet { text-align: center; padding: 10px 0 2px; }
  .quiet .rule { height: 1px; margin: 0 auto 14px; max-width: 180px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  .quiet .t { margin: 0 0 6px; font-family: var(--disp); font-size: 13px; font-weight: 400; letter-spacing: 2.8px; color: var(--gold); text-transform: uppercase; }

  /* ---- gate + footer ------------------------------------------------------------------------ */
  .err { margin: 10px 0 0; min-height: 18px; font-size: 12.5px; line-height: 1.6; color: var(--red-soft); }
  .foot { text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    .btn.spin.ready::after { animation: none; }
    .settle { animation: none; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <header class="lx-head">
    <h1>
      <span class="vh">The Lounge</span>
      <svg class="lx-mark" viewBox="0 0 320 92" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="lxBrass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFD98A"/><stop offset="52%" stop-color="#FFB627"/><stop offset="100%" stop-color="#C98514"/>
          </linearGradient>
        </defs>
        <text x="160" y="24" text-anchor="middle" style="font-family:var(--mono)" font-size="13" letter-spacing="6" fill="#C9A892">THE</text>
        <text x="160" y="72" text-anchor="middle" style="font-family:var(--disp)" font-size="52" letter-spacing="4" fill="url(#lxBrass)">LOUNGE</text>
        <rect x="34" y="84" width="252" height="1" fill="#FFB627" opacity=".45"/>
        <circle cx="160" cy="84.5" r="3" fill="#FFB627"/>
      </svg>
    </h1>
    <p class="lx-kicker">Normie Quest · Members' room</p>
  </header>

  <div class="bar" id="nqBar"></div>

  <section class="fx" id="nqWheel"></section>
  <section class="fx" id="nqPerks" hidden></section>
  <section class="fx" id="nqGate" hidden></section>
  <section class="fx" id="nqVault" hidden></section>
  <section class="fx" id="nqRooms" hidden></section>
  <section class="fx" id="nqFeed" hidden></section>

  <section class="fx foot">
    <a class="btn" href="/normie-quest-x7" id="nqPlay"><span class="ic"></span>Play Normie Quest</a>
    <p class="fine">A companion room to the game. Nothing here moves funds, and connecting only ever asks for a read-only signature.</p>
  </section>
</main>
<script src="/cluck-wallet.js?v=2"></script>
<script src="/cluck-util.js"></script>
<script>
(function () {
  'use strict';

  // ── shared modules ────────────────────────────────────────────────────────────────────────
  // The wallet registry (/cluck-wallet.js — 18 wallets, Wallet Standard discovery, deep links) and
  // /cluck-util.js. This page used to carry a private four-wallet detector and a private esc() that
  // did not escape quotes while being interpolated into attributes. Both are gone.
  var CW = window.CluckWallet || null;
  var CU = window.CluckUtil || null;
  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(t) {
    if (CU && CU.esc) return CU.esc(t);
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; });
  }
  function shortAddr(a) { return (CU && CU.shortAddr) ? CU.shortAddr(a, 4, 4) : String(a || ''); }

  var B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58encode(bytes) {
    var d = [], s = '', i, j, c, n;
    for (i = 0; i < bytes.length; i++) { c = bytes[i]; n = 0;
      for (j = 0; j < d.length || c; j++) { n = (d[j] || 0) * 256 + c; d[j] = n % 58; c = Math.floor(n / 58); } }
    for (i = 0; i < bytes.length && bytes[i] === 0; i++) s += '1';
    for (i = d.length - 1; i >= 0; i--) s += B58[d[i]];
    return s;
  }

  var GAME_URL = '/normie-quest-x7';
  var REDUCED = false;
  try { REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}

  // ── icons ─────────────────────────────────────────────────────────────────────────────────
  // 16px inline SVG in currentColor, in place of this page's functional emoji. The wheel keeps the
  // reward emoji — there they ARE the reward's identity, not chrome — and the connect buttons keep
  // the shared registry's own brand icons.
  var IC = {
    crown: '<path d="M1.4 5.1 4.6 7.6 8 2.6l3.4 5 3.2-2.5-1.2 7.3H2.6z"/>',
    lock: '<path d="M4.6 6.6V5a3.4 3.4 0 0 1 6.8 0v1.6H13V14H3V6.6zm1.6 0h3.6V5a1.8 1.8 0 0 0-3.6 0z" fill-rule="evenodd"/>',
    ticket: '<path d="M1.4 4.2h13.2v2.3a1.6 1.6 0 0 0 0 3.1v2.2H1.4v-2.2a1.6 1.6 0 0 0 0-3.1z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 5.4v5.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.6 1.4"/>',
    heart: '<path d="M8 13.9C4.3 11.5 1.6 9.1 1.6 6.4a3.2 3.2 0 0 1 6.4-1.2 3.2 3.2 0 0 1 6.4 1.2c0 2.7-2.7 5.1-6.4 7.5z"/>',
    gift: '<path d="M2.2 7.4h11.6V14H2.2zM1.2 4.4h13.6v3H1.2zM8 4.4V14" fill="none" stroke="currentColor" stroke-width="1.3"/>',
    play: '<path d="M4.2 2.4 13 8l-8.8 5.6z"/>',
    check: '<path d="M2.6 8.4 6 11.8l7.4-7.6" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  };
  function icon(name) {
    return '<span class="ic">' + (IC[name] ? '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' + IC[name] + '</svg>' : '') + '</span>';
  }
  document.getElementById('nqPlay').firstElementChild.innerHTML =
    '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' + IC.play + '</svg>';

  // ── reward names + wheel colours ──────────────────────────────────────────────────────────
  var ITEM_META = {
    disc: { emoji: '🥏', name: 'SOL Discs +5' }, vial: { emoji: '❤️', name: 'Full Heal' }, shield: { emoji: '🛡️', name: 'Audit Shield' },
    star: { emoji: '⭐', name: 'Star Power' }, bomb: { emoji: '🚀', name: 'Air Strike' }, preview: { emoji: '🎟️', name: 'Room Pass' },
    raffle: { emoji: '🎫', name: 'Drawing Entry' }, heart: { emoji: '💗', name: 'Extra Heart · 24h' }
  };
  // The one place a colour other than brass is allowed: the wedges.
  var WEDGE_HUE = { disc: '#E8B14A', vial: '#E8664A', shield: '#4AA8C8', star: '#FFD36B', bomb: '#FF8A4A', preview: '#B08AE8', raffle: '#5CCB86', heart: '#F07AAE' };
  var LACQUER = ['#171310', '#221a12'];

  // ── page state ────────────────────────────────────────────────────────────────────────────
  var S = { pubkey: null, token: null, walletName: null, vip: false, items: null, entries: null, cash: null };
  var countdown = null;              // the ONE countdown interval — cleared on re-lock, disconnect and teardown
  var stopWatch = null;              // CluckWallet.watch() stopper
  function clearCountdown() { if (countdown) { clearInterval(countdown); countdown = null; } }
  function blankState() { return { pubkey: null, token: null, walletName: null, vip: false, items: null, entries: null, cash: null }; }

  var elBar = document.getElementById('nqBar'), elWheel = document.getElementById('nqWheel'),
      elPerks = document.getElementById('nqPerks'), elGate = document.getElementById('nqGate'),
      elVault = document.getElementById('nqVault'), elRooms = document.getElementById('nqRooms'),
      elFeed = document.getElementById('nqFeed');
  function show(el, html) { el.innerHTML = html; el.hidden = false; }
  function hide(el) { el.innerHTML = ''; el.hidden = true; }

  // ── formatting ────────────────────────────────────────────────────────────────────────────
  function fmtLeft(ms) {
    if (!(ms > 0)) return 'now';
    var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
    if (h <= 0) return m >= 1 ? m + 'm' : 'under a minute';
    return h + 'h ' + m + 'm';
  }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // The old stamp was toUTCString().replace(':00 GMT',' UTC'), which only matched when the post
  // happened to land on second zero — one time in sixty. Build it from the parts instead.
  function fmtStamp(ts) {
    var d = new Date(Number(ts) || 0);
    if (!isFinite(d.getTime())) return '';
    return pad(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear()
      + ' · ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ' UTC';
  }

  // ── the wheel ─────────────────────────────────────────────────────────────────────────────
  var CX = 130, R = 104, wedgeCenter = {}, rotation = 0;
  function pt(a, r) { var rad = a * Math.PI / 180; return { x: (CX + r * Math.sin(rad)).toFixed(2), y: (CX - r * Math.cos(rad)).toFixed(2) }; }
  function arcPath(a0, a1, r) {
    var p0 = pt(a0, r), p1 = pt(a1, r);
    return 'M' + p0.x + ' ' + p0.y + ' A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + p1.x + ' ' + p1.y;
  }
  // Wedge span IS the published odds: sized from the raw `weight` the server sends, falling back to
  // pct for an older response. Per-entry rounded percentages need not sum to 100; weights always do.
  function wheelSvg(odds) {
    var list = (odds && odds.length) ? odds : [{ item: 'disc', weight: 70 }, { item: 'vial', weight: 22 }, { item: 'shield', weight: 8 }];
    var total = list.reduce(function (s, o) { return s + (Number(o.weight != null ? o.weight : o.pct) || 0); }, 0) || 1;
    var wedges = '', a0 = 0;
    wedgeCenter = {};
    list.forEach(function (o, i) {
      var w = Number(o.weight != null ? o.weight : o.pct) || 0;
      var span = w / total * 360;
      if (span <= 0) return;
      var a1 = a0 + span, mid = a0 + span / 2;
      wedgeCenter[o.item] = mid;
      var p0 = pt(a0, R), p1 = pt(a1, R);
      var hue = WEDGE_HUE[o.item] || '#C9A892';
      var m = ITEM_META[o.item] || { emoji: '🎁' };
      var e = pt(mid, R * 0.64), t = pt(mid, R * 0.36);
      var inset = Math.min(6, span / 5);
      wedges += '<path d="M' + CX + ' ' + CX + ' L' + p0.x + ' ' + p0.y + ' A' + R + ' ' + R + ' 0 ' + (span > 180 ? 1 : 0) + ' 1 ' + p1.x + ' ' + p1.y + ' Z" '
        + 'fill="' + LACQUER[i % 2] + '" stroke="rgba(255,182,39,.22)" stroke-width="1"/>'
        + '<path d="' + arcPath(a0 + inset, a1 - inset, R - 9) + '" fill="none" stroke="' + hue + '" stroke-width="2" stroke-linecap="round" opacity=".85"/>'
        + '<text x="' + e.x + '" y="' + e.y + '" font-size="21" text-anchor="middle" dominant-baseline="central">' + m.emoji + '</text>'
        + '<text x="' + t.x + '" y="' + t.y + '" style="font-family:var(--mono)" font-size="11" fill="' + hue + '" text-anchor="middle" dominant-baseline="central">'
        + Math.round(w / total * 100) + '%</text>';
      a0 = a1;
    });
    var studs = '';
    for (var k = 0; k < 12; k++) {
      var s = pt(k * 30, 115);
      studs += '<circle cx="' + s.x + '" cy="' + s.y + '" r="2.6" fill="' + (k % 2 ? '#FFB627' : '#8A6212') + '"/>';
    }
    return '<div class="disk"><svg class="wheel" viewBox="0 0 260 260" role="img" aria-label="The daily wheel. Each wedge is sized by its published odds.">'
      + '<circle cx="130" cy="130" r="126" fill="#0b0c0e"/>'
      + '<circle cx="130" cy="130" r="115" fill="none" stroke="#3a2f14" stroke-width="15"/>'
      + '<circle cx="130" cy="130" r="122.5" fill="none" stroke="rgba(255,182,39,.5)" stroke-width="1"/>'
      + '<circle cx="130" cy="130" r="107.5" fill="none" stroke="rgba(255,182,39,.3)" stroke-width="1"/>'
      + '<g id="nqRotor">' + wedges + '</g>'
      + studs
      + '<circle cx="130" cy="130" r="21" fill="#15161b" stroke="#FFB627" stroke-width="2"/>'
      + '<circle cx="130" cy="130" r="14" fill="none" stroke="rgba(255,182,39,.4)" stroke-width="1"/>'
      + '<circle cx="130" cy="130" r="4.5" fill="#FFB627"/>'
      + '<path id="nqPointer" d="M130 6 L119.5 34 L130 28.5 L140.5 34 Z" fill="#FFB627" stroke="#7a5c10" stroke-width="1"/>'
      + '</svg></div>';
  }

  function oddsLine(odds) {
    return '<div class="oddsline">' + (odds || []).map(function (o) {
      var m = ITEM_META[o.item] || { emoji: '🎁', name: o.item };

  // ── pre-connect: the wheel painted from the wallet-less public read ───────────────────────

  // Room art is DRAWN, not shipped: a plate per room id, keyed by the id the server sent. (The old
  // rail hardcoded two room ids and about 100 KB of inline base64 screenshots.)
  var ROOM_ART = {
    beach: { grad: 'linear-gradient(180deg,#123a44,#1d2a2e)', svg: '<svg viewBox="0 0 64 40" fill="none" stroke="#8fd6c9" stroke-width="2.2" stroke-linecap="round"><path d="M2 26c6-6 12-6 18 0s12 6 18 0 12-6 18 0"/><path d="M2 34c6-6 12-6 18 0s12 6 18 0 12-6 18 0"/><path d="M40 6l7 12H33z"/></svg>' },
    sandcastle: { grad: 'linear-gradient(180deg,#3f3016,#241d10)', svg: '<svg viewBox="0 0 64 40" fill="none" stroke="#f0c877" stroke-width="2.2" stroke-linejoin="round"><path d="M8 34V16h8V8l6 6 6-6v8h8v18z"/><path d="M38 34V22h18v12z"/></svg>' },
    _more: { grad: 'linear-gradient(180deg,#1e2029,#131419)', svg: '<svg viewBox="0 0 64 40" fill="none" stroke="#C9A892" stroke-width="2.2" stroke-linejoin="round"><path d="M12 34V13l20-8 20 8v21z"/><path d="M26 34V22h12v12z"/></svg>' }
  };
  function roomCard(room, label, blurb, unlocked, left) {

      + '<span class="tag">' + esc(unlocked ? 'Open · ' + left : 'Locked') + '</span>'

      : '<div class="room locked">' + inner + '</div>';

  // Room ids come from the status response: the room featured this rotation, plus this wallet's own
  // open pass when that is a different room.
  function renderRooms(featured, pass) {
    var cards = '';

      cards += roomCard(pass.room, pass.label || 'A members’ room', 'Your pass is open. Enter from here.', true, fmtLeft((pass.expires || 0) - Date.now()));
    }
    if (featured && featured.room && (!pass || pass.room !== featured.room)) {

  function renderFeed(posts) {

        + '<p class="ts">' + esc(fmtStamp(p.ts)) + '</p></article>';

  function renderGuestCard() {
    show(elFeed,
      '<h2 class="eyebrow">A seat at the table</h2>'
      + '<p class="prose">The daily spin above is yours either way. A member’s seat adds four things:</p>'

      + '<div class="perk">' + icon('check') + '<p class="t">Extra spins in the members’ windows through the day.</p></div>'
      + '<div class="perk">' + icon('check') + '<p class="t">The floor — notes posted for members only.</p></div>'
      + '<div class="perk">' + icon('check') + '<p class="t">Members’ rooms — hidden levels open to members first.</p></div>'
      + '<p class="fine">Seats come from meeting the game’s holding requirement, or from a community competition. Terms are still in testing.</p>');

  // ── the door ──────────────────────────────────────────────────────────────────────────────
  function setErr(t) { var e = document.getElementById('nqErr'); if (e) e.textContent = t || ''; }
  function renderGate() {
    var body;
    if (!CW) {
      show(elGate, '<h2 class="eyebrow">The door</h2><p class="prose">The wallet module did not load. Reload this page to connect.</p>');
      return;
    }
    var list = [];
    try { list = CW.available() || []; } catch (e) { list = []; }
    if (list.length) {
      body = '<p class="prose">Connect a Solana wallet and sign one message. It is a read-only signature: no transaction, no approval, nothing to pay.</p>'
        + list.map(function (w) {
          return '<button class="btn" type="button" data-wallet="' + esc(w.id) + '">' + esc(w.icon || '') + ' Connect ' + esc(w.name) + '</button>';
        }).join('');
    } else if (CW.isMobile && CW.isMobile()) {
      // The mobile deep-link branch, now driven by the shared registry's own link table.
      body = '<p class="prose">This browser cannot hold a wallet. Open the Lounge inside your wallet’s browser:</p>'
        + CW.mobileLinksHTML({ what: 'the Lounge', btnClass: 'btn', hintClass: 'fine' })
        + '<button class="btn ghost" type="button" id="nqCopy">Copy this link</button>';
    } else {
      body = '<p class="prose">No Solana wallet is available in this browser. Install one, or open this page inside your wallet’s own browser, then reload.</p>';
    }
    show(elGate, '<h2 class="eyebrow">The door</h2>' + body + '<p class="err" id="nqErr" role="status" aria-live="polite"></p>');
    Array.prototype.forEach.call(elGate.querySelectorAll('[data-wallet]'), function (b) {
      b.onclick = function () { connect(b.getAttribute('data-wallet')); };
    });
    var cp = document.getElementById('nqCopy');
    if (cp) {
      cp.onclick = function () {
        var done = function () { cp.textContent = 'Link copied — paste it in your wallet’s browser'; };
        if (CU && CU.copyText) CU.copyText(location.href).then(done);
        else window.prompt('Copy this link:', location.href);
      };
    }
  }

  async function connect(id) {
    setErr('');
    try {
      var w = await CW.connect(id);
      var pk = w.pubkey;
      var ch = await (await fetch('/api/nq/wallet/challenge?pubkey=' + encodeURIComponent(pk))).json();
      if (!ch || !ch.ok) throw new Error('The door could not issue a challenge. Try again in a moment.');
      var signed = await w.provider.signMessage(new TextEncoder().encode(ch.message), 'utf8');
      var sig = signed && signed.signature ? signed.signature : signed;
      var vr = await (await fetch('/api/nq/wallet/verify', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pubkey: pk, signature: b58encode(sig), walletName: 'lounge:' + w.name })
      })).json();
      if (!vr || !vr.ok) throw new Error('That signature did not verify. Connect again.');
      try { localStorage.setItem('nqLoungeAuth', JSON.stringify({ pubkey: pk, token: vr.token, walletName: w.name })); } catch (e) {}
      S.walletName = w.name;
      await open(pk, vr.token);
    } catch (e) {
      setErr(String((e && e.message) || e || 'Could not connect.'));
    }
  }

  // Anywhere a wallet can connect it must be able to disconnect: the provider's OWN disconnect()
  // (through the shared registry) AND every piece of local state. nqHeartBuffUntil is included — it
  // used to survive, so the next wallet on a shared device inherited a 24-hour perk it never landed.
  function teardown() {
    clearCountdown();
    S = blankState();
    hide(elPerks); hide(elVault); hide(elFeed);
  }
  function disconnect() {
    try { if (CW && CW.disconnect) CW.disconnect(); } catch (e) {}
    try { localStorage.removeItem('nqLoungeAuth'); } catch (e) {}
    try { localStorage.removeItem('nqHeartBuffUntil'); } catch (e) {}
    teardown();
    renderBar();
    boot();
  }
  // A rejected session is not a transient failure — the stored proof is dead. Bin it, say so once,
  // and put the door back, instead of the old "Spin failed — try again" loop that never resolved.
  function sessionLost(where) {
    try { localStorage.removeItem('nqLoungeAuth'); } catch (e) {}
    teardown();
    renderBar();
    boot(function () {
      setErr('Your session expired' + (where ? ' while ' + where : '') + '. Connect again to pick up where you left off.');
    });
  }

  // ── connected view ────────────────────────────────────────────────────────────────────────
  async function open(pk, token) {
    S.pubkey = pk; S.token = token;
    var q = 'wallet=' + encodeURIComponent(pk) + '&token=' + encodeURIComponent(token);
    var lounge = null, st = null;
    try { lounge = await (await fetch('/api/nq/lounge?' + q)).json(); } catch (e) { lounge = null; }
    if (lounge && lounge.error === 'bad_session') { sessionLost('opening the room'); return; }
    try { st = await (await fetch('/api/nq/wheel/status?' + q)).json(); } catch (e) { st = null; }
    if (st && st.error === 'bad_session') { sessionLost('opening the room'); return; }

    var live = !!(st && st.ok);
    S.vip = !!((lounge && lounge.ok) || (live && st.vip));
    S.items = live ? (st.pending || 0) : null;
    S.entries = live ? (st.raffle || 0) : null;
    S.cash = null;
    renderBar();
    hide(elGate);
    if (stopWatch) { stopWatch(); stopWatch = null; }

    // Each fixture renders exactly ONCE per load — the rail used to paint twice, first static and
    // then again from the status read.
    if (live) renderWheel(st); else renderPublicWheel(null);
    renderPerks(live ? st : null);
    renderVault(live ? st : null);
    renderRooms(live ? st.preview : null, live ? st.pass : null);
    if (S.vip) renderFeed((lounge && lounge.posts) || []); else renderGuestCard();

    // Off-chain points, best-effort: the counter keeps its dash rather than showing a wrong number.
    try {
      var lg = await (await fetch('/api/nq/ledger?' + q)).json();
      if (lg && lg.ok) { S.cash = Number(lg.balance || 0); renderBar(); }
    } catch (e) {}
  }

  function renderWheel(st) {
    clearCountdown();
    show(elWheel,
      '<h2 class="eyebrow">The daily wheel</h2>'
      + '<p class="prose">One spin a day, banked to this wallet. Each wedge is sized by its published odds'
      + (st.vip ? ', and the members’ windows open extra spins through the day.' : ' — a member’s seat reshapes them.') + '</p>'
      + '<div class="plinth">' + wheelSvg(st.odds)
      + '<div class="spinwrap"><button class="btn spin" type="button" id="nqSpin">Spin</button>'
      + '<span class="spent" id="nqCd"></span></div></div>'
      + '<p class="msg" id="nqMsg" role="status" aria-live="polite"></p>'
      + oddsLine(st.odds));

    var btn = document.getElementById('nqSpin'), msg = document.getElementById('nqMsg'),
        cd = document.getElementById('nqCd'), rotor = document.getElementById('nqRotor'),
        pointer = document.getElementById('nqPointer'), disk = elWheel.querySelector('.disk');
    rotation = 0;   // the rotor markup was just rebuilt at 0° — the accumulator must match it

    function ready(bonus) {
      clearCountdown();
      btn.disabled = false; btn.classList.add('ready');
      btn.textContent = bonus ? 'Bonus spin' : 'Spin';
      cd.textContent = '';
      btn.onclick = spin;
    }
    function spent() {
      clearCountdown();
      btn.disabled = true; btn.classList.remove('ready');
      var bonusSooner = (st.nextBonusAt || Infinity) < (st.nextSpinAt || Infinity);
      btn.textContent = bonusSooner ? 'Bonus spin soon' : 'Come back tomorrow';
      var tick = function () {
        var next = Math.min(st.nextSpinAt || Infinity, st.nextBonusAt || Infinity);
        var left = (isFinite(next) ? next : 0) - Date.now();
        cd.textContent = (bonusSooner ? 'Next bonus spin in ' : 'Next spin in ') + fmtLeft(left);
        if (left <= 0) ready(false);
      };
      tick();
      countdown = setInterval(tick, 30000);
    }
    function land(res) {
      var m = ITEM_META[res.landed] || { emoji: '🎁', name: res.landed };
      var name = '<span class="won">' + esc(m.name) + '</span>';
      if (res.landed === 'preview' && res.pass) {
        st.pass = res.pass;
        msg.innerHTML = name + ' — ' + esc(res.pass.label || 'a members’ room') + ' is open to you for 48 hours. '
          + '<a class="lnk" href="' + GAME_URL + '?room=' + encodeURIComponent(res.pass.room) + '">Enter the room</a>.';
        renderRooms(st.preview, st.pass);
      } else if (res.landed === 'raffle') {
        st.raffle = res.entries;
        S.entries = res.entries || 0;
        msg.innerHTML = name + ' banked'
          + (res.entries ? ' — you now hold <span class="num">' + esc(String(res.entries)) + '</span> ' + (res.entries === 1 ? 'entry' : 'entries') : '') + '.';
      } else if (res.landed === 'heart') {
        // Mirror the server's expiry into same-origin localStorage so the game (which reads
        // nqHeartBuffUntil at every level start) grants four hearts on this device immediately.
        var exp = (res.buff && res.buff.expires) || (Date.now() + 24 * 3600e3);
        try { localStorage.setItem('nqHeartBuffUntil', String(exp)); } catch (e) {}
        st.heartBuff = { expires: exp };
        msg.innerHTML = name + ' — four hearts on every level for the next 24 hours. '
          + '<a class="lnk" href="' + GAME_URL + '">Open Normie Quest</a>.';
      } else {
        S.items = (S.items || 0) + 1;
        st.pending = S.items;
        msg.innerHTML = name + ' banked to this wallet — <a class="lnk" href="' + GAME_URL + '">open Normie Quest</a> to use it.';
      }
      renderPerks(st);
      renderBar();
    }
    async function spin() {
      if (btn.disabled) return;
      btn.disabled = true; btn.classList.remove('ready'); btn.textContent = 'Spinning'; msg.textContent = '';
      var res;
      try {
        res = await (await fetch('/api/nq/wheel/spin', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ wallet: S.pubkey, token: S.token })
        })).json();
      } catch (e) { res = null; }
      if (!res || !res.ok) {
        var err = (res && (res.error || res.reason)) || '';
        if (err === 'bad_session') { sessionLost('spinning'); return; }
        if (err === 'already_spun') { st.nextSpinAt = res.nextSpinAt; if (st.vip) st.nextBonusAt = res.nextBonusAt; spent(); return; }
        if (err === 'queue_full') {
          // The spin WAS consumed server-side. Say so, and leave the button spent — no retry loop.
          clearCountdown();
          btn.disabled = true; btn.textContent = 'Spin unavailable';
          msg.textContent = 'Your banked items are at the cap, so there is nowhere to put this one. Collect some in the game and the wheel opens again. This spin was used.';
          return;
        }
        if (err === 'slow_down') {
          btn.disabled = false; btn.classList.add('ready'); btn.textContent = 'Spin';
          msg.textContent = 'That was quick. Give it a moment and tap again.';
          return;
        }
        btn.disabled = false; btn.classList.add('ready'); btn.textContent = 'Spin';
        msg.textContent = 'The spin did not go through. Tap again in a moment.';
        return;
      }
      res.landed = res.prize;   // the server's own field name, read once
      // wedgeCenter comes from the layout wheelSvg just drew, so targeting stays right whatever the
      // odds table says; rotation was zeroed with the rebuilt rotor above.
      var center = wedgeCenter[res.landed] || 0;
      var targetMod = (360 - center) % 360, cur = ((rotation % 360) + 360) % 360;
      var target = rotation + 5 * 360 + ((targetMod - cur + 360) % 360) + (Math.random() * 20 - 10);
      var wait;
      if (REDUCED) {
        // No spin at all: the wheel is placed, the pointer cross-fades over 400ms, and the result
        // follows quickly — a 4.3s message timer would lag a pointer that already snapped.
        rotor.style.transition = 'none';
        rotor.style.transform = 'rotate(' + target + 'deg)';
        pointer.style.opacity = '0';
        setTimeout(function () { pointer.style.opacity = '1'; }, 20);
        wait = 470;
      } else {
        rotor.style.transition = 'transform .12s ease-out';
        rotor.style.transform = 'rotate(' + (rotation - 9) + 'deg)';      // wind back
        setTimeout(function () {
          rotor.style.transition = 'transform 4.2s cubic-bezier(.15,.72,.18,1)';
          rotor.style.transform = 'rotate(' + target + 'deg)';
        }, 130);
        setTimeout(function () {
          disk.classList.add('settle');
          setTimeout(function () { disk.classList.remove('settle'); }, 440);
        }, 4330);
        wait = 4430;
      }
      rotation = target;
      setTimeout(function () {
        land(res);
        st.nextSpinAt = res.nextSpinAt;
        // Only a member has bonus windows; the spin response carries nextBonusAt to everyone, and
        // copying it unconditionally promised a guest a perk they cannot get.
        if (st.vip) st.nextBonusAt = res.nextBonusAt;
        if (st.vip && res.bonusAvailable) ready(true); else spent();
      }, wait);
    }

    if (st.canSpin) ready(st.bonusReady && !st.dailyReady); else spent();
  }

  // ── boot ──────────────────────────────────────────────────────────────────────────────────
  // Pre-connect the page is not empty and it does not ask for anything first: the wheel and the
  // featured room render from a wallet-less, read-only status read, so the signature request
  // follows a reason instead of preceding one.
  async function boot(after) {
    renderBar();
    var pub = null;
    try { pub = await (await fetch('/api/nq/wheel/status?public=1')).json(); } catch (e) { pub = null; }
    var live = !!(pub && pub.ok);
    renderPublicWheel(live ? pub : null);
    renderRooms(live ? pub.featured : null, null);
    renderGate();
    if (stopWatch) { stopWatch(); stopWatch = null; }
    // A wallet's in-app browser can inject its provider after load. The shared registry's watcher
    // redraws the door when that happens, in place of this page's old single 600ms retry.
    if (CW && CW.watch) stopWatch = CW.watch(function () { if (!S.pubkey) renderGate(); });
    if (typeof after === 'function') after();
  }

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('nqLoungeAuth') || 'null'); } catch (e) {}
  renderBar();
  if (saved && saved.pubkey && saved.token) {
    S.walletName = saved.walletName || 'remembered wallet';
    open(saved.pubkey, saved.token).catch(function () { sessionLost(''); });
  } else {
    boot();
  }
})();
</script>
